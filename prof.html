<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon emploi du temps · HorairePro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F7A4E">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: page de consultation en lecture seule — en-tête vert, onglets des jours, cartes de cours ; tableau de la semaine en dessous */
:root{--bg:#F3F4F6;--surface:#FFFFFF;--sunk:#F3F4F6;--ink:#0F1F18;--muted:#6B7A72;--line:#E6EAE8;--accent:#0F7A4E;--accent-2:#0A5C3A;--accent-soft:#E2F3EA;--sh:0 6px 20px rgb(17 24 39 / .06);
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121316;--surface:#1E2025;--sunk:#26282E;--ink:#ECEEF1;--muted:#9BA0A8;--line:#2E3138;--accent:#2FB87B;--accent-2:#0E6B45;--accent-soft:#163A2A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--surface:#1E2025;--sunk:#26282E;--ink:#ECEEF1;--muted:#9BA0A8;--line:#2E3138;--accent:#2FB87B;--accent-2:#0E6B45;--accent-soft:#163A2A;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f)}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-radius:0 0 26px 26px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(18px,env(safe-area-inset-left,0px)) 20px}
.hero small{opacity:.85;font-weight:600;display:block}
.hero h1{margin:4px 0 2px;font-size:24px;font-weight:800;line-height:1.15}
.hero p{margin:0;opacity:.9;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px}
.days button{flex:1;min-width:58px;border:0;background:var(--surface);box-shadow:var(--sh);border-radius:14px;padding:10px 6px;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);color:#fff}
.days button span{display:block;font-size:11px;font-weight:600;opacity:.8}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 0}
.lesson + .lesson{border-top:1px solid var(--line)}
.time{width:62px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.time span{display:block;color:var(--muted);font-weight:500;font-size:12px}
.chip{border-radius:12px;padding:8px 12px;flex:1;min-width:0;background:hsl(var(--h) 70% 91%);color:#0F1F18}
:root[data-theme="dark"] .chip{background:hsl(var(--h) 34% 24%);color:#F0F5F2}
.chip b{display:block;font-size:15px}
.chip span{font-size:12.5px}
.free{color:var(--muted);font-size:13px;padding:6px 0}
.brk{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;table-layout:fixed;font-size:11px}
th{color:var(--muted);font-size:10.5px;letter-spacing:.05em}
td{border-radius:8px;height:40px;text-align:center;vertical-align:middle;background:var(--sunk);padding:2px}
td.h{background:none;color:var(--muted);font-size:10px;width:60px}
td.f{background:hsl(var(--h) 70% 91%);color:#0F1F18;font-weight:700}
td.off{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
td small{display:block;font-weight:500;font-size:9.5px}
.foot{color:var(--muted);font-size:12px;text-align:center}
.err{padding:40px 10px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Chargement…</div></div>
<script>
const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function b64uDec(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return Uint8Array.from(atob(t),c=>c.charCodeAt(0))}
async function unpack(h){const k=h[0],b=b64uDec(h.slice(1));let raw=b;
  if(k==="z"){const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"));raw=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(raw))}
let D=null,day=Math.min(4,Math.max(0,new Date().getDay()-1));if(new Date().getDay()===0||new Date().getDay()===6)day=0;
function render(){const app=document.getElementById("app");const cells={};D.c.forEach(c=>cells[c[0]]=c);const off=new Set(D.off);
  const N=D.cr.length;let list="";
  for(let s=0;s<N;s++){if(s>0&&D.cr[s][2]!==D.cr[s-1][2])list+=`<div class="brk">${s&&+D.cr[s][0].slice(0,2)>=13?"Pause":"Récréation"} · ${esc(D.cr[s-1][1])} – ${esc(D.cr[s][0])}</div>`;
    const k=day+"-"+s;const c=cells[k];if(off.has(k))continue;
    list+=c?`<div class="lesson"><div class="time">${esc(D.cr[s][0])}<span>${esc(D.cr[s][1])}</span></div><div class="chip" style="--h:${+c[4]||0}"><b>${esc(c[1])} · ${esc(c[2])}</b><span>${esc(c[3]||"")}${c[5]?" · "+esc(c[5]):""}</span></div></div>`
      :`<div class="lesson"><div class="time">${esc(D.cr[s][0])}<span>${esc(D.cr[s][1])}</span></div><div class="free">Libre</div></div>`}
  let tab=`<table><thead><tr><th></th>${JOURS.map(j=>`<th>${j.slice(0,3).toUpperCase()}</th>`).join("")}</tr></thead><tbody>`;
  for(let s=0;s<N;s++){tab+=`<tr><td class="h">${esc(D.cr[s][0])}</td>`;for(let d=0;d<5;d++){const k=d+"-"+s;const c=cells[k];tab+=off.has(k)?`<td class="off"></td>`:c?`<td class="f" style="--h:${+c[4]||0}">${esc(c[1])}<small>${esc(c[2])} · ${esc(c[3]||"")}</small></td>`:`<td></td>`}tab+=`</tr>`}
  tab+=`</tbody></table>`;
  const nb=d=>D.c.filter(c=>+c[0].split("-")[0]===d).length;
  app.innerHTML=`<div class="hero"><small>${esc(D.e.n)} · ${esc(D.e.a)}</small><h1>${esc(D.w)}</h1><p>${esc(D.i)}</p></div>
  <div class="days">${JOURS.map((j,i)=>`<button aria-pressed="${i===day}" data-d="${i}">${j.slice(0,3)}<span>${nb(i)} cours</span></button>`).join("")}</div>
  <div class="card"><b>${JOURS[day]}</b>${list}</div>
  <div class="card"><b>Toute la semaine</b><div class="scroll" style="margin-top:8px">${tab}</div></div>
  <div class="foot">Mis à jour le ${new Date(D.g+"T00:00:00").toLocaleDateString("fr-FR")} · ${esc(D.e.s||"Le Directeur des études")}${D.e.sn?" · "+esc(D.e.sn):""}<br>Emploi du temps en lecture seule, envoyé par l'établissement avec HorairePro.</div>`;
  document.title=D.w+" · Emploi du temps";}
document.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b){day=+b.dataset.d;render()}});
(async()=>{const h=location.hash.slice(1);if(!h){document.getElementById("app").innerHTML=`<div class="err">Ce lien est incomplet. Demandez à votre établissement de vous le renvoyer.</div>`;return}
  try{D=await unpack(h);render()}catch(e){document.getElementById("app").innerHTML=`<div class="err">Ce lien n'a pas pu être lu. Demandez à votre établissement de vous le renvoyer.</div>`}})();
</script>
</body>
</html>
