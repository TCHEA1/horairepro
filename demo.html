  --ink:#0F1F18; --muted:#5F6E66; --paper:#F3F4F6; --white:#FFFFFF; --em:#0F7A4E; --em-2:#0A5C3A; --em-deep:#06291B; --mint:#E2F3EA; --amber:#F08C1A; --red:#D93A3F; --wa:#1FA855;
