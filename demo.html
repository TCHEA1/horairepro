  --ink:#0F1F18; --muted:#5F6E66; --paper:#F3F4F6; --white:#FFFFFF; --em:#0F7A4E; --em-2:#0A5C3A; --em-deep:#06291B; --mint:#E2F3EA; --amber:#F08C1A; --red:#D93A3F; --wa:#1FA855;

  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#wrap{position:relative;width:min(100%,calc((100vh - 110px) * 0.5625));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgb(0 0 0 / .22);background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--em-deep);font-family:var(--f);color:var(--ink)}
.sc{position:absolute;inset:0;opacity:0;will-change:opacity}
.abs{position:absolute;will-change:transform,opacity}
.ctl{display:flex;align-items:center;gap:12px;width:min(100%,calc((100vh - 110px) * 0.5625))}
.ctl button{border:0;background:var(--em);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ctl button svg{width:20px;height:20px}
.ctl button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{flex:1;height:8px;border-radius:9px;background:color-mix(in srgb,var(--page-ink) 15%,transparent);position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--em)}
.tm{font-size:13px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right;opacity:.75}

/* ---------- éléments du film ---------- */
.h{font-weight:800;letter-spacing:-.02em;line-height:1.02}
.cap{position:absolute;left:80px;right:80px;top:130px;font-weight:800;font-size:72px;line-height:1.05;letter-spacing:-.02em}
.step{display:inline-flex;align-items:center;gap:18px;font-size:34px;font-weight:700;color:var(--em);margin-bottom:22px}
.step b{width:62px;height:62px;border-radius:50%;background:var(--em);color:#fff;display:grid;place-items:center;font-size:32px}
.paper{width:380px;height:500px;border-radius:18px;background:#fff;box-shadow:0 20px 40px rgb(0 0 0 / .35);padding:34px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:44px;gap:8px}
.paper span{border-radius:6px;background:#E7EBE9}
.paper span.x{background:#F6C9C4}
.stamp{border:10px solid var(--red);color:var(--red);font-weight:800;font-size:64px;padding:18px 34px;border-radius:22px;transform:rotate(-9deg);background:rgb(255 255 255 / .92);text-align:center;line-height:1.05}
.logo{width:260px;height:260px;border-radius:70px;background:var(--white);display:grid;place-items:center;box-shadow:0 30px 70px rgb(0 0 0 / .3)}
.phone{width:700px;height:1300px;border-radius:84px;background:#0D1512;padding:22px;box-shadow:0 40px 90px rgb(0 0 0 / .28)}
.screen{width:100%;height:100%;border-radius:64px;background:var(--paper);overflow:hidden;position:relative}
.sbar{height:150px;padding:56px 44px 0;display:flex;flex-direction:column;gap:2px}
.sbar small{color:var(--em);font-weight:700;font-size:24px}
.sbar b{font-size:38px;font-weight:800}
.chip{position:absolute;height:84px;border-radius:42px;background:#fff;box-shadow:0 8px 20px rgb(17 24 39 / .08);display:grid;place-items:center;font-weight:800;font-size:32px;padding:0 30px}
.prow{position:absolute;left:44px;right:44px;height:104px;border-radius:30px;background:#fff;box-shadow:0 8px 20px rgb(17 24 39 / .06);display:flex;align-items:center;gap:22px;padding:0 24px}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px}
.prow b{display:block;font-size:28px}
.prow span{font-size:22px;color:var(--muted)}
.badge{position:absolute;border-radius:28px;background:var(--em);color:#fff;font-weight:800;font-size:34px;padding:22px 34px;box-shadow:0 18px 40px rgb(15 122 78 / .35)}
.cell{position:absolute;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--ink)}
.cell small{font-size:15px;font-weight:700;opacity:.65}
.gbtn{position:absolute;left:44px;right:44px;height:120px;border-radius:60px;background:var(--em);color:#fff;font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 16px 36px rgb(15 122 78 / .35)}
.tap{position:absolute;width:120px;height:120px;border-radius:50%;border:8px solid rgb(255 255 255 / .9);background:rgb(15 122 78 / .25)}
.counter{position:absolute;left:44px;right:44px;border-radius:40px;background:linear-gradient(135deg,var(--em-2),var(--em));color:#fff;padding:30px 36px}
.counter small{font-size:24px;opacity:.85;font-weight:600}
.counter b{display:block;font-size:76px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.les{position:absolute;left:44px;right:44px;height:136px;border-radius:30px;display:flex;align-items:center;gap:22px;padding:0 26px;background:#fff;box-shadow:0 8px 20px rgb(17 24 39 / .06)}
.les .t{width:110px;font-weight:800;font-size:28px;line-height:1.1}
.les .t span{display:block;font-size:20px;color:var(--muted);font-weight:600}
.les .c{flex:1;height:100px;border-radius:22px;padding:14px 22px;display:flex;flex-direction:column;justify-content:center}
.les .c b{font-size:30px}
.les .c span{font-size:22px;font-weight:700;opacity:.75}
.pin{position:absolute;width:66px;height:66px}
.bub{position:absolute;right:44px;max-width:540px;border-radius:30px 30px 8px 30px;background:#D9FDD3;padding:24px 28px;box-shadow:0 6px 14px rgb(0 0 0 / .08);font-size:28px;line-height:1.3}
.bub .pdf{display:flex;align-items:center;gap:18px;background:#fff;border-radius:20px;padding:18px 20px;margin-bottom:14px}
.bub .pdf i{width:64px;height:78px;border-radius:10px;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:20px;display:grid;place-items:center}
.bub .pdf b{display:block;font-size:26px}
.bub .pdf span{font-size:20px;color:var(--muted)}
.ticks{font-size:22px;text-align:right;margin-top:8px;color:#667}
.notif{position:absolute;left:30px;right:30px;top:40px;border-radius:34px;background:rgb(255 255 255 / .97);box-shadow:0 18px 40px rgb(0 0 0 / .18);padding:24px 28px;display:flex;gap:20px;align-items:center}
.notif i{width:72px;height:72px;border-radius:20px;background:var(--wa);display:grid;place-items:center;flex:none}
.notif b{display:block;font-size:28px}
.notif span{font-size:23px;color:var(--muted)}
.tile{position:absolute;width:440px;height:420px;border-radius:44px;background:#fff;box-shadow:0 18px 44px rgb(17 24 39 / .1);padding:40px;display:flex;flex-direction:column;gap:18px}
.tile .ic{width:96px;height:96px;border-radius:28px;display:grid;place-items:center}
.tile b{font-size:40px;line-height:1.08;letter-spacing:-.01em}
.tile span{font-size:26px;color:var(--muted);line-height:1.3}
.cta{position:absolute;left:80px;right:80px;border-radius:40px;background:#fff;color:var(--em);font-weight:800;font-size:48px;padding:34px;text-align:center}
#snd{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:5;border:0;border-radius:40px;background:rgb(6 41 27 / .82);color:#fff;font:700 15px var(--f);padding:12px 20px;display:flex;gap:10px;align-items:center;cursor:pointer;backdrop-filter:blur(6px)}
#snd:focus-visible{outline:3px solid var(--amber)}
#snd[hidden]{display:none}
</style>

const DUR=43;

const E=(cls,html,parent,style)=>{const d=document.createElement("div");if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(style)Object.assign(d.style,style);(parent||stage).appendChild(d);return d};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const P=(t,a,b,e)=>(e||ease.o)(clamp((t-a)/(b-a),0,1));          // progression 0→1 entre a et b
const L=(a,b,p)=>a+(b-a)*p;
function set(el,{x=0,y=0,s=1,r=0,o=1}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}

/* ================== lecture ================== */
const wrap=document.getElementById("wrap");function fit(){stage.style.transform=`scale(${wrap.clientWidth/1080})`}addEventListener("resize",fit);fit();
let T=0,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,last=null;
const icPlay='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>',icPause='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="#fff"/></svg>';
const pb=document.getElementById("play");function ui(){pb.innerHTML=playing?icPause:icPlay}
const au=document.getElementById("au"),snd=document.getElementById("snd");let sound=false;
function syncAu(){if(!sound)return;if(playing){if(Math.abs(au.currentTime-T)>.2)au.currentTime=T;if(au.paused)au.play().catch(()=>{})}else if(!au.paused)au.pause()}
snd.onclick=()=>{sound=true;snd.hidden=true;T=0;playing=true;last=null;ui();au.currentTime=0;au.play().catch(()=>{})};
function loop(ts){syncAu();if(playing){if(last!=null)T+=(ts-last)/1000;if(T>=DUR){T=DUR;playing=false;ui()}}last=ts;render(T);requestAnimationFrame(loop)}
pb.onclick=()=>{if(T>=DUR)T=0;playing=!playing;last=null;ui()};
document.getElementById("again").onclick=()=>{T=0;playing=true;last=null;ui()};
const bar=document.getElementById("bar");bar.onclick=e=>{const r=bar.getBoundingClientRect();T=clamp((e.clientX-r.left)/r.width,0,1)*DUR;last=null;render(T)};
if(!playing)T=38.6;  // mouvement réduit : on montre l'image finale
window.seek=t=>{playing=false;T=t;snd.hidden=true;render(t)};
ui();render(T);requestAnimationFrame(loop);
</script>
