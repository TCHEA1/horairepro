# Déploiement Render : l'application (site statique) + le service de paiement CinetPay
services:
  - type: web
    name: horairepro
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /admin.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: horairepro-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: APP_URL
        value: https://horairepro.onrender.com/
      - key: API_URL
        value: https://horairepro-api.onrender.com
      - key: CINETPAY_APIKEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: LICENCE_PRIVATE_JWK
        sync: false
