:root{--ink:#0F1F18;--muted:#5F6E66;--paper:#F3F4F6;--em:#0F7A4E;--em-2:#0A5C3A;--mint:#E2F3EA;--amber:#F08C1A;
  --f:"PJS","Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--page:#E9ECEA;--page-ink:#0F1F18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0E1411;--page-ink:#E8EEEA;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0E1411;--page-ink:#E8EEEA;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#wrap{position:relative;width:min(100%,calc((100vh - 110px) * .5625));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgb(0 0 0 / .22);background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--paper);color:var(--ink)}
.abs{position:absolute;will-change:transform,opacity}
.ctl{display:flex;align-items:center;gap:12px;width:min(100%,calc((100vh - 110px) * .5625))}
.ctl button{border:0;background:var(--em);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ctl button svg{width:20px;height:20px}
.ctl button:focus-visible,#snd:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{flex:1;height:8px;border-radius:9px;background:color-mix(in srgb,var(--page-ink) 15%,transparent);position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--em)}
.tm{font-size:13px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right;opacity:.75}
#snd{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:5;border:0;border-radius:40px;background:rgb(6 41 27 / .88);color:#fff;font:700 15px var(--f);padding:12px 20px;display:flex;gap:10px;align-items:center;cursor:pointer}
#snd[hidden]{display:none}

.bg{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%}
.chap{position:absolute;left:70px;right:70px;top:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chap div{font-size:21px;font-weight:700;color:#8A9891}
.chap div i{display:block;height:9px;border-radius:9px;background:#DCE3DF;margin-bottom:8px;overflow:hidden}
.chap div i b{display:block;height:100%;width:0;background:var(--em);border-radius:9px}
.chap div.on{color:var(--em)}
.title{position:absolute;left:70px;right:70px;top:112px;height:160px;display:flex;flex-direction:column;justify-content:center}
.title .st{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;color:var(--em);margin-bottom:8px}
.title .st b{width:48px;height:48px;border-radius:50%;background:var(--em);color:#fff;display:grid;place-items:center;font-size:26px}
.title .tt{font-size:62px;font-weight:800;letter-spacing:-.02em;line-height:1.04}
.phone{position:absolute;left:222px;top:296px;width:636px;height:1334px;border-radius:78px;background:#0D1512;padding:18px;box-shadow:0 40px 90px rgb(6 41 27 / .30)}
.scr{width:600px;height:1298px;border-radius:62px;overflow:hidden;background:#F3F4F6;position:relative}
.scr video{position:absolute;left:0;top:0;width:600px;height:1298px;display:block;transform-origin:0 0}
.rip{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:6px solid rgb(15 122 78 / .9);opacity:0;pointer-events:none}
.zoomtag{position:absolute;right:26px;top:26px;background:rgb(15 31 24 / .78);color:#fff;border-radius:30px;padding:10px 18px;font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 35%,#F5FBF7,#D2EEDF);box-shadow:0 18px 40px rgb(6 41 27 / .25);overflow:hidden;border:8px solid #fff}
.bubble svg{position:absolute;left:0;top:0;width:100%;height:100%}
.sub{position:absolute;left:330px;right:44px;top:1650px;min-height:200px;border-radius:36px;background:#0F1F18;color:rgb(255 255 255 / .55);padding:26px 32px;font-size:34px;line-height:1.3;font-weight:700;display:flex;align-items:center;box-shadow:0 18px 40px rgb(0 0 0 / .2)}
.sub .w{transition:none}
.sub .w.on{color:#fff}
.sub .w.now{color:#7EE2B0}
.name{position:absolute;left:0;right:0;text-align:center;color:#fff}
.cta{position:absolute;left:90px;right:90px;border-radius:40px;background:#fff;color:var(--em);font-weight:800;font-size:46px;padding:30px;text-align:center}
.hook{position:absolute;left:60px;right:60px;text-align:center;color:#fff;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.strike{position:absolute;left:8%;right:8%;top:50%;height:12px;border-radius:9px;background:#FF5A5F;transform-origin:0 50%}
</style>
