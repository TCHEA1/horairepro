<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HorairePro Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A5C3A">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: espace vendeur — coque mobile centrée (max 760px), grande carte revenus, listes de clients en cartes blanches, 4 onglets en bas */
:root{
  --bg:#F3F4F6; --bg2:#ECEEF1; --surface:#FFFFFF; --sunk:#F3F4F6; --ink:#0F1F18; --muted:#7A8981; --line:#E6EDE9;
  --accent:#0F7A4E; --accent-2:#0A5C3A; --accent-ink:#FFFFFF; --accent-soft:#E2F3EA; --warm:#F08C1A; --warm-soft:#FEF0DE;
  --danger:#E5484D; --danger-soft:#FDE7E8; --ok:#16A065;
  --t-orange:#FFEBDD; --t-orange-i:#F2701D; --t-blue:#E3EBFF; --t-blue-i:#3D63E8; --t-violet:#EFE6FF; --t-violet-i:#8A4FE6; --t-pink:#FFE4EC; --t-pink-i:#E5487A; --t-teal:#DDF4F5; --t-teal-i:#0E9AA7;
  --sh:0 6px 20px rgb(17 24 39 / .06); --sh2:0 14px 30px rgb(10 92 58 / .28);
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814; --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814; --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,var(--bg2),var(--bg) 340px);background-attachment:fixed;color:var(--ink);font:14.5px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:760px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .grow{flex:1;min-width:0}
.top small{display:block;color:var(--accent);font-weight:600;font-size:13px}
.top h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
main{padding:6px max(18px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:21px;font-weight:800}
h3{margin:0;font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .28)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.block{width:100%} .btn.big{min-height:54px;font-size:15.5px}
.btn.wa{background:#1FA855;color:#fff}
.grow{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;opacity:.8}
.hero .sub{font-size:12.5px;opacity:.95}
.hero .deco{position:absolute;right:-26px;top:16px;width:150px;height:96px;border-radius:16px;background:linear-gradient(135deg,rgb(255 255 255 / .22),rgb(255 255 255 / .04));transform:rotate(-8deg)}
.hero > *:not(.deco){position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.item + .item{border-top:1px solid var(--line)}
.item .grow b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .grow span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.orange{background:var(--t-orange);color:var(--t-orange-i)} .blue{background:var(--t-blue);color:var(--t-blue-i)} .violet{background:var(--t-violet);color:var(--t-violet-i)} .pink{background:var(--t-pink);color:var(--t-pink-i)} .teal{background:var(--t-teal);color:var(--t-teal-i)}
.chip{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.warn{background:var(--warm-soft);color:var(--warm)} .chip.bad{background:var(--danger-soft);color:var(--danger)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:11px 13px;font-size:15px;color:var(--ink);font-weight:500;min-height:46px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.code{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:var(--sunk);border-radius:14px;padding:12px;user-select:all;line-height:1.5}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 14px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--muted);box-shadow:var(--sh)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);z-index:20;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgb(16 64 42 / .08);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs svg{width:23px;height:23px}
nav.tabs .pill{display:grid;place-items:center;width:44px;height:30px;border-radius:12px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs button[aria-current="true"] .pill{background:var(--accent-soft)}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto;padding:32px max(22px,env(safe-area-inset-right,0px)) 32px max(22px,env(safe-area-inset-left,0px))}
.lock .mark{width:64px;height:64px;border-radius:20px;background:var(--accent);display:grid;place-items:center;color:#fff}
.lock .mark svg{width:32px;height:32px}
.lock h1{margin:0;font-size:30px;font-weight:800;line-height:1.15}
.pin{font-family:var(--mono);font-size:26px!important;letter-spacing:.5em;text-align:center}
.scrim{position:fixed;inset:0;background:rgb(6 20 14 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:800px){.scrim{align-items:center}.sheet{border-radius:26px!important}}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:24px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ HorairePro Admin : licences des établissements ============ */
const KEY="horairepro-admin-v1";
const PUBKEY_OLD={"kty":"EC","crv":"P-256","x":"AtByO7j6hC8Y4HZPhoVdrfmeH3o3D9KMUYUG4G6PB1c","y":"6cuVoRgpOdhG954iiemfJnfqv9YRRrKnibDZTi8R-vM"}; // ancienne clé admin : codes déjà donnés
const PUBKEY_PAY={"kty":"EC","crv":"P-256","x":"PysCcLcllcvXbDYN-74L2OqYjnhzU7uNeEXmfaTRlfg","y":"CiE0h0nhHF6JvkW74T5y-2ue-UuJ61OV22qyIwN_Tdw"}; // clé du service de paiement en ligne
const APP_URL="https://horairepro.onrender.com/";
const PAY=["Orange Money","MTN MoMo","Moov Money","Wave","Espèces","Virement bancaire"];
const ICON={
  dash:'<path d="M3 13h7V3H3zM14 21h7V11h-7zM3 21h7v-5H3zM14 3v5h7V3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  users:'<circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  set:'<circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  key:'<circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const frDate=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fcfa=n=>(+n||0).toLocaleString("fr-FR")+" FCFA";
const TONES=["orange","blue","violet","pink","teal"];
const tone=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return TONES[h%TONES.length]};
const ini=n=>String(n||"?").replace(/^(Collège|Lycée|Groupe scolaire|Institut|École|Complexe scolaire)\s+/i,"").split(/[\s-]+/).filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function b64uDec(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return Uint8Array.from(atob(t),c=>c.charCodeAt(0))}

/* ---- stockage ---- */
let A=null, PRIV=null, PUB=null, UI={tab:"dash",q:""};
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){toast("Enregistrement impossible sur cet appareil.")}}
const DEF_OFFRES=[{id:"petit",nom:"Petit établissement",max:12,prix:30000},{id:"moyen",nom:"Établissement moyen",max:25,prix:50000},{id:"grand",nom:"Grand établissement",max:0,prix:80000}];
function fresh(){return {v:1,vault:null,prix:50000,vendeur:"",clients:[],offres:JSON.parse(JSON.stringify(DEF_OFFRES))}}
const offres=()=>A.offres||(A.offres=JSON.parse(JSON.stringify(DEF_OFFRES)));
const offreLbl=o=>o.nom+" · "+(o.max?"jusqu'à "+o.max+" classes":"classes illimitées");

/* ---- coffre de la clé (chiffré par le code PIN) ---- */
async function pinKey(pin,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(keyFile,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await pinKey(pin,salt);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(keyFile)));
  return {salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)}}
async function unseal(v,pin){const k=await pinKey(pin,b64uDec(v.salt));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uDec(v.iv)},k,b64uDec(v.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function useKeyFile(kf){PRIV=await crypto.subtle.importKey("jwk",kf.private,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
  PUB=await crypto.subtle.importKey("jwk",kf.public,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);UI.kf=kf}

/* ---- licences ---- */
async function makeCode(n,e,t,o){const data={v:1,n,e,i:today(),id:uid(),t};if(o){data.o=o.nom;data.c=o.max||0}const pay=new TextEncoder().encode(JSON.stringify(data));
  const sig=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},PRIV,pay);return {code:"HP-"+b64u(pay)+"."+b64u(sig),data}}
async function checkCode(raw){const code=String(raw||"").replace(/\s+/g,"");const m=code.match(/^HP-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
  if(!m) return {ok:false,err:"Format incorrect : un code commence par HP-"};
  try{const pay=b64uDec(m[1]);let good=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},PUB,b64uDec(m[2]),pay);
    for(const jwk of [PUBKEY_PAY,PUBKEY_OLD]){if(good)break;const k2=await crypto.subtle.importKey("jwk",jwk,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);good=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k2,b64uDec(m[2]),pay)}
    const data=JSON.parse(new TextDecoder().decode(pay));return {ok:good,data,err:good?"":"Signature invalide : ce code n'a pas été créé par votre admin."}}
  catch(e){return {ok:false,err:"Code illisible."}}}
const lastLic=c=>c.lic.length?c.lic[c.lic.length-1]:null;
function status(c){const l=lastLic(c);if(!l)return {k:"none",t:"Sans licence",cls:""};const left=dayDiff(today(),l.e);
  if(left<0)return {k:"exp",t:"Expirée",cls:"bad",left};if(left<=30)return {k:"soon",t:left+" j restants",cls:"warn",left};return {k:"ok",t:"Active",cls:"ok",left}}
function schoolYearEnd(){const d=new Date();const y=d.getMonth()>=7?d.getFullYear()+1:d.getFullYear();return y+"-08-31"}
function waMsg(c,l){return `Bonjour ${c.contact||""},\n\nMerci pour votre confiance. Voici le code d'activation HorairePro de ${c.nom}, valable jusqu'au ${frDate(l.e)} :\n\n${l.code}\n\nDans l'application : Réglages → Licence → collez le code puis touchez « Activer la licence ».\nApplication : ${APP_URL}\n\n${A.vendeur||"HorairePro"}`}
function waUrl(phone,msg){let p=String(phone||"").replace(/\D/g,"");if(p.length===10)p="225"+p;return "https://wa.me/"+p+"?text="+encodeURIComponent(msg)}

/* ---- interface ---- */
const app=document.getElementById("app");
function toast(m){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function openSheet(h){closeSheet();const d=document.createElement("div");d.className="scrim";d.id="scrim";d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${h}</div>`;d.addEventListener("click",e=>{if(e.target===d)closeSheet()});document.body.appendChild(d)}
function closeSheet(){document.getElementById("scrim")?.remove()}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Code copié")}catch(e){toast("Sélectionnez le code puis copiez-le.")}}
function download(name,text){const u=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

function render(){
  if(!A.vault){app.innerHTML=vSetup();return}
  if(!PRIV){app.innerHTML=vLock();setTimeout(()=>document.getElementById("pin")?.focus(),50);return}
  const T={dash:"Tableau de bord",clients:"Établissements clients",new:"Nouvelle licence",set:"Réglages"};
  app.innerHTML=`<header class="top"><div class="grow"><small>HorairePro · Admin</small><h1>${T[UI.tab]}</h1></div><button class="btn ghost" data-act="lockNow" aria-label="Verrouiller">${svg("key")}</button></header>
  <main>${({dash:vDash,clients:vClients,new:vNew,set:vSet})[UI.tab]()}</main>
  <nav class="tabs">${[["dash","Accueil","dash"],["clients","Clients","users"],["new","Nouvelle","plus"],["set","Réglages","set"]].map(([k,l,i])=>`<button data-act="tab" data-v="${k}" aria-current="${UI.tab===k}"><span class="pill">${svg(i)}</span>${l}</button>`).join("")}</nav>`;
}
function vSetup(){return `<div class="lock"><div class="mark">${svg("key")}</div><h1>Espace admin HorairePro</h1>
  <p class="muted" style="margin:0">Première ouverture sur cet appareil. Importez votre fichier de clé <b>cle-admin-horairepro.json</b>, puis choisissez un code PIN. Le PIN protège la clé sur ce téléphone.</p>
  <button class="btn block" data-act="pickKey" id="kbtn">Choisir le fichier de clé</button><span class="small muted" id="kname"></span>
  <label class="f">Nouveau code PIN (4 à 8 chiffres)<input id="p1" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
  <label class="f">Confirmer le code PIN<input id="p2" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
  <button class="btn primary big block" data-act="setup">Ouvrir mon espace admin</button>
  <p class="small muted" style="margin:0">Gardez le fichier de clé en lieu sûr (Google Drive privé, clé USB). Ne le publiez jamais et ne l'envoyez à personne : il permet de créer des licences.</p></div>`}
function vLock(){return `<div class="lock"><div class="mark">${svg("key")}</div><h1>HorairePro Admin</h1><p class="muted" style="margin:0">Entrez votre code PIN pour ouvrir l'espace vendeur.</p>
  <form id="pinform" style="display:flex;flex-direction:column;gap:14px"><label class="f">Code PIN<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>
  <button class="btn primary big block" type="submit">Déverrouiller</button></form>
  <button class="btn ghost small" data-act="forgot">PIN oublié ?</button></div>`}
function vDash(){
  const C=A.clients;const st=C.map(status);
  const year=(()=>{const d=new Date();const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return {from:y+"-08-01",lbl:y+"-"+(y+1)}})();
  let rev=0,nb=0;C.forEach(c=>c.lic.forEach(l=>{if(l.paye&&l.i>=year.from){rev+=+l.prix||0;nb++}}));
  const relance=C.map((c,i)=>({c,s:st[i]})).filter(x=>x.s.k==="soon"||x.s.k==="exp").sort((a,b)=>(a.s.left??-999)-(b.s.left??-999));
  return `<section class="hero"><div class="deco"></div><span class="lbl">Revenus de l'année ${year.lbl}</span><span class="big">${(rev).toLocaleString("fr-FR")}<small> FCFA</small></span><span class="sub">${nb} licence${nb>1?"s":""} payée${nb>1?"s":""} depuis le 1er août</span></section>
  <div class="stats"><div class="stat"><b>${C.length}</b><span>établissements</span></div><div class="stat"><b>${st.filter(s=>s.k==="ok"||s.k==="soon").length}</b><span>licences actives</span></div>
  <div class="stat"><b>${st.filter(s=>s.k==="soon").length}</b><span>expirent bientôt</span></div><div class="stat"><b>${st.filter(s=>s.k==="exp").length}</b><span>expirées</span></div></div>
  <button class="btn primary big block" data-act="tab" data-v="new">Vendre une licence</button>
  <div class="sec-head"><h3>À relancer</h3><span class="small muted">${relance.length}</span></div>
  <section class="card" style="padding-block:6px">${relance.length?`<div class="list">${relance.map(({c,s})=>`<button class="item" data-act="openClient" data-v="${c.id}"><span class="av ${tone(c.nom)}">${esc(ini(c.nom))}</span><span class="grow"><b>${esc(c.nom)}</b><span>Fin : ${frDate(lastLic(c).e)} · ${esc(c.tel||"pas de numéro")}</span></span><span class="chip ${s.cls}">${s.t}</span></button>`).join("")}</div>`
    :`<div class="empty">Aucune licence à renouveler dans les 30 prochains jours.</div>`}</section>
  <section class="card"><h3>Vérifier un code</h3><label class="f">Code reçu d'un établissement<textarea id="chk" rows="3" placeholder="HP-…"></textarea></label><button class="btn" data-act="check">Vérifier</button><div id="chkres"></div></section>`;
}
function vClients(){
  const q=UI.q.toLowerCase();const C=A.clients.filter(c=>!q||(c.nom+" "+c.ville+" "+c.contact).toLowerCase().includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  return `<label class="f"><input id="q" placeholder="Rechercher un établissement, une ville…" value="${esc(UI.q)}"></label>
  <section class="card" style="padding-block:6px">${C.length?`<div class="list">${C.map(c=>{const s=status(c);const l=lastLic(c);return `<button class="item" data-act="openClient" data-v="${c.id}"><span class="av ${tone(c.nom)}">${esc(ini(c.nom))}</span><span class="grow"><b>${esc(c.nom)}</b><span>${esc([c.ville,c.contact].filter(Boolean).join(" · "))}${l?" · fin "+frDate(l.e):""}</span></span><span class="chip ${s.cls}">${s.t}</span></button>`}).join("")}</div>`
    :`<div class="empty">${A.clients.length?"Aucun résultat.":"Pas encore de client. Vendez votre première licence."}<button class="btn primary" data-act="tab" data-v="new">Nouvelle licence</button></div>`}</section>`;
}
function offerFields(prefix){return `<label class="f">Offre<select id="${prefix}-off">${offres().map((o,i)=>`<option value="${o.id}" ${i===1?"selected":""}>${esc(offreLbl(o))} — ${fcfa(o.prix)}</option>`).join("")}</select></label>
  <label class="f">Durée de la licence<select id="${prefix}-dur">
  <option value="annee">Année scolaire, jusqu'au ${frDate(schoolYearEnd())}</option><option value="12m">12 mois à partir d'aujourd'hui</option>
  <option value="30j">Essai prolongé de 30 jours</option><option value="date">Date de fin personnalisée</option></select></label>
  <label class="f" id="${prefix}-datew" hidden>Date de fin<input id="${prefix}-date" type="date" value="${schoolYearEnd()}"></label>
  <div class="grid2"><label class="f">Prix payé (FCFA)<input id="${prefix}-prix" type="number" inputmode="numeric" value="${offres()[1].prix}"></label>
  <label class="f">Mode de paiement<select id="${prefix}-pay">${PAY.map(p=>`<option>${p}</option>`).join("")}</select></label>
  <label class="f">Référence de la transaction<input id="${prefix}-ref" placeholder="ex : ID Orange Money"></label>
  <label class="f">Statut<select id="${prefix}-paye"><option value="1">Payé</option><option value="0">Pas encore payé</option></select></label></div>`}
function vNew(){return `<section class="card"><h3>Établissement</h3>
  <label class="f">Nom exact de l'établissement<input id="n-nom" placeholder="ex : Lycée Moderne Les Lauriers"><span class="small muted" style="font-weight:500">Ce nom sera imprimé sur tous ses emplois du temps. Vérifiez l'orthographe.</span></label>
  <div class="grid2"><label class="f">Ville<input id="n-ville"></label><label class="f">DREN<input id="n-dren"></label>
  <label class="f">Contact (directeur, censeur…)<input id="n-contact"></label><label class="f">Téléphone WhatsApp<input id="n-tel" inputmode="tel" placeholder="07 00 00 00 00"></label></div></section>
  <section class="card"><h3>Offre et paiement</h3>${offerFields("n")}</section>
  <button class="btn primary big block" data-act="create">Créer la licence</button>`}
function vSet(){return `<section class="card"><h3>Offres par taille d'établissement</h3><p class="small muted" style="margin:0">Le nombre de classes autorisé est inscrit dans le code : l'appli de l'école prévient si elle dépasse son offre. 0 = illimité.</p>
  ${offres().map((o,i)=>`<div class="grid2"><label class="f">Nom de l'offre<input id="of-n-${i}" value="${esc(o.nom)}"></label><label class="f">Classes max<input id="of-m-${i}" type="number" inputmode="numeric" value="${o.max}"></label><label class="f">Prix annuel (FCFA)<input id="of-p-${i}" type="number" inputmode="numeric" value="${o.prix}"></label></div>`).join("")}
  <button class="btn" data-act="saveOff">Enregistrer les offres</button></section>
  <section class="card"><h3>Ventes</h3><div class="grid2"><label class="f">Prix par défaut d'une licence annuelle (FCFA)<input id="s-prix" type="number" inputmode="numeric" value="${A.prix}"></label>
  <label class="f">Signature des messages<input id="s-vend" value="${esc(A.vendeur)}" placeholder="ex : Mares — HorairePro"></label></div><button class="btn" data-act="saveSet">Enregistrer</button></section>
  <section class="card"><h3>Sauvegarde des clients</h3><p class="small muted" style="margin:0">Les clients sont enregistrés sur ce téléphone. Téléchargez une sauvegarde chaque mois.</p>
  <div class="row"><button class="btn" data-act="export">Télécharger la sauvegarde</button><button class="btn" data-act="import">Restaurer</button></div></section>
  <section class="card"><h3>Sécurité</h3><div class="row"><button class="btn" data-act="chgPin">Changer le code PIN</button><button class="btn" data-act="lockNow">Verrouiller maintenant</button></div>
  <p class="small muted" style="margin:0">Pour utiliser l'admin sur un autre appareil : ouvrez-y cette page, importez le même fichier de clé et restaurez la sauvegarde des clients.</p></section>
  <section class="card"><h3>Lien de l'application</h3><div class="code">${APP_URL}</div><span class="small muted">À donner aux établissements. Ils ont 30 jours d'essai gratuit, puis il leur faut un code.</span></section>`}
function readOffer(p){const dur=document.getElementById(p+"-dur").value;
  const e=dur==="annee"?schoolYearEnd():dur==="12m"?addDays(today(),365):dur==="30j"?addDays(today(),30):document.getElementById(p+"-date").value;
  const off=offres().find(o=>o.id===document.getElementById(p+"-off").value)||offres()[1];
  return {e,off:{nom:off.nom,max:off.max},t:dur==="30j"?"essai":"annuel",prix:dur==="30j"?0:+document.getElementById(p+"-prix").value||0,pay:document.getElementById(p+"-pay").value,ref:document.getElementById(p+"-ref").value.trim(),paye:document.getElementById(p+"-paye").value==="1"}}
function showCode(c,l){openSheet(`<h3>Licence créée</h3><p class="small muted" style="margin:0">${esc(c.nom)} · valable jusqu'au <b>${frDate(l.e)}</b></p>
  <div class="code" id="thecode">${esc(l.code)}</div>
  <button class="btn primary block" data-act="copy" data-v="${esc(l.code)}">Copier le code</button>
  ${c.tel?`<a class="btn wa block" href="${waUrl(c.tel,waMsg(c,l))}" target="_blank" rel="noopener">Envoyer par WhatsApp à ${esc(c.tel)}</a>`:`<span class="small muted">Ajoutez un numéro WhatsApp au client pour l'envoyer en un geste.</span>`}
  <button class="btn ghost" data-act="close">Fermer</button>`)}
function clientSheet(id){const c=A.clients.find(x=>x.id===id);const s=status(c);const l=lastLic(c);
  openSheet(`<div class="row"><span class="av ${tone(c.nom)}">${esc(ini(c.nom))}</span><div class="grow"><h3>${esc(c.nom)}</h3><span class="small muted">${esc([c.ville,c.dren?"DREN "+c.dren:""].filter(Boolean).join(" · "))}</span></div><span class="chip ${s.cls}">${s.t}</span></div>
  <div class="grid2"><label class="f">Contact<input id="c-contact" value="${esc(c.contact)}"></label><label class="f">Téléphone WhatsApp<input id="c-tel" inputmode="tel" value="${esc(c.tel)}"></label>
  <label class="f">Ville<input id="c-ville" value="${esc(c.ville)}"></label><label class="f">Notes<input id="c-note" value="${esc(c.note||"")}"></label></div>
  <button class="btn" data-act="saveClient" data-v="${c.id}">Enregistrer les coordonnées</button>
  ${l?`<div class="row"><button class="btn primary grow" data-act="copy" data-v="${esc(l.code)}">Copier le dernier code</button>${c.tel?`<a class="btn wa grow" href="${waUrl(c.tel,waMsg(c,l))}" target="_blank" rel="noopener">Renvoyer sur WhatsApp</a>`:""}</div>`:""}
  <h3>Renouveler / prolonger</h3>${offerFields("r")}<button class="btn primary block" data-act="renew" data-v="${c.id}">Créer une nouvelle licence</button>
  <h3>Historique</h3><div class="hist">${c.lic.slice().reverse().map(x=>`<div><span><b>${x.t==="essai"?"Essai":"Annuelle"}${x.off?" · "+esc(x.off.nom):""}</b> · créée le ${frDate(x.i)} · fin ${frDate(x.e)}</span><span>${x.prix?fcfa(x.prix):"Gratuit"} · ${esc(x.pay)}${x.ref?" · "+esc(x.ref):""} · ${x.paye?"payé":"<b style='color:var(--warm)'>non payé</b>"}</span></div>`).join("")||"<span class='small muted'>Aucune licence.</span>"}</div>
  <div id="delzone"><button class="btn danger" data-act="askDel" data-v="${c.id}">Supprimer ce client</button></div>
  <button class="btn ghost" data-act="close">Fermer</button>`);bindDur("r")}
function bindDur(p){const s=document.getElementById(p+"-dur");if(!s)return;const w=document.getElementById(p+"-datew");
  const pr=document.getElementById(p+"-prix"),of=document.getElementById(p+"-off");const price=()=>(offres().find(o=>o.id===of.value)||{}).prix||A.prix;
  const up=()=>{w.hidden=s.value!=="date";if(s.value==="30j")pr.value=0;else pr.value=price()};s.addEventListener("change",up);of.addEventListener("change",up)}

/* ---- actions ---- */
document.addEventListener("submit",async e=>{if(e.target.id!=="pinform")return;e.preventDefault();
  const pin=document.getElementById("pin").value;try{const kf=await unseal(A.vault,pin);await useKeyFile(kf);render()}catch(err){toast("Code PIN incorrect.");document.getElementById("pin").value=""}});
document.addEventListener("input",e=>{if(e.target.id==="q"){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case "tab":UI.tab=v;closeSheet();render();scrollTo(0,0);if(v==="new")bindDur("n");break;
    case "close":closeSheet();break;
    case "pickKey":{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const kf=JSON.parse(r.result);if(!kf.private||!kf.public)throw 0;UI.pendingKey=kf;document.getElementById("kname").textContent="Fichier prêt : "+f.name;document.getElementById("kbtn").textContent="Fichier de clé chargé ✓"}catch(err){toast("Ce fichier n'est pas une clé HorairePro.")}};r.readAsText(f)};i.click();break}
    case "setup":{const p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;
      if(!UI.pendingKey){toast("Choisissez d'abord le fichier de clé.");return}
      if(!/^\d{4,8}$/.test(p1)){toast("Le PIN doit contenir 4 à 8 chiffres.");return}if(p1!==p2){toast("Les deux PIN ne correspondent pas.");return}
      try{await useKeyFile(UI.pendingKey)}catch(err){toast("La clé n'a pas pu être lue.");return}
      A.vault=await seal(UI.pendingKey,p1);UI.pendingKey=null;save();render();toast("Espace admin prêt");break}
    case "forgot":openSheet(`<h3>PIN oublié</h3><p style="margin:0">Effacez le coffre de ce téléphone puis réimportez votre fichier de clé avec un nouveau PIN. Vos clients restent enregistrés.</p><button class="btn danger block" data-act="resetVault">Effacer le coffre et recommencer</button><button class="btn ghost" data-act="close">Annuler</button>`);break;
    case "resetVault":A.vault=null;save();closeSheet();render();break;
    case "lockNow":PRIV=null;PUB=null;UI.kf=null;closeSheet();render();break;
    case "create":{const nom=document.getElementById("n-nom").value.trim();if(!nom){toast("Saisissez le nom de l'établissement.");return}
      const o=readOffer("n");if(!o.e){toast("Choisissez une date de fin.");return}
      let c=A.clients.find(x=>x.nom.toLowerCase()===nom.toLowerCase());
      if(!c){c={id:uid(),nom,ville:document.getElementById("n-ville").value.trim(),dren:document.getElementById("n-dren").value.trim(),contact:document.getElementById("n-contact").value.trim(),tel:document.getElementById("n-tel").value.trim(),lic:[],cree:today()};A.clients.push(c)}
      const {code,data}=await makeCode(c.nom,o.e,o.t,o.off);const l={...o,code,i:data.i,id:data.id};c.lic.push(l);save();UI.tab="clients";render();showCode(c,l);break}
    case "renew":{const c=A.clients.find(x=>x.id===v);const o=readOffer("r");if(!o.e){toast("Choisissez une date de fin.");return}
      const {code,data}=await makeCode(c.nom,o.e,o.t,o.off);const l={...o,code,i:data.i,id:data.id};c.lic.push(l);save();render();showCode(c,l);break}
    case "openClient":clientSheet(v);break;
    case "saveClient":{const c=A.clients.find(x=>x.id===v);c.contact=document.getElementById("c-contact").value.trim();c.tel=document.getElementById("c-tel").value.trim();
      c.ville=document.getElementById("c-ville").value.trim();c.note=document.getElementById("c-note").value.trim();save();render();clientSheet(v);toast("Coordonnées enregistrées");break}
    case "askDel":document.getElementById("delzone").innerHTML=`<div class="row"><span class="small grow">Supprimer définitivement ce client et son historique ?</span><button class="btn danger" data-act="del" data-v="${v}">Oui, supprimer</button></div>`;break;
    case "del":A.clients=A.clients.filter(x=>x.id!==v);save();closeSheet();render();toast("Client supprimé");break;
    case "copy":copy(v);break;
    case "check":{const r=await checkCode(document.getElementById("chk").value);const box=document.getElementById("chkres");
      if(!r.data){box.innerHTML=`<span class="chip bad">${esc(r.err)}</span>`;break}
      const left=dayDiff(today(),r.data.e);box.innerHTML=`<div class="hist"><div><span><b>${esc(r.data.n)}</b></span><span>${r.ok?"<span class='chip ok'>Signature valide</span>":"<span class='chip bad'>Signature invalide</span>"}</span></div><div><span>Créé le ${frDate(r.data.i)}</span><span>Fin : ${frDate(r.data.e)} ${left>=0?"("+left+" j)":"<b style='color:var(--danger)'>expiré</b>"}</span></div></div>`;break}
    case "saveOff":offres().forEach((o,i)=>{o.nom=document.getElementById("of-n-"+i).value.trim()||o.nom;o.max=Math.max(0,+document.getElementById("of-m-"+i).value||0);o.prix=Math.max(0,+document.getElementById("of-p-"+i).value||0)});save();toast("Offres enregistrées");break;
    case "saveSet":A.prix=+document.getElementById("s-prix").value||0;A.vendeur=document.getElementById("s-vend").value.trim();save();toast("Réglages enregistrés");break;
    case "export":download("horairepro-clients-"+today()+".json",JSON.stringify({app:"HorairePro-admin",clients:A.clients,prix:A.prix,vendeur:A.vendeur,offres:A.offres}));toast("Sauvegarde téléchargée");break;
    case "import":{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.clients))throw 0;const ids=new Set(A.clients.map(c=>c.id));d.clients.forEach(c=>{if(!ids.has(c.id))A.clients.push(c)});
        if(d.prix)A.prix=d.prix;if(d.vendeur)A.vendeur=d.vendeur;if(d.offres)A.offres=d.offres;save();render();toast(d.clients.length+" client(s) restauré(s)")}catch(err){toast("Ce fichier n'est pas une sauvegarde admin.")}};r.readAsText(f)};i.click();break}
    case "chgPin":openSheet(`<h3>Changer le code PIN</h3><label class="f">Nouveau PIN<input id="np1" class="pin" type="password" inputmode="numeric" maxlength="8"></label><label class="f">Confirmer<input id="np2" class="pin" type="password" inputmode="numeric" maxlength="8"></label><button class="btn primary block" data-act="doPin">Enregistrer</button><button class="btn ghost" data-act="close">Annuler</button>`);break;
    case "doPin":{const p1=document.getElementById("np1").value,p2=document.getElementById("np2").value;if(!/^\d{4,8}$/.test(p1)){toast("4 à 8 chiffres.");return}if(p1!==p2){toast("Les PIN ne correspondent pas.");return}
      A.vault=await seal(UI.kf,p1);save();closeSheet();toast("Code PIN changé");break}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="n-dur"||e.target.id==="r-dur"){}});
A=load()||fresh();render();if(UI.tab==="new")bindDur("n");
</script>
</body>
</html>
