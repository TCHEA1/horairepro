/* Layout: coque d'application mobile (max 480px, centrée même sur grand écran) — en-tête léger, grande carte émeraude, cartes blanches arrondies, navigation à 5 onglets */
:root{
  --bg:#F2F7F4; --bg2:#DDF0E6; --surface:#FFFFFF; --sunk:#F1F4F2; --ink:#0F1F18; --muted:#7A8981; --line:#E6EDE9;

  --t-orange:#FFEBDD; --t-orange-i:#F2701D; --t-blue:#E3EBFF; --t-blue-i:#3D63E8; --t-violet:#EFE6FF; --t-violet-i:#8A4FE6; --t-pink:#FFE4EC; --t-pink-i:#E5487A; --t-green:#E2F3EA; --t-green-i:#0F7A4E; --t-teal:#DDF4F5; --t-teal-i:#0E9AA7;
  --cs:70%; --cl:91%; --cell-ink:#0F1F18; --off:#E9EEEB;
  --sh:0 8px 24px rgb(16 64 42 / .08); --sh2:0 14px 30px rgb(10 92 58 / .28);

  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#0F1915; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1411; --bg2:#0F2219; --surface:#13201A; --sunk:#1A2A22; --ink:#E8F1EC; --muted:#8FA198; --line:#22342B;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#0F1915; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg2),var(--bg) 340px);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  padding-block:14px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}

.top .logo{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;box-shadow:var(--sh);overflow:hidden;border:2px solid var(--surface)}
.top .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
main{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}

h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;line-height:1.2;text-wrap:balance}

.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .28)}
.btn.warm{background:var(--warm);color:#fff}

.btn.block{width:100%}

.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 14px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--muted);box-shadow:var(--sh)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .25)}
.sec-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
.sec-head h3{font-size:16px}
.sec-head button{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
/* grande carte émeraude */
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:500}

.hero .sub{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.hero .dot{width:8px;height:8px;border-radius:50%;background:#7CF2B8;flex:none}
.hero .prog{height:7px;border-radius:9px;background:rgb(255 255 255 / .22);overflow:hidden;margin-top:8px}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:9px}
.hero .deco{position:absolute;right:-26px;top:16px;width:150px;height:96px;border-radius:16px;background:linear-gradient(135deg,rgb(255 255 255 / .22),rgb(255 255 255 / .04));transform:rotate(-8deg)}
.hero .deco::after{content:"";position:absolute;inset:14px 18px auto auto;width:44px;height:30px;border-radius:7px;background:rgb(255 255 255 / .22)}
.hero > *:not(.deco){position:relative}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
.quick .qi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh);color:var(--accent)}
.quick .qi svg{width:24px;height:24px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px}
.tile svg{width:21px;height:21px}
.tile.orange{background:var(--t-orange);color:var(--t-orange-i)} .tile.blue{background:var(--t-blue);color:var(--t-blue-i)}
.tile.violet{background:var(--t-violet);color:var(--t-violet-i)} .tile.pink{background:var(--t-pink);color:var(--t-pink-i)}
.tile.green{background:var(--t-green);color:var(--t-green-i)} .tile.teal{background:var(--t-teal);color:var(--t-teal-i)}
.tile.solid{background:var(--accent);color:var(--accent-ink)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.steps,.list{display:flex;flex-direction:column}
.step,.item{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.step + .step,.item + .item{border-top:1px solid var(--line)}
.step .t,.item .grow{flex:1;min-width:0}
.step .t b,.item .grow b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .t span,.item .grow span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .end{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.step .end.ok{color:var(--ok)} .step .end.todo{color:var(--warm)}
.chev{color:var(--muted);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}

.chip.bad{background:var(--danger-soft);color:var(--danger)}
.mat{display:inline-grid;place-items:center;min-width:44px;padding:5px 9px;border-radius:10px;font-weight:700;font-size:12px;background:hsl(var(--h) var(--cs) var(--cl));color:var(--cell-ink)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;width:76px;flex:none}

.banner b{color:var(--warm)}
.tip{background:var(--accent-soft);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;font-size:13px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.in{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:11px 13px;font-size:15px;color:var(--ink);font-weight:500;min-height:46px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.edt{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;table-layout:fixed}
table.edt th{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:6px 2px;text-transform:uppercase}
table.edt th.h{width:66px}

table.edt td.brk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:3px;background:none}
.fiche{display:flex;flex-direction:column;gap:12px}
.fiche-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:11px;border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px}

.fiche-title{font-family:var(--f-display);font-weight:800;text-align:center;font-size:15px;letter-spacing:.04em;border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;align-self:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;font-size:13px}

table.rec{border-collapse:collapse;width:100%;font-size:12.5px;min-width:400px}

.actionbar{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,480px);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:19;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}

/* ===================== Stockage ===================== */
let S, dbDoc=null, saveT=null, downloads=null;
function loadLocal(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){S.at=Date.now();clearTimeout(saveT);saveT=setTimeout(saveNow,700)}
async function saveNow(){const json=JSON.stringify(S);try{localStorage.setItem(KEY,json)}catch(e){}
  if(dbDoc){try{await dbDoc.set({json,at:S.at})}catch(e){}}}
function migrate(x){const d=defaultState();for(const k in d) if(x[k]===undefined) x[k]=d[k];x.gen={...d.gen,...x.gen};
  if(x.etab.directeur&&!x.etab.etudesTitre) x.etab.etudesTitre=x.etab.directeur;delete x.etab.directeur;
  x.etab={...defaultEtab(),...x.etab};
  x.profs.forEach(p=>{p.matricule=p.matricule||"";p.origine=p.origine||"";p.indispo=p.indispo||{}});
  x.classes.forEach(c=>{c.salle=c.salle||""});return x}

/* ===================== Utilitaires métier ===================== */
const nS=()=>S.creneaux.length;
const isOff=(d,s)=>!!S.off[d+"-"+s];
const grp=s=>S.creneaux[s]?.g;
const mat=id=>S.matieres.find(m=>m.id===id);
const prof=id=>S.profs.find(p=>p.id===id);
const cls=id=>S.classes.find(c=>c.id===id);
const hcode=h=>"--h:"+h;
const shortName=n=>{if(!n)return"";const p=n.split(" ");return p[0]+(p[1]?" "+p[1][0]+".":"")};
function needOf(c){const g=S.grille[c.niveau]||{};return S.matieres.map(m=>({m:m.id,h:+g[m.id]||0})).filter(x=>x.h>0)}
function classHours(c){return needOf(c).reduce((a,x)=>a+x.h,0)}
function profLoadAff(pid){let t=0;for(const c of S.classes){const a=S.aff[c.id]||{};for(const x of needOf(c)) if(a[x.m]===pid) t+=x.h}return t}
function profCells(pid){const out=[];for(const c of S.classes){const sc=S.sched[c.id]||{};for(const k in sc) if(sc[k].p===pid) out.push({k,c:c.id,m:sc[k].m})}return out}
function placedCount(cid,mid){const sc=S.sched[cid]||{};let n=0;for(const k in sc) if(sc[k].m===mid) n++;return n}
function totalNeeded(){return S.classes.reduce((a,c)=>a+classHours(c),0)}
function totalPlaced(){let n=0;for(const c of S.classes) n+=Object.keys(S.sched[c.id]||{}).length;return n}
function unassignedCount(){let n=0;for(const c of S.classes){const a=S.aff[c.id]||{};for(const x of needOf(c)) if(!a[x.m]||!prof(a[x.m])) n++}return n}
function breakLabel(s){const a=S.creneaux[s-1],b=S.creneaux[s];if(!a||!b||a.g===b.g)return null;
  const mid=parseInt(b.debut)>=13;return (mid?"Pause":"Récréation")+" · "+a.fin+" – "+b.debut}
function classPrefix(niveau){return (NIV.find(n=>n.id===niveau)||{p:niveau}).p}

/* ===================== Affectation automatique ===================== */
function autoAssign(keep=true){
  const load={};S.profs.forEach(p=>load[p.id]=0);
  if(!keep) S.aff={};
  // compter l'existant si on garde
  for(const c of S.classes){S.aff[c.id]=S.aff[c.id]||{};const a=S.aff[c.id];
    for(const x of needOf(c)){if(a[x.m]&&prof(a[x.m])&&prof(a[x.m]).mats.includes(x.m)) load[a[x.m]]+=x.h; else delete a[x.m]}}
  const order=[...S.classes].sort((a,b)=>NIV.findIndex(n=>n.id===a.niveau)-NIV.findIndex(n=>n.id===b.niveau));
  const byNivMat={};
  for(const c of order){const a=S.aff[c.id];for(const x of needOf(c)) if(a[x.m]) byNivMat[c.niveau+"|"+x.m]=a[x.m]}
  let warn=0;
  for(const c of order){const a=S.aff[c.id];
    for(const x of needOf(c)){ if(a[x.m]) continue;
      const cands=S.profs.filter(p=>p.mats.includes(x.m));
      if(!cands.length){warn++;continue}
      const same=byNivMat[c.niveau+"|"+x.m]; let pick=null;
      if(same){const p=prof(same);if(p&&load[p.id]+x.h<=p.max) pick=p}
      if(!pick){const ok=cands.filter(p=>load[p.id]+x.h<=p.max).sort((p,q)=>load[p.id]/p.max-load[q.id]/q.max);pick=ok[0]}
      if(!pick){pick=cands.sort((p,q)=>load[p.id]-load[q.id])[0];warn++}
      a[x.m]=pick.id;load[pick.id]+=x.h;byNivMat[c.niveau+"|"+x.m]=pick.id;
    }}
  return warn;
}

/* ===================== Générateur ===================== */
function buildLessons(){
  const L=[];
  for(const c of S.classes){const a=S.aff[c.id]||{};
    for(const x of needOf(c)){const m=mat(x.m);const p=a[x.m]&&prof(a[x.m])?a[x.m]:null;const ch=[];
      if(S.gen.bloc2&&m.bloc&&x.h>=2){let r=x.h;while(r>=2){ch.push(2);r-=2}if(r)ch.push(1)}else for(let i=0;i<x.h;i++)ch.push(1);
      ch.forEach(d=>L.push({c:c.id,m:x.m,p,d,n:ch.length}));}}
  return L;
}
function generate(){
  const t0=performance.now();const L=buildLessons();const N=nS();const last=N-1;
  const daysAvail=[0,1,2,3,4].filter(d=>[...Array(N).keys()].some(s=>!isOff(d,s))).length;
  const pAvail={},pHours={};
  for(const p of S.profs){let a=0;for(let d=0;d<5;d++)for(let s=0;s<N;s++) if(!isOff(d,s)&&!p.indispo[d+"-"+s]) a++;pAvail[p.id]=a||1;pHours[p.id]=0}
  L.forEach(l=>{if(l.p)pHours[l.p]+=l.d});
  let best=null,att=0;
  while(att<400){att++;
    const C={},P={},CD={},PD={},MD={};const res={};const un=[];let score=0;
    const tight=l=>l.p?pHours[l.p]/pAvail[l.p]:0;
    const ord=L.map(l=>({l,k:(l.d===2?-50:0)-tight(l)*20-(l.n>=4?5:0)+Math.random()*6})).sort((a,b)=>a.k-b.k).map(o=>o.l);
    const tryPlace=(l,dur,forbidDay)=>{
      let bestPos=null,bs=1e9;const m=mat(l.m);
      for(let d=0;d<5;d++){ if(d===forbidDay) continue;
        const md=MD[l.c+"|"+l.m+"|"+d]||0;const hard=l.n<=daysAvail;
        if(md&&hard) continue;
        for(let s=0;s+dur<=N;s++){let ok=true;
          for(let k=0;k<dur;k++){const ss=s+k;const key=d+"-"+ss;
            if(isOff(d,ss)||grp(ss)!==grp(s)||C[l.c+"@"+key]){ok=false;break}
            if(l.p&&(P[l.p+"@"+key]||prof(l.p).indispo[key])){ok=false;break}}
          if(!ok) continue;
          let sc=Math.random()*2;
          sc+=(CD[l.c+"|"+d]||0)*1.4;
          if(l.p) sc+=(PD[l.p+"|"+d]||0)*0.5;
          if(md) sc+=8;
          if(m.matin&&grp(s)===3) sc+=3;
          if(l.m==="EPS"&&grp(s)!==3&&s!==0) sc+=1.5;
          if(s+dur-1===last) sc+=1.8;
          if(C[l.c+"@"+d+"-"+(s-1)]||C[l.c+"@"+d+"-"+(s+dur)]) sc-=1.2;
          if(sc<bs){bs=sc;bestPos={d,s}}
        }}
      if(!bestPos) return null;
      const {d,s}=bestPos;
      for(let k=0;k<dur;k++){const key=d+"-"+(s+k);C[l.c+"@"+key]=1;if(l.p)P[l.p+"@"+key]=1;
        (res[l.c]=res[l.c]||{})[key]={m:l.m,p:l.p}}
      CD[l.c+"|"+d]=(CD[l.c+"|"+d]||0)+dur;if(l.p)PD[l.p+"|"+d]=(PD[l.p+"|"+d]||0)+dur;
      MD[l.c+"|"+l.m+"|"+d]=(MD[l.c+"|"+l.m+"|"+d]||0)+1;score+=bs;return d;
    };
    for(const l of ord){
      const d=tryPlace(l,l.d);
      if(d===null){
        if(l.d===2){const l1={...l,n:l.n+1};const d1=tryPlace(l1,1);
          if(d1===null) un.push(l); else if(tryPlace(l1,1,d1)===null) un.push({...l,d:1});}
        else un.push(l);
      }}
    const miss=un.reduce((a,l)=>a+l.d,0);
    if(!best||miss<best.miss||(miss===best.miss&&score<best.score)) best={res,un,miss,score};
    const el=performance.now()-t0;
    if((best.miss===0&&att>=6)||el>2600) break;
  }
  S.sched=best.res;
  S.gen.report={at:Date.now(),miss:best.miss,un:best.un.map(l=>({c:l.c,m:l.m,p:l.p,d:l.d})),att,total:L.reduce((a,l)=>a+l.d,0)};
  save();return S.gen.report;
}

};
const svg=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const TONES=["orange","blue","violet","pink","teal","green"];
const tone=(str)=>{let h=0;for(const ch of String(str))h=(h*31+ch.charCodeAt(0))>>>0;return TONES[h%TONES.length]};
const initialsOf=n=>String(n||"?").split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const TAB_T={home:"",data:"Saisie des données",gen:"Génération",edt:"Emplois du temps",set:"Réglages"};
const app=document.getElementById("app");

function render(){
  const e=S.etab;
  if(UI.welcome){app.innerHTML=vWelcome();return}
  const initials=e.sigle?e.sigle.slice(0,3).toUpperCase():((e.nom||"KA").replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"KA");
  app.innerHTML=`
  <header class="top"><div class="grow">${UI.tab==="home"?`<small>Bonjour,</small><h1>${esc(e.chefNom||e.nom||APP)}</h1>`:`<small>${esc(e.nom||APP)}</small><h1>${TAB_T[UI.tab]}</h1>`}</div>
  <button class="logo" data-act="tab" data-v="set" aria-label="Établissement">${e.logo?`<img src="${e.logo}" alt="">`:esc(initials)}</button></header>
  <main id="main">${({home:vHome,data:vData,gen:vGen,edt:vEdt,set:vSet})[UI.tab]()}</main>
  ${UI.tab==="edt"&&UI.sel?vActionBar():""}

}

const MARK=`<svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true"><rect x="8" y="12" width="48" height="42" rx="7" fill="none" stroke="var(--accent-ink)" stroke-width="4"/><path d="M8 24h48" stroke="var(--accent-ink)" stroke-width="4"/><path d="M20 6v10M44 6v10" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round"/><rect x="15" y="30" width="10" height="8" rx="2" fill="var(--accent-ink)"/><rect x="27" y="30" width="10" height="8" rx="2" fill="var(--warm)"/><rect x="39" y="41" width="10" height="8" rx="2" fill="var(--accent-ink)"/><rect x="15" y="41" width="10" height="8" rx="2" fill="var(--accent-ink)" opacity=".45"/></svg>`;
function vWelcome(){
  const pat=[215,0,28,255,0, 0,120,0,350,190, 45,0,255,0,28, 300,215,0,120,0, 0,190,350,0,45];
  return `<div class="welcome"><div class="brand"><span class="tile solid">${svg("edt")}</span>${APP}</div>
  <div style="display:flex;flex-direction:column;gap:10px"><h1>Vos emplois du temps, prêts en une minute</h1><p>Toutes les classes et tous les professeurs de l'établissement, sans aucun conflit d'horaire.</p></div>
  <div class="illus"><div class="ih"><span>6è1 · Semaine</span><span>LUN – VEN</span></div>

  <div class="badge">Sans conflit<b>100 %</b></div></div>
  <button class="btn primary big block" data-act="wStart">Configurer mon établissement →</button>
  <div class="gl">Envie de voir avant ?<button data-act="wSample">Découvrir avec un exemple</button></div></div>`}

/* ---------- Accueil ---------- */
function vHome(){
  const need=totalNeeded(),placed=totalPlaced(),ua=unassignedCount();
  const st=[
    ["set","school","teal","Établissement et horaires",S.etab.nom?esc(S.etab.nom):"Nom, logo, DREN, créneaux",!!S.etab.nom],
    ["mats","layers","violet","Matières et volumes",S.matieres.length+" matières",S.matieres.length>0],
    ["classes","book","orange","Classes",S.classes.length+" classes · "+need+" h/semaine",S.classes.length>0],
    ["profs","users","blue","Professeurs",S.profs.length+" professeurs",S.profs.length>0],
    ["aff","link","pink","Affectations",ua?ua+" cours sans professeur":"Chaque matière a son professeur",S.classes.length>0&&ua===0],
    ["gen","gen","green","Génération automatique",S.gen.report?new Date(S.gen.report.at).toLocaleDateString("fr-FR"):"Pas encore lancée",!!S.gen.report&&S.gen.report.miss===0]
  ];
  const pct=need?Math.round(placed/need*100):0;const r=S.gen.report;
  return `
  ${S.exemple?`<div class="banner"><span style="flex:1;min-width:190px"><b>Données d'exemple.</b> Professeurs et effectifs fictifs, pour découvrir l'appli.</span><button class="btn" data-act="clearSample">Commencer à zéro</button></div>`:""}
  <section class="hero"><div class="deco"></div>
    <span class="lbl">Heures de cours placées</span>
    <span class="big">${placed}<small> / ${need} h</small></span>
    <span class="sub"><span class="dot"></span>${r?(r.miss?r.miss+" h à placer à la main":"100 % placé, sans conflit"):"Lancez la génération"} · ${S.classes.length} classes · ${S.profs.length} profs</span>
    <div class="prog"><i style="width:${pct}%"></i></div></section>
  <div class="quick">
    <button data-act="runGen"><span class="qi">${svg("gen")}</span>Générer</button>
    <button data-act="goStep" data-v="classes"><span class="qi">${svg("book")}</span>Classes</button>
    <button data-act="goStep" data-v="profs"><span class="qi">${svg("users")}</span>Profs</button>
    <button data-act="tab" data-v="edt"><span class="qi">${svg("file")}</span>Emplois</button>
  </div>
  <div class="sec-head"><h3>Étapes de préparation</h3><span class="small muted">${st.filter(x=>x[5]).length}/6</span></div>
  <section class="card" style="padding-block:6px"><div class="steps">
    ${st.map(([k,ic,tn,t,s,done])=>`<button class="step" data-act="goStep" data-v="${k}"><span class="tile ${tn}">${svg(ic)}</span><span class="t"><b>${t}</b><span>${s}</span></span><span class="end ${done?"ok":"todo"}">${done?"Terminé":"À faire"}</span></button>`).join("")}
  </div></section>
  <div class="tip"><span class="tile green" style="width:36px;height:36px">${svg("bulb")}</span><div><b>Astuce</b>Touchez un cours dans un emploi du temps, puis une autre case, pour les échanger. L'appli vérifie que le professeur est libre.</div></div>`;
}

/* ---------- Saisie ---------- */
function vData(){
  const subs=[["classes","Classes"],["profs","Professeurs"],["mats","Matières"],["aff","Affectations"]];
  return `<div class="seg" role="group">${subs.map(([k,l])=>`<button data-act="sub" data-v="${k}" aria-pressed="${UI.sub===k}">${l}</button>`).join("")}</div>
  ${({classes:vClasses,profs:vProfs,mats:vMats,aff:vAff})[UI.sub]()}`;
}
function vClasses(){
  const sorted=[...S.classes].sort((a,b)=>NIV.findIndex(n=>n.id===a.niveau)-NIV.findIndex(n=>n.id===b.niveau)||a.nom.localeCompare(b.nom,"fr",{numeric:true}));
  return `<section class="card"><div class="sec-title"><h3>${S.classes.length} classes</h3><div class="row"><button class="btn" data-act="addMany">+ Plusieurs</button><button class="btn primary" data-act="editClass">+ Classe</button></div></div>
  ${sorted.length?`<div class="list">${sorted.map(c=>{const p=prof(c.pp);const h=classHours(c);
    return `<button class="item" data-act="editClass" data-v="${c.id}"><span class="tile ${tone(c.niveau)}" style="width:auto;min-width:42px;padding:0 8px">${esc(c.nom)}</span><span class="grow"><b>${esc(nivL(c.niveau))} · ${c.effectif||0} élèves</b><span>${h} h/semaine${p?" · PP : "+esc(p.nom):""}</span></span><span class="chev">›</span></button>`}).join("")}</div>`
  :`<div class="empty">Aucune classe. Ajoutez-en une, ou plusieurs d'un coup (ex : 6è1 à 6è4).<button class="btn primary" data-act="addMany">Ajouter des classes</button></div>`}</section>`;
}
function vProfs(){
  const sorted=[...S.profs].sort((a,b)=>(a.mats[0]||"").localeCompare(b.mats[0]||"")||a.nom.localeCompare(b.nom));
  return `<section class="card"><div class="sec-title"><h3>${S.profs.length} professeurs</h3><button class="btn primary" data-act="editProf">+ Professeur</button></div>
  ${sorted.length?`<div class="list">${sorted.map(p=>{const l=profLoadAff(p.id);const pct=Math.min(100,l/(p.max||1)*100);
    return `<button class="item" data-act="editProf" data-v="${p.id}"><span class="avatar tile ${tone(p.nom)}" style="border-radius:50%">${esc(initialsOf(p.nom))}</span><span class="grow"><b>${esc(p.nom)}</b><span>${p.mats.map(m=>mat(m)?.code||m).join(", ")} · ${p.statut==="VACATAIRE"?"Vacataire":"Permanent"}</span></span>
      <span style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="small" style="font-variant-numeric:tabular-nums">${l} / ${p.max} h</span><span class="bar"><i class="${l>p.max?"over":""}" style="width:${pct}%"></i></span></span></button>`}).join("")}</div>`
  :`<div class="empty">Aucun professeur pour l'instant.<button class="btn primary" data-act="editProf">Ajouter un professeur</button></div>`}</section>`;
}
function vMats(){
  const nivs=NIV.filter(n=>S.classes.some(c=>c.niveau===n.id));
  const showN=nivs.length?nivs:NIV.slice(0,4);
  return `<section class="card"><div class="sec-title"><h3>Matières</h3><button class="btn primary" data-act="editMat">+ Matière</button></div>
  <div class="list">${S.matieres.map(m=>`<button class="item" data-act="editMat" data-v="${m.id}"><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span><span class="grow"><b>${esc(m.nom)}</b><span>${[m.bloc?"Séances de 2 h":"Séances d'1 h",m.matin?"plutôt le matin":""].filter(Boolean).join(" · ")}</span></span><span class="chev">›</span></button>`).join("")}</div></section>
  <section class="card"><h3>Volumes horaires par semaine</h3><p class="muted small" style="margin:0">Grille proposée par défaut, à ajuster selon les instructions officielles de votre DREN. Une heure = un créneau.</p>
  <div class="scroll"><table class="vol"><thead><tr><th>Matière</th>${showN.map(n=>`<th>${esc(n.l)}</th>`).join("")}</tr></thead>
  <tbody>${S.matieres.map(m=>`<tr><td><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span></td>${showN.map(n=>`<td><input type="number" min="0" max="12" inputmode="numeric" id="v-${n.id}-${m.id}" data-act="vol" data-n="${n.id}" data-m="${m.id}" value="${(S.grille[n.id]||{})[m.id]||""}"></td>`).join("")}</tr>`).join("")}</tbody>
  <tfoot><tr><td>Total</td>${showN.map(n=>`<td>${Object.values(S.grille[n.id]||{}).reduce((a,b)=>a+(+b||0),0)} h</td>`).join("")}</tr></tfoot></table></div></section>`;
}
function vAff(){
  if(!S.classes.length) return `<section class="card"><div class="empty">Ajoutez d'abord des classes et des professeurs.</div></section>`;
  const ua=unassignedCount();
  return `<section class="card"><div class="sec-title"><div><h3>Qui enseigne quoi</h3><span class="muted small">${ua?ua+" cours sans professeur":"Toutes les matières sont couvertes"}</span></div>
  <button class="btn primary" data-act="autoAff">Affecter automatiquement</button></div>
  <p class="muted small" style="margin:0">L'appli répartit les classes entre les professeurs de chaque matière en respectant leur maximum d'heures. Vous pouvez changer chaque choix.</p></section>
  ${S.classes.map(c=>`<section class="card"><div class="sec-title"><h3>${esc(c.nom)}</h3><span class="chip">${classHours(c)} h</span></div>
  <div class="list">${needOf(c).map(x=>{const m=mat(x.m);const cur=(S.aff[c.id]||{})[x.m];const cands=S.profs.filter(p=>p.mats.includes(x.m));const others=S.profs.filter(p=>!p.mats.includes(x.m));
    return `<div class="item" style="cursor:default"><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span><span class="small muted" style="width:30px">${x.h} h</span>
    <select class="in" style="flex:1;min-width:0" id="a-${c.id}-${x.m}" data-act="setAff" data-c="${c.id}" data-m="${x.m}">
      <option value="">— Aucun professeur —</option>
      ${cands.map(p=>`<option value="${p.id}" ${cur===p.id?"selected":""}>${esc(p.nom)} (${profLoadAff(p.id)}/${p.max} h)</option>`).join("")}
      ${others.length?`<optgroup label="Autres professeurs">${others.map(p=>`<option value="${p.id}" ${cur===p.id?"selected":""}>${esc(p.nom)}</option>`).join("")}</optgroup>`:""}
    </select></div>`}).join("")||`<div class="muted small">Aucun volume horaire défini pour ce niveau.</div>`}</div></section>`).join("")}`;
}

/* ---------- Générer ---------- */
function vGen(){
  const r=S.gen.report;const ua=unassignedCount();
  return `<section class="card"><h2>Génération automatique</h2>
  <p class="muted" style="margin:0">L'appli place chaque cours de chaque classe. Un professeur n'est jamais dans deux classes à la fois, et ses indisponibilités sont respectées.</p>
  <label class="check"><input type="checkbox" id="opt-bloc" data-act="optBloc" ${S.gen.bloc2?"checked":""}><span>Regrouper en séances de 2 heures les matières marquées « 2 h » (PC, SVT, Maths, EPS…)</span></label>
  <div class="small muted">Règles appliquées : une même matière une seule fois par jour dans une classe, matières principales le matin, peu de trous, journées équilibrées.</div>
  ${ua?`<div class="banner"><span style="flex:1;min-width:200px"><b>${ua} cours sans professeur.</b> Ils seront placés quand même, sans nom de professeur.</span><button class="btn" data-act="autoAff">Affecter automatiquement</button></div>`:""}
  <button class="btn primary big block" data-act="runGen">Générer tous les emplois du temps</button></section>
  ${r?`<section class="card"><div class="sec-title"><h3>Dernier résultat</h3><span class="chip ${r.miss?"warn":"ok"}">${r.miss?r.miss+" h à placer à la main":"100 % placé"}</span></div>
  <div class="small muted">${new Date(r.at).toLocaleString("fr-FR")} · ${r.total-r.miss} h placées sur ${r.total} · ${r.att} essais</div>
  ${r.un.length?`<p class="small" style="margin:0">Ces cours n'ont pas trouvé de place libre. Allez dans <b>Emplois</b>, touchez une case vide de la classe pour les ajouter, ou réduisez les indisponibilités du professeur.</p>
  <div class="list">${r.un.map(u=>{const m=mat(u.m),c=cls(u.c),p=prof(u.p);return c&&m?`<button class="item" data-act="openEdt" data-v="${u.c}"><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span><span class="grow"><b>${esc(c.nom)} · ${u.d} h</b><span>${p?esc(p.nom):"Sans professeur"}</span></span><span class="chev">›</span></button>`:""}).join("")}</div>`:`<button class="btn" data-act="tab" data-v="edt">Voir les emplois du temps</button>`}</section>`:""}`;
}

/* ---------- Emplois ---------- */
function vEdt(){
  const mode=UI.edtMode;const arr=mode==="classe"?S.classes:S.profs;
  if(!arr.length) return `<section class="card"><div class="empty">Rien à afficher. Ajoutez des ${mode==="classe"?"classes":"professeurs"} puis lancez la génération.</div></section>`;
  if(!arr.find(x=>x.id===UI.edtId)) UI.edtId=arr[0].id;
  const id=UI.edtId;
  return `<div class="seg"><button data-act="edtMode" data-v="classe" aria-pressed="${mode==="classe"}">Par classe</button><button data-act="edtMode" data-v="prof" aria-pressed="${mode==="prof"}">Par professeur</button></div>
  <div class="row"><select class="in grow" style="flex:1" id="edt-pick" data-act="edtPick">${arr.map(x=>`<option value="${x.id}" ${x.id===id?"selected":""}>${esc(x.nom)}</option>`).join("")}</select>
  <button class="btn" data-act="pdfOne">PDF</button><button class="btn primary" data-act="pdfAll">Tout en PDF</button></div>
  ${mode==="classe"?ficheClasse(cls(id)):ficheProf(prof(id))}`;
}
function telLine(e){return [e.tel,e.tel2].filter(Boolean).join(" / ")}
function addrLine(e){return [e.adresse,e.bp,e.ville].filter(Boolean).join(" · ")}
function ficheHead(title){const e=S.etab;return `<div class="fiche-head ${e.logo?"":"nologo"}"><div><b>${esc(e.ministere)}</b><br>DREN : ${esc(e.dren||"—")}<br>Tél : ${esc(telLine(e)||"—")}${e.code?"<br>Code : "+esc(e.code):""}</div>
  ${e.logo?`<div class="lg"><img src="${e.logo}" alt="Logo"></div>`:""}
  <div class="r"><b>RÉPUBLIQUE DE CÔTE D'IVOIRE</b><br><i>Union – Discipline – Travail</i><br><b>${esc((e.nom||"").toUpperCase())}</b><br>Année scolaire : ${esc(e.annee)}${addrLine(e)?"<br>"+esc(addrLine(e)):""}${e.email?"<br>"+esc(e.email):""}</div></div>
  <div class="fiche-title">${title}</div>${e.applic?`<div class="small muted" style="text-align:center">Applicable à partir du ${esc(e.applic)}</div>`:""}`}
function signLine(){const e=S.etab;return `<div class="small" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><i>${esc(e.devise||"")}</i><span style="text-align:right"><b style="text-decoration:underline">${esc(e.etudesTitre||"LE DIRECTEUR DES ÉTUDES")}</b>${e.etudesNom?"<br>"+esc(e.etudesNom):""}</span></div>`}
function gridHTML(kind,id){
  const N=nS();let h=`<div class="scroll"><table class="edt"><thead><tr><th class="h">Horaire</th>${JOURS.map(j=>`<th>${j.slice(0,3)}<span class="small" style="display:none">${j}</span></th>`).join("")}</tr></thead><tbody>`;
  const pc=kind==="prof"?Object.fromEntries(profCells(id).map(x=>[x.k,x])):null;
  for(let s=0;s<N;s++){const bl=breakLabel(s);if(bl) h+=`<tr><td></td><td class="brk" colspan="5">${bl}</td></tr>`;
    const cr=S.creneaux[s];h+=`<tr><td class="h">${cr.debut}<br>${cr.fin}</td>`;
    for(let d=0;d<5;d++){const k=d+"-"+s;
      if(isOff(d,s)){h+=`<td class="c off" title="Pas de cours"></td>`;continue}
      if(kind==="classe"){const v=(S.sched[id]||{})[k];
        const sel=UI.sel&&UI.sel.k===k;const drop=UI.sel&&!sel;
        if(v){const m=mat(v.m);const p=prof(v.p);h+=`<td class="c f ${sel?"sel":""} ${drop?"drop":""}" style="${hcode(m?.h||0)}" data-act="cell" data-k="${k}"><b>${esc(m?.code||"?")}</b><span>${esc(shortName(p?.nom))}</span></td>`}
        else h+=`<td class="c ${drop?"drop":""}" data-act="cell" data-k="${k}" aria-label="Case libre"></td>`;
      }else{const v=pc[k];
        if(v){const m=mat(v.m),c=cls(v.c);h+=`<td class="c f" style="${hcode(m?.h||0)}" data-act="goClass" data-v="${v.c}"><b>${esc(c?.nom)}</b><span>${esc(m?.code)}</span></td>`}
        else h+=`<td class="c" style="cursor:default"></td>`;}
    }h+=`</tr>`}
  return h+`</tbody></table></div>`;
}
function ficheClasse(c){
  const pp=prof(c.pp);const need=needOf(c);
  return `<section class="card fiche">${ficheHead("EMPLOI DU TEMPS CLASSE")}
  <div class="kv"><div><span>Classe :</span> <b>${esc(c.nom)}</b></div><div><span>Effectif :</span> ${c.effectif||"—"}</div><div><span>Professeur principal :</span> ${esc(pp?.nom||"—")}</div><div><span>Volume :</span> ${classHours(c)} h/semaine</div>${c.salle?`<div><span>Salle :</span> ${esc(c.salle)}</div>`:""}</div>
  <p class="small muted" style="margin:0">Touchez un cours, puis une autre case pour l'échanger ou le déplacer. Touchez une case vide pour ajouter un cours.</p>
  ${gridHTML("classe",c.id)}
  <div class="scroll"><table class="rec"><thead><tr><th>Discipline</th><th>Professeur</th><th>Prévu</th><th>Placé</th></tr></thead><tbody>
  ${need.map(x=>{const m=mat(x.m);const p=prof((S.aff[c.id]||{})[x.m]);const pl=placedCount(c.id,x.m);return `<tr><td><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span> ${esc(m.nom)}</td><td>${esc(p?.nom||"—")}</td><td class="n">${x.h} h</td><td class="n">${pl===x.h?pl+" h":`<span class="chip ${pl<x.h?"warn":"bad"}">${pl} h</span>`}</td></tr>`}).join("")}
  </tbody></table></div>
  ${signLine()}</section>`;
}
function profRecap(p){
  const cells=profCells(p.id);const g={};
  for(const x of cells){const c=cls(x.c);const key=x.m+"|"+c.niveau;(g[key]=g[key]||{m:x.m,n:c.niveau,cl:{},h:0}).h++;g[key].cl[c.id]=c}
  const rows=Object.values(g).sort((a,b)=>NIV.findIndex(n=>n.id===a.n)-NIV.findIndex(n=>n.id===b.n));
  const total=cells.length;const sup=Math.max(0,total-(+p.du||0));
  const ppOf=S.classes.filter(c=>c.pp===p.id).map(c=>c.nom).join(", ");
  return {rows,total,sup,ppOf};
}
function ficheProf(p){
  const {rows,total,sup,ppOf}=profRecap(p);
  return `<section class="card fiche">${ficheHead("EMPLOI DU TEMPS PROFESSEUR")}
  <div class="kv"><div><span>Nom et prénoms :</span> <b>${esc(p.nom)}</b></div><div><span>Sexe :</span> ${p.sexe}</div>
  <div><span>Discipline :</span> ${p.mats.map(m=>mat(m)?.code).join(", ")}</div><div><span>Statut :</span> ${p.statut}</div>
  <div><span>Diplôme :</span> ${esc(p.diplome||"—")}</div><div><span>Tél :</span> ${esc(p.tel||"—")}</div>
  <div><span>Matricule / N° autorisation :</span> ${esc(p.matricule||"—")}</div>${p.origine?`<div><span>Établissement d'origine :</span> ${esc(p.origine)}</div>`:""}</div>
  ${gridHTML("prof",p.id)}

function canPut(cid,k,pid,ignore){const [d,s]=k.split("-").map(Number);if(isOff(d,s))return "créneau fermé";if(!pid)return true;
  const p=prof(pid);if(p?.indispo[k])return "professeur indisponible";
  for(const c of S.classes){if(c.id===cid)continue;const v=(S.sched[c.id]||{})[k];if(v&&v.p===pid)return "déjà en "+c.nom}return true}
function cellTap(k){const cid=UI.edtId;const sc=S.sched[cid]=S.sched[cid]||{};
  if(!UI.sel){if(sc[k]){UI.sel={k};render()}else sheetAddLesson(k);return}
  const a=UI.sel.k;if(a===k){UI.sel=null;render();return}
  const A=sc[a],B=sc[k];
  const r1=canPut(cid,k,A?.p);if(r1!==true){toast("Impossible : "+mat(A.m).code+" — "+r1);return}
  if(B){const r2=canPut(cid,a,B.p);if(r2!==true){toast("Impossible : "+mat(B.m).code+" — "+r2);return}}
  if(B){sc[a]=B}else delete sc[a];sc[k]=A;UI.sel=null;save();render();toast(B?"Cours échangés":"Cours déplacé")}

function hslToRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return [255*f(0),255*f(8),255*f(4)].map(Math.round)}

    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text("TABLEAU RECAPITULATIF",W/2,y,{align:"center"});
    const rb=rows.map(r=>{const cl=Object.values(r.cl);return [cl.map(c=>c.nom).join(" / "),String(cl.reduce((a,c)=>a+(+c.effectif||0),0)||"-"),mat(r.m)?.code||"",r.h+"H"]});
    rb.push([{content:"TOTAL",colSpan:3,styles:{fontStyle:"bold",halign:"right"}},{content:total+"H",styles:{fontStyle:"bold"}}]);
    rb.push([{content:"Nombre d'heures supplementaires",colSpan:3,styles:{halign:"right"}},sup+"H"]);
    rb.push([{content:"Professeur Principal de la classe de",colSpan:3,styles:{halign:"right"}},ppOf||"-"]);
    doc.autoTable({startY:y+3,head:[["Classes","Effectifs","Discipline","Nombre d'heures"]],body:rb,theme:"grid",margin:{left:10,right:10},
      styles:{fontSize:8.5,lineColor:60,lineWidth:.2,textColor:20},headStyles:{fillColor:[240,240,240],textColor:20}});
    y=doc.lastAutoTable.finalY+8;}
  else{const c=cls(id);const rb=needOf(c).map(x=>[mat(x.m)?.nom||x.m,prof((S.aff[c.id]||{})[x.m])?.nom||"-",x.h+"H"]);
    doc.autoTable({startY:y,head:[["Discipline","Professeur","Volume"]],body:rb,theme:"grid",margin:{left:10,right:10},
      styles:{fontSize:8,lineColor:60,lineWidth:.2,textColor:20,cellPadding:1.2},headStyles:{fillColor:[240,240,240],textColor:20}});
    y=doc.lastAutoTable.finalY+8;}
  doc.setFont("helvetica","bolditalic");doc.setFontSize(9);doc.text(pdfTxt(e.devise||""),14,y);
  doc.setFont("helvetica","bold");doc.text(pdfTxt(e.etudesTitre||"LE DIRECTEUR DES ÉTUDES"),W-14,y,{align:"right"});
  if(e.etudesNom){doc.setFont("helvetica","normal");doc.text(pdfTxt(e.etudesNom),W-14,y+18,{align:"right"})}
  doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(150);doc.text("Généré avec "+APP,W/2,doc.internal.pageSize.getHeight()-6,{align:"center"});doc.setTextColor(20);
}
function pdfTxt(s){return String(s??"").replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/[“”«»]/g,'"').replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[^\x20-\xFF\n]/g,"")}
function strip(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")}
const STANDALONE=!!window.HORAIREPRO_STANDALONE;let installEvt=null;
async function saveFile(filename,data,mime){
  filename=strip(filename).replace(/[^\w.-]+/g,"_");
  if(downloads){try{await downloads.save({filename,data});toast("Fichier enregistré")}catch(e){if(e?.code!=="declined")toast("Le fichier n'a pas pu être enregistré.")}return}
  if(STANDALONE){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Fichier enregistré dans vos téléchargements");return}
  toast("Le téléchargement n'est pas disponible dans cet affichage.");
}
async function makePDF(kind,ids,filename){
  if(!window.jspdf){toast("Le module PDF n'a pas pu se charger. Vérifiez votre connexion.");return}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  ids.forEach((id,i)=>pdfPage(doc,kind,id,i===0));
  await saveFile(filename,doc.output("arraybuffer"),"application/pdf");
}
function pickLogoFile(){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const M=220,k=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);S.etab.logo=cv.toDataURL("image/png");save();render();toast("Logo enregistré")};
    img.onerror=()=>toast("Cette image n'a pas pu être lue.");img.src=r.result};r.readAsDataURL(f)};inp.click()}

/* ===================== Événements ===================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const a=t.dataset.act,v=t.dataset.v;
  if(["etab","slot","vol","setAff","edtPick","optBloc"].includes(a)) return;
  switch(a){
    case "tab": UI.tab=v;UI.sel=null;render();scrollTo(0,0);break;
    case "sub": UI.sub=v;render();break;
    case "goStep": if(v==="set"){UI.tab="set"} else if(v==="gen"){UI.tab="gen"} else {UI.tab="data";UI.sub=v} render();scrollTo(0,0);break;
    case "close": closeSheet();break;
    case "clearSample": confirmBox("Effacer les données d'exemple et partir d'un établissement vide ?","Effacer",()=>{const keep=S.etab;S=defaultState();S.etab={...S.etab,annee:keep.annee};save();render();toast("Prêt. Commencez par les réglages de l'établissement.")});break;
    case "loadSample": confirmBox("Remplacer toutes vos données par l'exemple ?","Remplacer",()=>{S=sampleState();autoAssign();generate();render();toast("Exemple rechargé")});break;
    case "resetAll": confirmBox("Tout effacer ? Classes, professeurs et emplois du temps seront supprimés.","Tout effacer",()=>{S=defaultState();save();render();toast("Données effacées")});break;
    case "runGen": runGen();break;
    case "autoAff":{const w=autoAssign(true);save();render();toast(w?w+" cours restent sans professeur adapté":"Affectations terminées");break}
    case "editClass": sheetClass(v);break;
    case "addMany": sheetMany();break;
    case "saveClass":{const nom=document.getElementById("fc-nom").value.trim();if(!nom){toast("Donnez un nom à la classe");return}
      const o={nom,niveau:document.getElementById("fc-niv").value,effectif:+document.getElementById("fc-eff").value||0,salle:document.getElementById("fc-salle").value.trim(),pp:document.getElementById("fc-pp").value||null};
      if(v){Object.assign(cls(v),o)}else S.classes.push({id:uid(),...o});S.exemple=false;save();closeSheet();render();break}
    case "saveMany":{const niv=document.getElementById("fm-niv").value,n=Math.min(20,+document.getElementById("fm-n").value||1),eff=+document.getElementById("fm-eff").value||0;
      const p=classPrefix(niv);const ex=S.classes.filter(c=>c.niveau===niv).length;
      for(let i=0;i<n;i++) S.classes.push({id:uid(),nom:p+(n>1||ex?(p.includes(" ")?" ":"")+(ex+i+1):""),niveau:niv,effectif:eff,pp:null});
      save();closeSheet();render();toast(n+" classe(s) ajoutée(s)");break}
    case "delClass": confirmBox("Supprimer cette classe et son emploi du temps ?","Supprimer",()=>{S.classes=S.classes.filter(c=>c.id!==v);delete S.aff[v];delete S.sched[v];save();render()});break;
    case "editProf": sheetProf(v);break;
    case "mini":{const kind=t.dataset.kind,k=t.dataset.k;const map=kind==="off"?S.off:sheetCtx.indispo;
      if(map[k])delete map[k];else map[k]=true;
      if(kind==="off"){save();render()}else document.getElementById("fp-ind").innerHTML=miniGrid("indispo",sheetCtx.indispo);break}
    case "saveProf":{const nom=document.getElementById("fp-nom").value.trim();if(!nom){toast("Saisissez le nom du professeur");return}
      const mats=[...document.querySelectorAll(".fp-mat:checked")].map(x=>x.value);if(!mats.length){toast("Cochez au moins une matière");return}
      const o={nom,sexe:document.getElementById("fp-sexe").value,statut:document.getElementById("fp-statut").value,diplome:document.getElementById("fp-dip").value,
        tel:document.getElementById("fp-tel").value,matricule:document.getElementById("fp-mle").value.trim(),origine:document.getElementById("fp-ori").value.trim(),max:+document.getElementById("fp-max").value||0,du:+document.getElementById("fp-du").value||0,mats,indispo:sheetCtx.indispo};
      if(v)Object.assign(prof(v),o);else S.profs.push({id:uid(),...o});S.exemple=false;save();closeSheet();render();break}
    case "delProf": confirmBox("Supprimer ce professeur ? Ses cours resteront placés sans professeur.","Supprimer",()=>{S.profs=S.profs.filter(p=>p.id!==v);
      for(const c in S.aff)for(const m in S.aff[c]) if(S.aff[c][m]===v) delete S.aff[c][m];
      for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].p===v) S.sched[c][k].p=null;
      S.classes.forEach(c=>{if(c.pp===v)c.pp=null});save();render()});break;
    case "editMat": sheetMat(v);break;
    case "hue": sheetCtx.h=+v;document.querySelectorAll("#fx-sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));break;
    case "saveMat":{const code=document.getElementById("fx-code").value.trim().toUpperCase();if(!code){toast("Saisissez un code court");return}
      const o={code,nom:document.getElementById("fx-nom").value.trim()||code,h:sheetCtx.h,bloc:document.getElementById("fx-bloc").checked,matin:document.getElementById("fx-matin").checked};
      if(v)Object.assign(mat(v),o);else{if(S.matieres.some(m=>m.id===code)){toast("Ce code existe déjà");return}S.matieres.push({id:code,...o})}save();closeSheet();render();break}
    case "delMat": confirmBox("Supprimer cette matière de toutes les classes ?","Supprimer",()=>{S.matieres=S.matieres.filter(m=>m.id!==v);
      for(const n in S.grille) delete S.grille[n][v];for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].m===v) delete S.sched[c][k];
      S.profs.forEach(p=>p.mats=p.mats.filter(m=>m!==v));save();render()});break;
    case "edtMode": UI.edtMode=v;UI.edtId=null;UI.sel=null;render();break;
    case "openEdt": UI.tab="edt";UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();scrollTo(0,0);break;
    case "goClass": UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();break;
    case "cell": cellTap(t.dataset.k);break;
    case "cancelSel": UI.sel=null;render();break;
    case "clearCell": delete (S.sched[UI.edtId]||{})[UI.sel.k];UI.sel=null;save();render();toast("Cours retiré");break;
    case "addLesson":{const k=t.dataset.k,m=t.dataset.m;const pid=(S.aff[UI.edtId]||{})[m]||null;
      (S.sched[UI.edtId]=S.sched[UI.edtId]||{})[k]={m,p:pid&&prof(pid)?pid:null};save();closeSheet();render();toast("Cours ajouté");break}
    case "addSlot":{const l=S.creneaux[S.creneaux.length-1];S.creneaux.push({debut:l?l.fin:"07H00",fin:"",g:l?l.g:1});save();render();break}
    case "delSlot":{const i=+t.dataset.i;confirmBox("Supprimer ce créneau ? Les cours placés à cette heure seront retirés.","Supprimer",()=>{
      const shift=o=>{const n={};for(const k in o){const [d,s]=k.split("-").map(Number);if(s===i)continue;n[d+"-"+(s>i?s-1:s)]=o[k]}return n};
      S.creneaux.splice(i,1);S.off=shift(S.off);for(const c in S.sched)S.sched[c]=shift(S.sched[c]);S.profs.forEach(p=>p.indispo=shift(p.indispo));save();render()});break}
    case "pdfOne":{const arr=UI.edtMode==="classe"?cls(UI.edtId):prof(UI.edtId);makePDF(UI.edtMode,[UI.edtId],"EDT_"+arr.nom+".pdf");break}
    case "pdfAll":{const ids=(UI.edtMode==="classe"?S.classes:S.profs).map(x=>x.id);makePDF(UI.edtMode,ids,"EDT_"+(UI.edtMode==="classe"?"toutes_les_classes":"tous_les_professeurs")+".pdf");break}
    case "exportJson": saveFile("sauvegarde_"+APP+"_"+(S.etab.sigle||S.etab.nom||"etablissement")+".json",JSON.stringify(S),"application/json");break;
    case "pickLogo": pickLogoFile();break;
    case "install": if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case "delLogo": S.etab.logo="";save();render();break;
    case "wStart": UI.welcome=false;S=defaultState();save();UI.tab="set";render();toast("Renseignez d'abord votre établissement");break;
    case "wSample": UI.welcome=false;S=sampleState();autoAssign();generate();render();break;
    case "importJson": document.getElementById("fileIn").click();break;
  }
});
document.addEventListener("change",e=>{const t=e.target;const a=t.dataset?.act;
  if(a==="etab"){S.etab[t.dataset.k]=t.value.trim();save();if(["nom","annee","dren","sigle"].includes(t.dataset.k)){const y=scrollY;render();scrollTo(0,y)}}
  else if(a==="slot"){const c=S.creneaux[+t.dataset.i];c[t.dataset.k]=t.dataset.k==="g"?+t.value:t.value.toUpperCase().replace(":","H");save()}
  else if(a==="vol"){const g=S.grille[t.dataset.n]=S.grille[t.dataset.n]||{};const n=Math.max(0,+t.value||0);if(n)g[t.dataset.m]=n;else delete g[t.dataset.m];save();render()}
  else if(a==="setAff"){(S.aff[t.dataset.c]=S.aff[t.dataset.c]||{})[t.dataset.m]=t.value||undefined;if(!t.value)delete S.aff[t.dataset.c][t.dataset.m];save();render()}
  else if(a==="edtPick"){UI.edtId=t.value;UI.sel=null;render()}
  else if(a==="optBloc"){S.gen.bloc2=t.checked;save()}
});
document.getElementById("fileIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.classes||!x.creneaux)throw 0;S=migrate(x);save();render();toast("Sauvegarde restaurée")}catch(err){toast("Ce fichier n'est pas une sauvegarde valide.")}};
  r.readAsText(f);e.target.value=""});

function runGen(){
  if(!S.classes.length){toast("Ajoutez d'abord des classes");return}
  openSheet(`<div class="spin"></div><h3 style="text-align:center">Génération en cours…</h3><p class="muted small" style="text-align:center;margin:0">L'appli essaie plusieurs combinaisons pour éviter tout conflit.</p>`);
  setTimeout(()=>{if(unassignedCount()) autoAssign(true);const r=generate();closeSheet();UI.tab="gen";render();scrollTo(0,0);
    toast(r.miss?r.miss+" h restent à placer à la main":"Emplois du temps générés, sans conflit")},60);
}

/* ===================== Démarrage ===================== */
(function init(){
  const loc=loadLocal();
  if(loc){S=migrate(loc)}else{S=defaultState();UI.welcome=true}
  render();
  if(STANDALONE&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();installEvt=ev;if(UI.tab==="set")render()});
  (async()=>{
    try{downloads=await window.claude?.use?.("downloads")}catch(e){}
    try{const db=await window.claude?.use?.("db");const user=await window.claude?.use?.("user");
      const id=user?await user.id():null;
      if(db&&id){dbDoc=db.doc("data/users/"+id+"/etab");const snap=await dbDoc.get();
        if(snap.exists){const d=snap.data();if(d&&d.json&&(+d.at||0)>(S.at||0)){S=migrate(JSON.parse(d.json));UI.welcome=false;render()}}
        else if(!UI.welcome) saveNow();}
    }catch(e){}
  })();
})();
</script>
