/* ===================== Utilitaires métier ===================== */
const nS=()=>S.creneaux.length;
const isOff=(d,s)=>!!S.off[d+"-"+s];
const grp=s=>S.creneaux[s]?.g;
const mat=id=>S.matieres.find(m=>m.id===id);
const prof=id=>S.profs.find(p=>p.id===id);
const cls=id=>S.classes.find(c=>c.id===id);
const hcode=h=>"--h:"+h;
const shortName=n=>{if(!n)return"";const p=n.split(" ");return p[0]+(p[1]?" "+p[1][0]+".":"")};
function needOf(c){const g=S.grille[c.niveau]||{};return S.matieres.map(m=>({m:m.id,h:+g[m.id]||0})).filter(x=>x.h>0)}
function classHours(c){return needOf(c).reduce((a,x)=>a+x.h,0)}
function profLoadAff(pid){let t=0;for(const c of S.classes){const a=S.aff[c.id]||{};for(const x of needOf(c)) if(a[x.m]===pid) t+=x.h}return t}
function profCells(pid){const out=[];for(const c of S.classes){const sc=S.sched[c.id]||{};for(const k in sc) if(sc[k].p===pid) out.push({k,c:c.id,m:sc[k].m})}return out}
function placedCount(cid,mid){const sc=S.sched[cid]||{};let n=0;for(const k in sc) if(sc[k].m===mid) n++;return n}
function totalNeeded(){return S.classes.reduce((a,c)=>a+classHours(c),0)}
function totalPlaced(){let n=0;for(const c of S.classes) n+=Object.keys(S.sched[c.id]||{}).length;return n}
function unassignedCount(){let n=0;for(const c of S.classes){const a=S.aff[c.id]||{};for(const x of needOf(c)) if(!a[x.m]||!prof(a[x.m])) n++}return n}
function breakLabel(s){const a=S.creneaux[s-1],b=S.creneaux[s];if(!a||!b||a.g===b.g)return null;
  const mid=parseInt(b.debut)>=13;return (mid?"Pause":"Récréation")+" · "+a.fin+" – "+b.debut}
function classPrefix(niveau){return (NIV.find(n=>n.id===niveau)||{p:niveau}).p}

/* ===================== Affectation automatique ===================== */
function autoAssign(keep=true){
  const load={};S.profs.forEach(p=>load[p.id]=0);
  if(!keep) S.aff={};
  // compter l'existant si on garde
  for(const c of S.classes){S.aff[c.id]=S.aff[c.id]||{};const a=S.aff[c.id];
    for(const x of needOf(c)){if(a[x.m]&&prof(a[x.m])&&prof(a[x.m]).mats.includes(x.m)) load[a[x.m]]+=x.h; else delete a[x.m]}}
  const order=[...S.classes].sort((a,b)=>NIV.findIndex(n=>n.id===a.niveau)-NIV.findIndex(n=>n.id===b.niveau));
  const byNivMat={};
  for(const c of order){const a=S.aff[c.id];for(const x of needOf(c)) if(a[x.m]) byNivMat[c.niveau+"|"+x.m]=a[x.m]}
  let warn=0;
  for(const c of order){const a=S.aff[c.id];
    for(const x of needOf(c)){ if(a[x.m]) continue;
      const cands=S.profs.filter(p=>p.mats.includes(x.m));
      if(!cands.length){warn++;continue}
      const same=byNivMat[c.niveau+"|"+x.m]; let pick=null;
      if(same){const p=prof(same);if(p&&load[p.id]+x.h<=p.max) pick=p}
      if(!pick){const ok=cands.filter(p=>load[p.id]+x.h<=p.max).sort((p,q)=>load[p.id]/p.max-load[q.id]/q.max);pick=ok[0]}
      if(!pick){pick=cands.sort((p,q)=>load[p.id]-load[q.id])[0];warn++}
      a[x.m]=pick.id;load[pick.id]+=x.h;byNivMat[c.niveau+"|"+x.m]=pick.id;
    }}
  return warn;
}

/* ===================== Générateur ===================== */
function buildLessons(){
  const L=[];
  for(const c of S.classes){const a=S.aff[c.id]||{};
    for(const x of needOf(c)){const m=mat(x.m);const p=a[x.m]&&prof(a[x.m])?a[x.m]:null;const ch=[];
      if(S.gen.bloc2&&m.bloc&&x.h>=2){let r=x.h;while(r>=2){ch.push(2);r-=2}if(r)ch.push(1)}else for(let i=0;i<x.h;i++)ch.push(1);
      ch.forEach(d=>L.push({c:c.id,m:x.m,p,d,n:ch.length}));}}
  return L;
}
function generate(){
  const t0=performance.now();const L=buildLessons();const N=nS();const last=N-1;
  const daysAvail=[0,1,2,3,4].filter(d=>[...Array(N).keys()].some(s=>!isOff(d,s))).length;
  const pAvail={},pHours={};
  for(const p of S.profs){let a=0;for(let d=0;d<5;d++)for(let s=0;s<N;s++) if(!isOff(d,s)&&!p.indispo[d+"-"+s]) a++;pAvail[p.id]=a||1;pHours[p.id]=0}
  L.forEach(l=>{if(l.p)pHours[l.p]+=l.d});
  let best=null,att=0;
  while(att<400){att++;
    const C={},P={},CD={},PD={},MD={};const res={};const un=[];let score=0;
    const tight=l=>l.p?pHours[l.p]/pAvail[l.p]:0;
    const ord=L.map(l=>({l,k:(l.d===2?-50:0)-tight(l)*20-(l.n>=4?5:0)+Math.random()*6})).sort((a,b)=>a.k-b.k).map(o=>o.l);
    const tryPlace=(l,dur,forbidDay)=>{
      let bestPos=null,bs=1e9;const m=mat(l.m);
      for(let d=0;d<5;d++){ if(d===forbidDay) continue;
        const md=MD[l.c+"|"+l.m+"|"+d]||0;const hard=l.n<=daysAvail;
        if(md&&hard) continue;
        for(let s=0;s+dur<=N;s++){let ok=true;
          for(let k=0;k<dur;k++){const ss=s+k;const key=d+"-"+ss;
            if(isOff(d,ss)||grp(ss)!==grp(s)||C[l.c+"@"+key]){ok=false;break}
            if(l.p&&(P[l.p+"@"+key]||prof(l.p).indispo[key])){ok=false;break}}
          if(!ok) continue;
          let sc=Math.random()*2;
          sc+=(CD[l.c+"|"+d]||0)*1.4;
          if(l.p) sc+=(PD[l.p+"|"+d]||0)*0.5;
          if(md) sc+=8;
          if(m.matin&&grp(s)===3) sc+=3;
          if(l.m==="EPS"&&grp(s)!==3&&s!==0) sc+=1.5;
          if(s+dur-1===last) sc+=1.8;
          if(C[l.c+"@"+d+"-"+(s-1)]||C[l.c+"@"+d+"-"+(s+dur)]) sc-=1.2;
          if(sc<bs){bs=sc;bestPos={d,s}}
        }}
      if(!bestPos) return null;
      const {d,s}=bestPos;
      for(let k=0;k<dur;k++){const key=d+"-"+(s+k);C[l.c+"@"+key]=1;if(l.p)P[l.p+"@"+key]=1;
        (res[l.c]=res[l.c]||{})[key]={m:l.m,p:l.p}}
      CD[l.c+"|"+d]=(CD[l.c+"|"+d]||0)+dur;if(l.p)PD[l.p+"|"+d]=(PD[l.p+"|"+d]||0)+dur;
      MD[l.c+"|"+l.m+"|"+d]=(MD[l.c+"|"+l.m+"|"+d]||0)+1;score+=bs;return d;
    };
    for(const l of ord){
      const d=tryPlace(l,l.d);
      if(d===null){
        if(l.d===2){const l1={...l,n:l.n+1};const d1=tryPlace(l1,1);
          if(d1===null) un.push(l); else if(tryPlace(l1,1,d1)===null) un.push({...l,d:1});}
        else un.push(l);
      }}
    const miss=un.reduce((a,l)=>a+l.d,0);
    if(!best||miss<best.miss||(miss===best.miss&&score<best.score)) best={res,un,miss,score};
    const el=performance.now()-t0;
    if((best.miss===0&&att>=6)||el>2600) break;
  }
  S.sched=best.res;
  S.gen.report={at:Date.now(),miss:best.miss,un:best.un.map(l=>({c:l.c,m:l.m,p:l.p,d:l.d})),att,total:L.reduce((a,l)=>a+l.d,0)};
  save();return S.gen.report;
}

function gridHTML(kind,id){

function ficheClasse(c){

function profRecap(p){
  const cells=profCells(p.id);const g={};
  for(const x of cells){const c=cls(x.c);const key=x.m+"|"+c.niveau;(g[key]=g[key]||{m:x.m,n:c.niveau,cl:{},h:0}).h++;g[key].cl[c.id]=c}
  const rows=Object.values(g).sort((a,b)=>NIV.findIndex(n=>n.id===a.n)-NIV.findIndex(n=>n.id===b.n));
  const total=cells.length;const sup=Math.max(0,total-(+p.du||0));
  const ppOf=S.classes.filter(c=>c.pp===p.id).map(c=>c.nom).join(", ");
  return {rows,total,sup,ppOf};
}

function miniGrid(kind,map){const N=nS();let h=`<div class="mini"><div></div>${JOURS.map(j=>`<div>${j.slice(0,3)}</div>`).join("")}`;

/* ===================== Feuilles (formulaires) ===================== */
let sheetCtx=null;
function openSheet(html){closeSheet();const d=document.createElement("div");d.className="scrim";d.id="scrim";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  d.addEventListener("click",e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);
  setTimeout(()=>{const f=d.querySelector("input,select");if(f&&!("ontouchstart" in window))f.focus()},50)}
function closeSheet(){document.getElementById("scrim")?.remove();sheetCtx=null}
function toast(msg){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function canPut(cid,k,pid,ignore){const [d,s]=k.split("-").map(Number);if(isOff(d,s))return "créneau fermé";if(!pid)return true;
  const p=prof(pid);if(p?.indispo[k])return "professeur indisponible";
  for(const c of S.classes){if(c.id===cid)continue;const v=(S.sched[c.id]||{})[k];if(v&&v.p===pid)return "déjà en "+c.nom}return true}
function cellTap(k){const cid=UI.edtId;const sc=S.sched[cid]=S.sched[cid]||{};
  if(!UI.sel){if(sc[k]){UI.sel={k};render()}else sheetAddLesson(k);return}
  const a=UI.sel.k;if(a===k){UI.sel=null;render();return}
  const A=sc[a],B=sc[k];
  const r1=canPut(cid,k,A?.p);if(r1!==true){toast("Impossible : "+mat(A.m).code+" — "+r1);return}
  if(B){const r2=canPut(cid,a,B.p);if(r2!==true){toast("Impossible : "+mat(B.m).code+" — "+r2);return}}
  if(B){sc[a]=B}else delete sc[a];sc[k]=A;UI.sel=null;save();render();toast(B?"Cours échangés":"Cours déplacé")}

function pdfTxt(s){return String(s??"").replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/[“”«»]/g,'"').replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[^\x20-\xFF\n]/g,"")}
function strip(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")}
const STANDALONE=!!window.HORAIREPRO_STANDALONE;let installEvt=null;
async function saveFile(filename,data,mime){
  filename=strip(filename).replace(/[^\w.-]+/g,"_");
  if(downloads){try{await downloads.save({filename,data});toast("Fichier enregistré")}catch(e){if(e?.code!=="declined")toast("Le fichier n'a pas pu être enregistré.")}return}
  if(STANDALONE){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Fichier enregistré dans vos téléchargements");return}
  toast("Le téléchargement n'est pas disponible dans cet affichage.");
}
async function makePDF(kind,ids,filename){
  if(!window.jspdf){toast("Le module PDF n'a pas pu se charger. Vérifiez votre connexion.");return}

}
function pickLogoFile(){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const M=220,k=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);S.etab.logo=cv.toDataURL("image/png");save();render();toast("Logo enregistré")};
    img.onerror=()=>toast("Cette image n'a pas pu être lue.");img.src=r.result};r.readAsDataURL(f)};inp.click()}

document.addEventListener("click",async e=>{

    case "autoAff":{const w=autoAssign(true);save();render();toast(w?w+" cours restent sans professeur adapté":"Affectations terminées");break}
    case "editClass": sheetClass(v);break;
    case "addMany": sheetMany();break;

      const o={nom,niveau:document.getElementById("fc-niv").value,effectif:+document.getElementById("fc-eff").value||0,salle:document.getElementById("fc-salle").value.trim(),pp:document.getElementById("fc-pp").value||null};
      if(v){Object.assign(cls(v),o)}else S.classes.push({id:uid(),...o});S.exemple=false;save();closeSheet();render();break}

      const p=classPrefix(niv);const ex=S.classes.filter(c=>c.niveau===niv).length;
      for(let i=0;i<n;i++) S.classes.push({id:uid(),nom:p+(n>1||ex?(p.includes(" ")?" ":"")+(ex+i+1):""),niveau:niv,effectif:eff,pp:null});
      save();closeSheet();render();toast(n+" classe(s) ajoutée(s)");break}
    case "delClass": confirmBox("Supprimer cette classe et son emploi du temps ?","Supprimer",()=>{S.classes=S.classes.filter(c=>c.id!==v);delete S.aff[v];delete S.sched[v];save();render()});break;
    case "editProf": sheetProf(v);break;
    case "mini":{const kind=t.dataset.kind,k=t.dataset.k;const map=kind==="off"?S.off:sheetCtx.indispo;
      if(map[k])delete map[k];else map[k]=true;
      if(kind==="off"){save();render()}else document.getElementById("fp-ind").innerHTML=miniGrid("indispo",sheetCtx.indispo);break}
    case "saveProf":{const nom=document.getElementById("fp-nom").value.trim();if(!nom){toast("Saisissez le nom du professeur");return}
      const mats=[...document.querySelectorAll(".fp-mat:checked")].map(x=>x.value);if(!mats.length){toast("Cochez au moins une matière");return}
      const o={nom,sexe:document.getElementById("fp-sexe").value,statut:document.getElementById("fp-statut").value,diplome:document.getElementById("fp-dip").value,
        tel:document.getElementById("fp-tel").value,matricule:document.getElementById("fp-mle").value.trim(),origine:document.getElementById("fp-ori").value.trim(),max:+document.getElementById("fp-max").value||0,du:+document.getElementById("fp-du").value||0,mats,indispo:sheetCtx.indispo};

    case "delProf": confirmBox("Supprimer ce professeur ? Ses cours resteront placés sans professeur.","Supprimer",()=>{S.profs=S.profs.filter(p=>p.id!==v);

      if(v)Object.assign(mat(v),o);else{if(S.matieres.some(m=>m.id===code)){toast("Ce code existe déjà");return}S.matieres.push({id:code,...o})}save();closeSheet();render();break}
    case "delMat": confirmBox("Supprimer cette matière de toutes les classes ?","Supprimer",()=>{S.matieres=S.matieres.filter(m=>m.id!==v);
      for(const n in S.grille) delete S.grille[n][v];for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].m===v) delete S.sched[c][k];
      S.profs.forEach(p=>p.mats=p.mats.filter(m=>m!==v));save();render()});break;
    case "edtMode": UI.edtMode=v;UI.edtId=null;UI.sel=null;render();break;
    case "openEdt": UI.tab="edt";UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();scrollTo(0,0);break;
    case "goClass": UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();break;
    case "cell": cellTap(t.dataset.k);break;
    case "cancelSel": UI.sel=null;render();break;
    case "clearCell": delete (S.sched[UI.edtId]||{})[UI.sel.k];UI.sel=null;save();render();toast("Cours retiré");break;
    case "addLesson":{const k=t.dataset.k,m=t.dataset.m;const pid=(S.aff[UI.edtId]||{})[m]||null;
      (S.sched[UI.edtId]=S.sched[UI.edtId]||{})[k]={m,p:pid&&prof(pid)?pid:null};save();closeSheet();render();toast("Cours ajouté");break}
    case "addSlot":{const l=S.creneaux[S.creneaux.length-1];S.creneaux.push({debut:l?l.fin:"07H00",fin:"",g:l?l.g:1});save();render();break}
    case "delSlot":{const i=+t.dataset.i;confirmBox("Supprimer ce créneau ? Les cours placés à cette heure seront retirés.","Supprimer",()=>{
      const shift=o=>{const n={};for(const k in o){const [d,s]=k.split("-").map(Number);if(s===i)continue;n[d+"-"+(s>i?s-1:s)]=o[k]}return n};
      S.creneaux.splice(i,1);S.off=shift(S.off);for(const c in S.sched)S.sched[c]=shift(S.sched[c]);S.profs.forEach(p=>p.indispo=shift(p.indispo));save();render()});break}
    case "pdfOne":{const arr=UI.edtMode==="classe"?cls(UI.edtId):prof(UI.edtId);makePDF(UI.edtMode,[UI.edtId],"EDT_"+arr.nom+".pdf");break}
    case "pdfAll":{const ids=(UI.edtMode==="classe"?S.classes:S.profs).map(x=>x.id);makePDF(UI.edtMode,ids,"EDT_"+(UI.edtMode==="classe"?"toutes_les_classes":"tous_les_professeurs")+".pdf");break}
    case "exportJson": saveFile("sauvegarde_"+APP+"_"+(S.etab.sigle||S.etab.nom||"etablissement")+".json",JSON.stringify(S),"application/json");break;
    case "pickLogo": pickLogoFile();break;
    case "install": if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case "delLogo": S.etab.logo="";save();render();break;
    case "wStart": UI.welcome=false;S=defaultState();save();UI.tab="set";render();toast("Renseignez d'abord votre établissement");break;
    case "wSample": UI.welcome=false;S=sampleState();autoAssign();generate();render();break;
    case "importJson": document.getElementById("fileIn").click();break;
  }
});
document.addEventListener("change",e=>{const t=e.target;const a=t.dataset?.act;
  if(a==="etab"){S.etab[t.dataset.k]=t.value.trim();save();if(["nom","annee","dren","sigle"].includes(t.dataset.k)){const y=scrollY;render();scrollTo(0,y)}}
  else if(a==="slot"){const c=S.creneaux[+t.dataset.i];c[t.dataset.k]=t.dataset.k==="g"?+t.value:t.value.toUpperCase().replace(":","H");save()}
  else if(a==="vol"){const g=S.grille[t.dataset.n]=S.grille[t.dataset.n]||{};const n=Math.max(0,+t.value||0);if(n)g[t.dataset.m]=n;else delete g[t.dataset.m];save();render()}
  else if(a==="setAff"){(S.aff[t.dataset.c]=S.aff[t.dataset.c]||{})[t.dataset.m]=t.value||undefined;if(!t.value)delete S.aff[t.dataset.c][t.dataset.m];save();render()}
  else if(a==="edtPick"){UI.edtId=t.value;UI.sel=null;render()}
  else if(a==="optBloc"){S.gen.bloc2=t.checked;save()}
});
document.getElementById("fileIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.classes||!x.creneaux)throw 0;S=migrate(x);save();render();toast("Sauvegarde restaurée")}catch(err){toast("Ce fichier n'est pas une sauvegarde valide.")}};
  r.readAsText(f);e.target.value=""});

function runGen(){
  if(!S.classes.length){toast("Ajoutez d'abord des classes");return}
  openSheet(`<div class="spin"></div><h3 style="text-align:center">Génération en cours…</h3><p class="muted small" style="text-align:center;margin:0">L'appli essaie plusieurs combinaisons pour éviter tout conflit.</p>`);
  setTimeout(()=>{if(unassignedCount()) autoAssign(true);const r=generate();closeSheet();UI.tab="gen";render();scrollTo(0,0);
    toast(r.miss?r.miss+" h restent à placer à la main":"Emplois du temps générés, sans conflit")},60);
}

/* ===================== Démarrage ===================== */
(function init(){
  const loc=loadLocal();
  if(loc){S=migrate(loc)}else{S=defaultState();UI.welcome=true}
  render();
  if(STANDALONE&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();installEvt=ev;if(UI.tab==="set")render()});
  (async()=>{
    try{downloads=await window.claude?.use?.("downloads")}catch(e){}
    try{const db=await window.claude?.use?.("db");const user=await window.claude?.use?.("user");
      const id=user?await user.id():null;
      if(db&&id){dbDoc=db.doc("data/users/"+id+"/etab");const snap=await dbDoc.get();
        if(snap.exists){const d=snap.data();if(d&&d.json&&(+d.at||0)>(S.at||0)){S=migrate(JSON.parse(d.json));UI.welcome=false;render()}}
        else if(!UI.welcome) saveNow();}
    }catch(e){}
  })();
})();
</script>
