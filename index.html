<style>
/* Layout: coque d'application mobile (max 480px, centrée même sur grand écran) — en-tête léger, grande carte émeraude, cartes blanches arrondies, navigation à 5 onglets */
:root{
  --bg:#F3F4F6; --bg2:#ECEEF1; --surface:#FFFFFF; --sunk:#F3F4F6; --ink:#0F1F18; --muted:#7A8981; --line:#E6EDE9;
  --accent:#0F7A4E; --accent-2:#0A5C3A; --accent-ink:#FFFFFF; --accent-soft:#E2F3EA; --warm:#F08C1A; --warm-soft:#FEF0DE;
  --danger:#E5484D; --danger-soft:#FDE7E8; --ok:#16A065;
  --t-orange:#FFEBDD; --t-orange-i:#F2701D; --t-blue:#E3EBFF; --t-blue-i:#3D63E8; --t-violet:#EFE6FF; --t-violet-i:#8A4FE6; --t-pink:#FFE4EC; --t-pink-i:#E5487A; --t-green:#E2F3EA; --t-green-i:#0F7A4E; --t-teal:#DDF4F5; --t-teal-i:#0E9AA7;
  --cs:70%; --cl:91%; --cell-ink:#0F1F18; --off:#E8EAEE;
  --sh:0 6px 20px rgb(17 24 39 / .06); --sh2:0 14px 30px rgb(10 92 58 / .28);
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#18191D; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#18191D; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg2),var(--bg) 340px);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgb(16 64 42 / .10);background:linear-gradient(180deg,var(--bg2),var(--bg) 340px)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding-block:14px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top .grow{min-width:0;flex:1}
.top small{display:block;color:var(--accent);font-size:13px;font-weight:600}
.top h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;box-shadow:var(--sh);overflow:hidden;border:2px solid var(--surface)}
.top .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
main{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:20;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgb(16 64 42 / .08);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:23px;height:23px}

nav.tabs .pill{display:grid;place-items:center;width:44px;height:30px;border-radius:12px}
nav.tabs button[aria-current="true"] .pill{background:var(--accent-soft)}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.btn{border:0;text-decoration:none;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .28)}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:15.5px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 14px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--muted);box-shadow:var(--sh)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .25)}
.sec-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
.sec-head h3{font-size:16px}
.sec-head button{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
/* grande carte émeraude */
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:500}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;opacity:.8;font-weight:700}
.hero .sub{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.hero .dot{width:8px;height:8px;border-radius:50%;background:#7CF2B8;flex:none}
.hero .prog{height:7px;border-radius:9px;background:rgb(255 255 255 / .22);overflow:hidden;margin-top:8px}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:9px}
.hero .deco{position:absolute;right:-26px;top:16px;width:150px;height:96px;border-radius:16px;background:linear-gradient(135deg,rgb(255 255 255 / .22),rgb(255 255 255 / .04));transform:rotate(-8deg)}
.hero .deco::after{content:"";position:absolute;inset:14px 18px auto auto;width:44px;height:30px;border-radius:7px;background:rgb(255 255 255 / .22)}
.hero > *:not(.deco){position:relative}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
.quick .qi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh);color:var(--accent)}
.quick .qi svg{width:24px;height:24px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px}
.tile svg{width:21px;height:21px}
.tile.orange{background:var(--t-orange);color:var(--t-orange-i)} .tile.blue{background:var(--t-blue);color:var(--t-blue-i)}
.tile.violet{background:var(--t-violet);color:var(--t-violet-i)} .tile.pink{background:var(--t-pink);color:var(--t-pink-i)}
.tile.green{background:var(--t-green);color:var(--t-green-i)} .tile.teal{background:var(--t-teal);color:var(--t-teal-i)}
.tile.solid{background:var(--accent);color:var(--accent-ink)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.steps,.list{display:flex;flex-direction:column}
.step,.item{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.step + .step,.item + .item{border-top:1px solid var(--line)}
.step .t,.item .grow{flex:1;min-width:0}
.step .t b,.item .grow b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .t span,.item .grow span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .end{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.step .end.ok{color:var(--ok)} .step .end.todo{color:var(--warm)}
.chev{color:var(--muted);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warm-soft);color:var(--warm)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.mat{display:inline-grid;place-items:center;min-width:44px;padding:5px 9px;border-radius:10px;font-weight:700;font-size:12px;background:hsl(var(--h) var(--cs) var(--cl));color:var(--cell-ink)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;width:76px;flex:none}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar i.over{background:var(--danger)}
.banner{background:var(--warm-soft);color:var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner b{color:var(--warm)}
.tip{background:var(--accent-soft);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.tip b{color:var(--accent);display:block;margin-bottom:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.in{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:11px 13px;font-size:15px;color:var(--ink);font-weight:500;min-height:46px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.edt{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;table-layout:fixed}
table.edt th{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:6px 2px;text-transform:uppercase}
table.edt th.h{width:66px}
table.edt td.h{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;line-height:1.25;padding:2px}
table.edt td.c{height:50px;border-radius:11px;background:var(--sunk);text-align:center;vertical-align:middle;padding:3px 2px;cursor:pointer;position:relative;border:2px solid transparent}
table.edt td.c.f{background:hsl(var(--h) var(--cs) var(--cl));color:var(--cell-ink)}
table.edt td.c.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px);cursor:default}
table.edt td.c.sel{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-soft)}
table.edt td.c.drop{border-style:dashed;border-color:var(--accent);background-color:color-mix(in srgb,var(--accent-soft) 60%,var(--sunk))}
table.edt td.c.f.drop{background:hsl(var(--h) var(--cs) var(--cl))}
table.edt td.c.no{opacity:.32}
table.edt td.c .rm{display:inline-block;margin-left:2px;vertical-align:1px;white-space:nowrap;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgb(255 255 255 / .55);color:var(--cell-ink);opacity:1;max-width:100%}
table.edt td.c.split{background:linear-gradient(135deg,hsl(var(--h) var(--cs) var(--cl)) 50%,hsl(var(--h2) var(--cs) var(--cl)) 50%);padding:2px 3px}
table.edt td.c .hl{display:block;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1}
table.edt td.c .hl + .hl{margin-top:3px;padding-top:3px;border-top:1px dashed rgb(0 0 0 / .18)}
table.edt td.c .hl b{display:inline;font-size:11px}
table.edt td.c .hl span{display:inline;font-size:9.5px;opacity:.8}
table.edt td.c .wk{font-style:normal;font-size:8.5px;font-weight:800;background:var(--cell-ink);color:var(--surface);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.wkk{font-size:10px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 5px}
table.edt td.c span.mr{opacity:1;font-weight:600}
table.edt td.c b{display:block;font-size:12.5px;font-weight:800;line-height:1.15}
table.edt td.c span{display:block;font-size:10px;opacity:.8;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.edt td.brk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:3px;background:none}
.fiche{display:flex;flex-direction:column;gap:12px}
.fiche-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:11px;border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px}

.fiche-head b{font-weight:700}
.fiche-head .lg{width:56px;height:56px;display:grid;place-items:center}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;font-size:13px}
.kv div span{color:var(--muted)}
table.rec{border-collapse:collapse;width:100%;font-size:12.5px;min-width:400px}
table.rec th,table.rec td{border:1px solid var(--line);padding:7px 8px;text-align:left}

table.vol tfoot td{font-weight:700;font-family:var(--f-mono);text-align:center}
.actionbar{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,480px);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:19;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}

.actionbar .btn{min-height:36px;padding:6px 12px;font-size:13px;background:rgb(255 255 255 / .12);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgb(6 20 14 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(min(100%,480px) - 32px);text-align:center}
.mini{display:grid;grid-template-columns:50px repeat(5,1fr);gap:3px;font-size:10.5px}
.mini div{text-align:center;color:var(--muted);font-weight:600;padding:2px}
.mini button{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;font-size:10px;font-weight:700;color:var(--muted)}
.mini button.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.mini button.has{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-size:9px}

.sw{display:flex;flex-wrap:wrap;gap:8px}

.sw button[aria-pressed="true"]{border-color:var(--accent)}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

const frDate=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"";
function b64uDec(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const b=atob(t);return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function verifyCode(raw){
  const code=String(raw||"").replace(/\s+/g,"");const m=code.match(/^HP-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
  if(!m) return {ok:false,err:"Ce code n'a pas le bon format. Il commence par HP-"};
  try{const pay=b64uDec(m[1]),sig=b64uDec(m[2]);
    const key=await crypto.subtle.importKey("jwk",PUBKEY,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const good=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,pay);
    if(!good) return {ok:false,err:"Ce code n'est pas valide. Vérifiez qu'il a été copié en entier."};
    return {ok:true,code,data:JSON.parse(new TextDecoder().decode(pay))};
  }catch(e){return {ok:false,err:"Ce code n'a pas pu être vérifié."}}
}

const fmtH=h=>{const n=Math.floor(h),f=Math.round((h-n)*60);return f?(n?n+"h"+String(f).padStart(2,"0"):f+" min"):n+" h"};
function roomBusy(rid,k,exceptCid){const r=salle(rid);if(!r||r.multi)return null;for(const c of S.classes){if(c.id===exceptCid)continue;const v=(S.sched[c.id]||{})[k];if(v&&v.r===rid)return c}return null}

/* ===================== Affectation automatique ===================== */
function autoAssign(keep=true){
  const load={};S.profs.forEach(p=>load[p.id]=0);
  if(!keep) S.aff={};
  // compter l'existant si on garde
  for(const c of S.classes){S.aff[c.id]=S.aff[c.id]||{};const a=S.aff[c.id];
    for(const x of needOf(c)){if(a[x.m]&&prof(a[x.m])&&prof(a[x.m]).mats.includes(x.m)) load[a[x.m]]+=x.h; else delete a[x.m]}}
  const order=[...S.classes].sort((a,b)=>NIV.findIndex(n=>n.id===a.niveau)-NIV.findIndex(n=>n.id===b.niveau));
  const byNivMat={};
  for(const c of order){const a=S.aff[c.id];for(const x of needOf(c)) if(a[x.m]) byNivMat[c.niveau+"|"+x.m]=a[x.m]}
  let warn=0;
  for(const c of order){const a=S.aff[c.id];
    for(const x of needOf(c)){ if(a[x.m]) continue;
      const cands=S.profs.filter(p=>p.mats.includes(x.m));
      if(!cands.length){warn++;continue}
      const same=byNivMat[c.niveau+"|"+x.m]; let pick=null;
      if(same){const p=prof(same);if(p&&load[p.id]+x.h<=p.max) pick=p}
      if(!pick){const ok=cands.filter(p=>load[p.id]+x.h<=p.max).sort((p,q)=>load[p.id]/p.max-load[q.id]/q.max);pick=ok[0]}
      if(!pick){pick=cands.sort((p,q)=>load[p.id]-load[q.id])[0];warn++}
      a[x.m]=pick.id;load[pick.id]+=x.h;byNivMat[c.niveau+"|"+x.m]=pick.id;
    }}
  return warn;
}

/* ===================== Générateur ===================== */
function buildLessons(){
  const L=[];
  for(const c of S.classes){const a=S.aff[c.id]||{};
    for(const x of needOf(c)){const m=mat(x.m);const p=a[x.m]&&prof(a[x.m])?a[x.m]:null;const ch=[];
      const whole=Math.floor(x.h+1e-9),half=x.h-whole>=0.25;
      if(S.gen.bloc2&&m.bloc&&whole>=2){let r=whole;while(r>=2){ch.push(2);r-=2}if(r)ch.push(1)}else for(let i=0;i<whole;i++)ch.push(1);
      const r=roomFor(c.id,x.m);const n=ch.length+(half?1:0);ch.forEach(d=>L.push({c:c.id,m:x.m,p,d,n,r}));
      if(half) L.push({c:c.id,m:x.m,p,d:1,n,r,half:true});}}
  return L;
}
function generate(){
  const t0=performance.now();const L=buildLessons();const N=nS();const last=N-1;
  const daysAvail=[0,1,2,3,4].filter(d=>[...Array(N).keys()].some(s=>!isOff(d,s))).length;
  const pAvail={},pHours={};
  for(const p of S.profs){let a=0;for(let d=0;d<5;d++)for(let s=0;s<N;s++) if(!isOff(d,s)&&!p.indispo[d+"-"+s]) a++;pAvail[p.id]=a||1;pHours[p.id]=0}
  L.forEach(l=>{if(l.p)pHours[l.p]+=l.d});
  let best=null,att=0;
  while(att<400){att++;
    const C={},P={},RM={},CD={},MD={},PD={};const res={};const un=[];let score=0;
    const tight=l=>l.p?pHours[l.p]/pAvail[l.p]:0;
    const ord=L.map(l=>({l,k:(l.half?40:0)+(l.d===2?-50:0)-tight(l)*20-(l.n>=4?5:0)+Math.random()*6})).sort((a,b)=>a.k-b.k).map(o=>o.l);
    const tryPlace=(l,dur,forbidDay)=>{
      let bestPos=null,bs=1e9;const m=mat(l.m);
      for(let d=0;d<5;d++){ if(d===forbidDay) continue;
        const md=MD[l.c+"|"+l.m+"|"+d]||0;const hard=l.n<=daysAvail;
        if(md&&hard) continue;
        for(let s=0;s+dur<=N;s++){let ok=true,wk=0,pair=false;
          for(let k=0;k<dur;k++){const ss=s+k;const key=d+"-"+ss;
            if(isOff(d,ss)||grp(ss)!==grp(s)){ok=false;break}
            if(l.p&&prof(l.p).indispo[key]){ok=false;break}
            const cu=C[l.c+"@"+key]||0;const used=cu|(l.p?P[l.p+"@"+key]||0:0)|(l.r&&!salle(l.r)?.multi?RM[l.r+"@"+key]||0:0);
            if(l.half){const free=3&~used;if(!free){ok=false;break}wk=(free&1)?1:2;pair=cu?2:used?1:0}
            else if(used){ok=false;break}}
          if(!ok) continue;
          let sc=Math.random()*2;if(pair===2) sc-=9;else if(pair===1) sc-=2;
          sc+=(CD[l.c+"|"+d]||0)*1.4;
          if(l.p) sc+=(PD[l.p+"|"+d]||0)*0.5;
          if(md) sc+=8;
          if(m.matin&&grp(s)===3) sc+=3;
          if(l.m==="EPS"&&grp(s)!==3&&s!==0) sc+=1.5;
          if(s+dur-1===last) sc+=1.8;
          if(C[l.c+"@"+d+"-"+(s-1)]||C[l.c+"@"+d+"-"+(s+dur)]) sc-=1.2;
          if(sc<bs){bs=sc;bestPos={d,s,wk}}
        }}
      if(!bestPos) return null;
      const {d,s,wk}=bestPos;const bit=l.half?wk:3;
      for(let k=0;k<dur;k++){const key=d+"-"+(s+k);C[l.c+"@"+key]=(C[l.c+"@"+key]||0)|bit;if(l.p)P[l.p+"@"+key]=(P[l.p+"@"+key]||0)|bit;if(l.r)RM[l.r+"@"+key]=(RM[l.r+"@"+key]||0)|bit;
        const cell={m:l.m,p:l.p,r:l.r||""};if(l.half)cell.w=bit===1?"A":"B";(res[l.c]=res[l.c]||{})[l.half&&bit===2?key+"/B":key]=cell}
      const wt=l.half?0.5:dur;CD[l.c+"|"+d]=(CD[l.c+"|"+d]||0)+wt;if(l.p)PD[l.p+"|"+d]=(PD[l.p+"|"+d]||0)+wt;
      MD[l.c+"|"+l.m+"|"+d]=(MD[l.c+"|"+l.m+"|"+d]||0)+1;score+=bs;return d;
    };
    for(const l of ord){
      const d=tryPlace(l,l.d);
      if(d===null){
        if(l.d===2){const l1={...l,n:l.n+1};const d1=tryPlace(l1,1);
          if(d1===null) un.push(l); else if(tryPlace(l1,1,d1)===null) un.push({...l,d:1});}
        else un.push(l);
      }}
    const miss=un.reduce((a,l)=>a+(l.half?0.5:l.d),0);
    if(!best||miss<best.miss||(miss===best.miss&&score<best.score)) best={res,un,miss,score};
    const el=performance.now()-t0;
    if((best.miss===0&&att>=6)||el>2600) break;
  }
  snapshot("Nouvelle génération complète");
  S.sched=best.res;
  pairHalves();
  S.gen.report={at:Date.now(),miss:best.miss,un:best.un.map(l=>({c:l.c,m:l.m,p:l.p,d:l.half?0.5:l.d})),att,total:L.reduce((a,l)=>a+(l.half?0.5:l.d),0)};
  save();return S.gen.report;
}

// Regroupe dans une même heure deux demi-cours seuls d'une classe (ex : PC semaine A + SVT semaine B)
function pairHalves(){
  for(const c of S.classes){const sc=S.sched[c.id]||{};
    const lone=()=>Object.keys(sc).filter(k=>sc[k].w&&!sc[k.endsWith("/B")?BKEY(k):k+"/B"]);
    let guard=0,again=true;
    while(again&&guard++<20){again=false;const L=lone();
      outer: for(const k1 of L)for(const k2 of L){if(BKEY(k1)===BKEY(k2))continue;const x=sc[k1],y=sc[k2];if(!x||!y||x.m===y.m)continue;
        const base=BKEY(k1),wk=x.w==="A"?"B":"A";const p=prof(y.p);if(p&&p.indispo[base])continue;
        const mk=wk==="A"?1:2;if(y.p&&(profMask(y.p,base,c.id)&mk))continue;if(y.r&&(roomMask(y.r,base,c.id)&mk))continue;
        delete sc[k2];const cell={...y,w:wk};if(wk==="A"){sc[base+"/B"]=x;x.w="B";sc[base]={...y,w:"A"}}else sc[base+"/B"]=cell;
        if(wk==="A"){/* x moved to B position */}
        again=true;break outer}}}
}

/* ---------- Saisie ---------- */
function vData(){
  const subs=[["classes","Classes"],["profs","Professeurs"],["mats","Matières"],["salles","Salles"],["aff","Affectations"]];
  return `<div class="seg" role="group">${subs.map(([k,l])=>`<button data-act="sub" data-v="${k}" aria-pressed="${UI.sub===k}">${l}</button>`).join("")}</div>
  ${({classes:vClasses,profs:vProfs,mats:vMats,salles:vSalles,aff:vAff})[UI.sub]()}`;
}
function vClasses(){
  const sorted=[...S.classes].sort((a,b)=>NIV.findIndex(n=>n.id===a.niveau)-NIV.findIndex(n=>n.id===b.niveau)||a.nom.localeCompare(b.nom,"fr",{numeric:true}));
  return `<section class="card"><div class="sec-title"><h3>${S.classes.length} classes</h3><div class="row"><button class="btn" data-act="addMany">+ Plusieurs</button><button class="btn primary" data-act="editClass">+ Classe</button></div></div>
  ${sorted.length?`<div class="list">${sorted.map(c=>{const p=prof(c.pp);const h=classHours(c);
    return `<button class="item" data-act="editClass" data-v="${c.id}"><span class="tile ${tone(c.niveau)}" style="width:auto;min-width:42px;padding:0 8px">${esc(c.nom)}</span><span class="grow"><b>${esc(nivL(c.niveau))} · ${c.effectif||0} élèves</b><span>${fmtH(h)}/semaine${p?" · PP : "+esc(p.nom):""}</span></span><span class="chev">›</span></button>`}).join("")}</div>`
  :`<div class="empty">Aucune classe. Ajoutez-en une, ou plusieurs d'un coup (ex : 6è1 à 6è4).<button class="btn primary" data-act="addMany">Ajouter des classes</button></div>`}</section>`;
}
function vProfs(){
  const sorted=[...S.profs].sort((a,b)=>(a.mats[0]||"").localeCompare(b.mats[0]||"")||a.nom.localeCompare(b.nom));

  ${sorted.length?`<div class="list">${sorted.map(p=>{const l=profLoadAff(p.id);const pct=Math.min(100,l/(p.max||1)*100);
    return `<button class="item" data-act="editProf" data-v="${p.id}"><span class="avatar tile ${tone(p.nom)}" style="border-radius:50%">${esc(initialsOf(p.nom))}</span><span class="grow"><b>${esc(p.nom)}</b><span>${p.mats.map(m=>mat(m)?.code||m).join(", ")} · ${p.statut==="VACATAIRE"?"Vacataire":"Permanent"}</span></span>
      <span style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="small" style="font-variant-numeric:tabular-nums">${l} / ${p.max} h</span><span class="bar"><i class="${l>p.max?"over":""}" style="width:${pct}%"></i></span></span></button>`}).join("")}</div>`
  :`<div class="empty">Aucun professeur pour l'instant.<button class="btn primary" data-act="editProf">Ajouter un professeur</button></div>`}</section>`;
}
const STYPES=["Classe","Laboratoire","Salle informatique","Terrain / Plateau EPS","Salle polyvalente","Autre"];

  return `<section class="card"><div class="sec-title"><h3>${S.salles.length} salles</h3><div class="row"><button class="btn" data-act="autoSalles">+ Une par classe</button><button class="btn primary" data-act="editSalle">+ Salle</button></div></div>
  ${S.salles.length?`<div class="list">${S.salles.map(r=>{const who=[...S.classes.filter(c=>c.salle===r.id).map(c=>c.nom),...S.matieres.filter(m=>m.salle===r.id).map(m=>m.code)];

    </select></div>`}).join("")||`<div class="muted small">Aucun volume horaire défini pour ce niveau.</div>`}</div></section>`).join("")}</div>`;

/* ---------- Générer ---------- */

  ${r?`<section class="card"><div class="sec-title"><h3>Dernier résultat</h3><span class="chip ${r.miss?"warn":"ok"}">${r.miss?r.miss+" h à placer à la main":"100 % placé"}</span></div>

/* ---------- Emplois ---------- */
function vEdt(){
  const mode=UI.edtMode;const arr=mode==="classe"?S.classes:mode==="prof"?S.profs:S.salles;
  const segs=`<div class="seg"><button data-act="edtMode" data-v="classe" aria-pressed="${mode==="classe"}">Par classe</button><button data-act="edtMode" data-v="prof" aria-pressed="${mode==="prof"}">Par professeur</button><button data-act="edtMode" data-v="salle" aria-pressed="${mode==="salle"}">Par salle</button></div>`;
  if(!arr.length) return `${segs}<section class="card"><div class="empty">Rien à afficher. Ajoutez des ${mode==="classe"?"classes":mode==="prof"?"professeurs":"salles (Saisie → Salles)"} puis lancez la génération.</div></section>`;
  if(!arr.find(x=>x.id===UI.edtId)) UI.edtId=arr[0].id;
  const id=UI.edtId;
  return `${segs}
  <div class="pick-chips">${arr.map(x=>`<button data-act="goPick" data-v="${x.id}" aria-pressed="${x.id===id}">${esc(x.nom)}</button>`).join("")}</div>
  <div class="row"><select class="in grow edt-pick" style="flex:1" id="edt-pick" data-act="edtPick">${arr.map(x=>`<option value="${x.id}" ${x.id===id?"selected":""}>${esc(x.nom)}</option>`).join("")}</select>
  <button class="btn" data-act="pdfOne">PDF</button><button class="btn primary" data-act="pdfAll">Tout en PDF</button></div>
  ${mode==="classe"?ficheClasse(cls(id)):mode==="prof"?ficheProf(prof(id)):ficheSalle(salle(id))}`;
}

function addrLine(e){return [e.adresse,e.bp,e.ville].filter(Boolean).join(" · ")}

  if(UI.lay!=="desk") return `<div class="fiche-mob">${e.logo?`<img src="${e.logo}" alt="Logo">`:""}
  <div class="fm-rep">RÉPUBLIQUE DE CÔTE D'IVOIRE · <i>Union – Discipline – Travail</i></div>

function cellBody(items,kind,home){ // contenu d'une case : un cours, ou deux cours qui alternent (semaine A / B)

    if(kind==="salle") return small?`<span class="hl"><b>${esc(c?.nom)}</b>${wk} ${esc(m?.code)}</span>`:`<b>${esc(c?.nom)}</b><span>${esc(m?.code)} · ${esc(shortName(p?.nom))}</span>`;

/* ===================== Édition manuelle ===================== */
function canPut(cid,k,pid,rid,w){const [d,sl]=BKEY(k).split("-").map(Number);if(isOff(d,sl))return "créneau fermé";const mk=w==="A"?1:w==="B"?2:3;
  if(pid){const p=prof(pid);if(p?.indispo[BKEY(k)])return shortName(p.nom)+" indisponible";
    if(profMask(pid,BKEY(k),cid)&mk){const c=S.classes.find(c=>c.id!==cid&&itemsAt(c.id,BKEY(k)).some(v=>v.p===pid&&(MASK(v)&mk)));return shortName(p?.nom)+" déjà en "+(c?.nom||"cours")}}
  if(rid&&(roomMask(rid,BKEY(k),cid)&mk)){const c=S.classes.find(c=>c.id!==cid&&itemsAt(c.id,BKEY(k)).some(v=>v.r===rid&&(MASK(v)&mk)));return salleNom(rid)+" occupée par "+(c?.nom||"une autre classe")}
  return true}
// Peut-on déplacer le contenu de la case a vers k (échange si k est occupée) ?
function moveCheck(cid,a,k){const A=itemsAt(cid,a),B=itemsAt(cid,k);if(!A.length||a===k)return "same";
  for(const v of A){const r=canPut(cid,k,v.p,v.r,v.w);if(r!==true)return mat(v.m)?.code+" : "+r}
  for(const v of B){const r=canPut(cid,a,v.p,v.r,v.w);if(r!==true)return mat(v.m)?.code+" : "+r}
  return true}
function swapBundles(sc,a,k){const A=[sc[a],sc[a+"/B"]],B=[sc[k],sc[k+"/B"]];
  [[a,B],[k,A]].forEach(([key,vals])=>{if(vals[0])sc[key]=vals[0];else delete sc[key];if(vals[1])sc[key+"/B"]=vals[1];else delete sc[key+"/B"]})}
function cellTap(k){const cid=UI.edtId;const sc=S.sched[cid]=S.sched[cid]||{};
  if(!UI.sel){if(itemsAt(cid,k).length){UI.sel={k};render()}else sheetAddLesson(k);return}
  const a=UI.sel.k;if(a===k){UI.sel=null;render();return}
  const r=moveCheck(cid,a,k);if(r!==true){toast("Impossible : "+r);return}
  const hadB=itemsAt(cid,k).length;swapBundles(sc,a,k);UI.sel=null;save();render();toast(hadB?"Cours échangés":"Cours déplacé")}

/* ===================== Changement d'horaire en cours d'année ===================== */
function snapshot(label){if(!Object.keys(S.sched||{}).length)return;
  S.history=S.history||[];const ind={};S.profs.forEach(p=>ind[p.id]=p.indispo);
  S.history.unshift({id:uid(),at:Date.now(),label,sched:JSON.stringify(S.sched),ind:JSON.stringify(ind)});S.history=S.history.slice(0,5)}
const keyLbl=k=>{const [d,s]=k.split("-").map(Number);return JOURS[d].charAt(0)+JOURS[d].slice(1).toLowerCase()+" "+S.creneaux[s]?.debut};
// Cherche une nouvelle place pour chaque cours touché par les nouvelles indisponibilités
function planChange(pid,newInd){
  const work=JSON.parse(JSON.stringify(S.sched));const N=nS();
  const its=(cid,k)=>{const sc=work[cid]||{};return [sc[k],sc[k+"/B"]].filter(Boolean)};
  const pm=(q,k,ex)=>{let m=0;for(const c of S.classes){if(c.id===ex)continue;for(const v of its(c.id,k)) if(v.p===q) m|=MASK(v)}return m};
  const rm=(rid,k,ex)=>{const r=salle(rid);if(!r||r.multi)return 0;let m=0;for(const c of S.classes){if(c.id===ex)continue;for(const v of its(c.id,k)) if(v.r===rid) m|=MASK(v)}return m};
  const indOf=q=>q===pid?newInd:(prof(q)?.indispo||{});
  const okAt=(cid,v,k)=>{const [d,s]=k.split("-").map(Number);if(isOff(d,s))return false;if(v.p&&(indOf(v.p)[k]||(pm(v.p,k,cid)&MASK(v))))return false;if(v.r&&(rm(v.r,k,cid)&MASK(v)))return false;return true};
  const sameDay=(cid,m,d,ex)=>Object.entries(work[cid]||{}).some(([k,v])=>v.m===m&&BKEY(k).split("-")[0]==d&&!ex.includes(BKEY(k)));
  const conflicts=[];for(const c of S.classes){const seen=new Set();for(const [k,v] of Object.entries(work[c.id]||{})){const bk=BKEY(k);if(v.p===pid&&newInd[bk]&&!seen.has(bk)){seen.add(bk);conflicts.push({c:c.id,k:bk})}}}
  const moves=[],fails=[];
  for(const cf of conflicts){const sc=work[cf.c];const A=its(cf.c,cf.k);if(!A.length)continue;let best=null;
    for(let d=0;d<5;d++)for(let s=0;s<N;s++){const k=d+"-"+s;if(k===cf.k)continue;const B=its(cf.c,k);
      if(!A.every(v=>okAt(cf.c,v,k)))continue;
      if(!B.every(v=>okAt(cf.c,v,cf.k)))continue;
      let score=B.length?4:0;if(sameDay(cf.c,A[0].m,d,[cf.k,k]))score+=6;if(B.length&&sameDay(cf.c,B[0].m,+cf.k.split("-")[0],[cf.k,k]))score+=6;
      if(s===N-1)score+=1.5;if(mat(A[0].m)?.matin&&grp(s)===3)score+=2;
      if(!B.length&&!its(cf.c,d+"-"+(s-1)).length&&!its(cf.c,d+"-"+(s+1)).length)score+=1;
      if(!best||score<best.score)best={k,score,B}}
    if(!best){fails.push({c:cf.c,k:cf.k,m:A[0].m});continue}
    swapBundles(sc,cf.k,best.k);
    moves.push({c:cf.c,from:cf.k,to:best.k,m:A.map(v=>v.m).join("/"),p:A[0].p,swap:best.B.length?{m:best.B[0].m,p:best.B[0].p}:null})}
  return {work,moves,fails,conflicts:conflicts.length};
}

  if(e.etudesNom){doc.setFont("helvetica","normal");doc.text(pdfTxt(e.etudesNom),W-M,fy+0.5,{align:"right"})}
  if(e.applic){doc.setFont("helvetica","normal");doc.setFontSize(5.8);doc.text(pdfTxt("Applicable à partir du "+e.applic),M,fy-3.2)}
  doc.setFontSize(5);doc.setTextColor(160);doc.text("Généré avec "+APP,W/2,H-3.5,{align:"center"});doc.setTextColor(20);
}
function pdfTxt(s){return String(s??"").replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/[“”«»]/g,'"').replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[^\x20-\xFF\n]/g,"")}
function strip(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")}
const STANDALONE=!!window.HORAIREPRO_STANDALONE;let installEvt=null;
async function saveFile(filename,data,mime){
  filename=strip(filename).replace(/[^\w.-]+/g,"_");
  if(downloads){try{await downloads.save({filename,data});toast("Fichier enregistré")}catch(e){if(e?.code!=="declined")toast("Le fichier n'a pas pu être enregistré.")}return}
  if(STANDALONE){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Fichier enregistré dans vos téléchargements");return}
  toast("Le téléchargement n'est pas disponible dans cet affichage.");
}
async function makePDF(kind,ids,filename){
  if(!window.jspdf){toast("Le module PDF n'a pas pu se charger. Vérifiez votre connexion.");return}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a5",orientation:"landscape"});
  ids.forEach((id,i)=>pdfPage(doc,kind,id,i===0));
  await saveFile(filename,doc.output("arraybuffer"),"application/pdf");
}
function pickLogoFile(){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const M=220,k=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);S.etab.logo=cv.toDataURL("image/png");save();render();toast("Logo enregistré")};
    img.onerror=()=>toast("Cette image n'a pas pu être lue.");img.src=r.result};r.readAsDataURL(f)};inp.click()}

/* ===================== Événements ===================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const a=t.dataset.act,v=t.dataset.v;
  if(["etab","slot","vol","setAff","edtPick","optBloc"].includes(a)) return;
  switch(a){
    case "tab": UI.tab=v;UI.sel=null;render();scrollTo(0,0);break;
    case "sub": UI.sub=v;render();break;
    case "goStep": if(v==="set"){UI.tab="set"} else if(v==="gen"){UI.tab="gen"} else {UI.tab="data";UI.sub=v} render();scrollTo(0,0);break;
    case "close": closeSheet();break;
    case "clearSample": confirmBox("Effacer les données d'exemple et partir d'un établissement vide ?","Effacer",()=>{const keep=S.etab;S=keepLic(defaultState());S.etab={...S.etab,annee:keep.annee};save();loadLicence();render();toast("Prêt. Commencez par les réglages de l'établissement.")});break;
    case "loadSample": confirmBox("Remplacer toutes vos données par l'exemple ?","Remplacer",()=>{S=keepLic(sampleState());autoAssign();generate();render();toast("Exemple rechargé")});break;
    case "resetAll": confirmBox("Tout effacer ? Classes, professeurs et emplois du temps seront supprimés.","Tout effacer",()=>{S=keepLic(defaultState());save();render();loadLicence();toast("Données effacées")});break;
    case "runGen": runGen();break;
    case "autoAff":{const w=autoAssign(true);save();render();toast(w?w+" cours restent sans professeur adapté":"Affectations terminées");break}
    case "editClass": sheetClass(v);break;
    case "addMany": sheetMany();break;
    case "saveClass":{const nom=document.getElementById("fc-nom").value.trim();if(!nom){toast("Donnez un nom à la classe");return}
      const o={nom,niveau:document.getElementById("fc-niv").value,effectif:+document.getElementById("fc-eff").value||0,salle:document.getElementById("fc-salle").value,pp:document.getElementById("fc-pp").value||null};
      if(v){Object.assign(cls(v),o)}else S.classes.push({id:uid(),...o});S.exemple=false;save();closeSheet();render();break}
    case "saveMany":{const niv=document.getElementById("fm-niv").value,n=Math.min(20,+document.getElementById("fm-n").value||1),eff=+document.getElementById("fm-eff").value||0;
      const p=classPrefix(niv);const ex=S.classes.filter(c=>c.niveau===niv).length;
      for(let i=0;i<n;i++) S.classes.push({id:uid(),nom:p+(n>1||ex?(p.includes(" ")?" ":"")+(ex+i+1):""),niveau:niv,effectif:eff,pp:null});
      save();closeSheet();render();toast(n+" classe(s) ajoutée(s)");break}
    case "delClass": confirmBox("Supprimer cette classe et son emploi du temps ?","Supprimer",()=>{S.classes=S.classes.filter(c=>c.id!==v);delete S.aff[v];delete S.sched[v];save();render()});break;
    case "editProf": sheetProf(v);break;
    case "mini":{const kind=t.dataset.kind,k=t.dataset.k;const map=kind==="off"?S.off:sheetCtx.indispo;
      if(map[k])delete map[k];else map[k]=true;
      if(kind==="off"){save();render()}else document.getElementById("fp-ind").innerHTML=miniGrid("indispo",sheetCtx.indispo);break}
    case "saveProf":{const nom=document.getElementById("fp-nom").value.trim();if(!nom){toast("Saisissez le nom du professeur");return}
      const mats=[...document.querySelectorAll(".fp-mat:checked")].map(x=>x.value);if(!mats.length){toast("Cochez au moins une matière");return}
      const o={nom,sexe:document.getElementById("fp-sexe").value,statut:document.getElementById("fp-statut").value,diplome:document.getElementById("fp-dip").value,
        tel:document.getElementById("fp-tel").value,matricule:document.getElementById("fp-mle").value.trim(),origine:document.getElementById("fp-ori").value.trim(),max:+document.getElementById("fp-max").value||0,du:+document.getElementById("fp-du").value||0,mats,indispo:sheetCtx.indispo};
      if(v)Object.assign(prof(v),o);else S.profs.push({id:uid(),...o});S.exemple=false;save();closeSheet();render();break}
    case "delProf": confirmBox("Supprimer ce professeur ? Ses cours resteront placés sans professeur.","Supprimer",()=>{S.profs=S.profs.filter(p=>p.id!==v);
      for(const c in S.aff)for(const m in S.aff[c]) if(S.aff[c][m]===v) delete S.aff[c][m];
      for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].p===v) S.sched[c][k].p=null;
      S.classes.forEach(c=>{if(c.pp===v)c.pp=null});save();render()});break;
    case "editMat": sheetMat(v);break;
    case "editSalle": sheetSalle(v);break;
    case "saveSalle":{const nom=document.getElementById("fs-nom").value.trim();if(!nom){toast("Donnez un nom à la salle");return}
      const o={nom,type:document.getElementById("fs-type").value,multi:document.getElementById("fs-multi").checked};
      if(v)Object.assign(salle(v),o);else S.salles.push({id:uid(),...o});save();closeSheet();render();break}
    case "delSalle": confirmBox("Supprimer cette salle ? Les cours concernés n'auront plus de salle.","Supprimer",()=>{S.salles=S.salles.filter(r=>r.id!==v);
      S.classes.forEach(c=>{if(c.salle===v)c.salle=""});S.matieres.forEach(m=>{if(m.salle===v)m.salle=""});
      for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].r===v) S.sched[c][k].r="";save();render()});break;
    case "autoSalles":{let n=0;const used=new Set(S.classes.map(c=>c.salle).filter(Boolean));let i=S.salles.filter(r=>r.type==="Classe").length;
      S.classes.forEach(c=>{if(!c.salle||!salle(c.salle)){const r={id:uid(),nom:"Salle "+(++i),type:"Classe",multi:false};S.salles.push(r);c.salle=r.id;n++}});
      for(const cid in S.sched)for(const k in S.sched[cid]){const v2=S.sched[cid][k];if(!v2.r)v2.r=roomFor(cid,v2.m)}
      save();render();toast(n?n+" salle(s) créée(s) et attribuée(s)":"Chaque classe a déjà sa salle");break}
    case "openChange": sheetCtx=null;sheetChange();break;
    case "chCell":{const k=t.dataset.k;if(sheetCtx.ind[k])delete sheetCtx.ind[k];else sheetCtx.ind[k]=true;document.getElementById("ch-grid").innerHTML=changeGrid(sheetCtx.cp);break}
    case "chPlan": sheetPlan();break;
    case "chBack": sheetChange();break;
    case "chApply": applyChange();break;
    case "restore": confirmBox("Revenir à cette version des emplois du temps ? Les changements faits depuis seront annulés.","Restaurer",()=>restoreSnap(v));break;
    case "hue": sheetCtx.h=+v;document.querySelectorAll("#fx-sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));break;
    case "saveMat":{const code=document.getElementById("fx-code").value.trim().toUpperCase();if(!code){toast("Saisissez un code court");return}
      const o={code,nom:document.getElementById("fx-nom").value.trim()||code,h:sheetCtx.h,bloc:document.getElementById("fx-bloc").checked,matin:document.getElementById("fx-matin").checked,salle:document.getElementById("fx-salle").value};
      if(v)Object.assign(mat(v),o);else{if(S.matieres.some(m=>m.id===code)){toast("Ce code existe déjà");return}S.matieres.push({id:code,...o})}save();closeSheet();render();break}
    case "delMat": confirmBox("Supprimer cette matière de toutes les classes ?","Supprimer",()=>{S.matieres=S.matieres.filter(m=>m.id!==v);
      for(const n in S.grille) delete S.grille[n][v];for(const c in S.sched)for(const k in S.sched[c]) if(S.sched[c][k].m===v) delete S.sched[c][k];
      S.profs.forEach(p=>p.mats=p.mats.filter(m=>m!==v));save();render()});break;
    case "edtMode": UI.edtMode=v;UI.edtId=null;UI.sel=null;render();break;
    case "openEdt": UI.tab="edt";UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();scrollTo(0,0);break;
    case "layPref": UI.layPref=v;try{localStorage.setItem(LAYKEY,v)}catch(e){}applyLayout();render();toast(v==="desk"?"Version ordinateur":v==="mobile"?"Version mobile":"Affichage automatique");break;
    case "themePref": UI.theme=v;try{localStorage.setItem(THKEY,v)}catch(e){}applyTheme();render();break;
    case "goPick": UI.edtId=v;UI.sel=null;render();break;
    case "goClass": UI.edtMode="classe";UI.edtId=v;UI.sel=null;render();break;
    case "cell": cellTap(t.dataset.k);break;
    case "cancelSel": UI.sel=null;render();break;
    case "clearCell": delete (S.sched[UI.edtId]||{})[UI.sel.k];delete (S.sched[UI.edtId]||{})[UI.sel.k+"/B"];UI.sel=null;save();render();toast("Cours retiré");break;
    case "addLesson":{const k=t.dataset.k,m=t.dataset.m;const pid=(S.aff[UI.edtId]||{})[m]||null;
      {const need=(+((S.grille[cls(UI.edtId).niveau]||{})[m])||0)-placedCount(UI.edtId,m);const cell={m,p:pid&&prof(pid)?pid:null,r:roomFor(UI.edtId,m)};if(need>0&&need<1)cell.w="A";(S.sched[UI.edtId]=S.sched[UI.edtId]||{})[k]=cell}save();closeSheet();render();toast("Cours ajouté");break}
    case "addSlot":{const l=S.creneaux[S.creneaux.length-1];S.creneaux.push({debut:l?l.fin:"07H00",fin:"",g:l?l.g:1});save();render();break}
    case "delSlot":{const i=+t.dataset.i;confirmBox("Supprimer ce créneau ? Les cours placés à cette heure seront retirés.","Supprimer",()=>{
      const shift=o=>{const n={};for(const k in o){const [d,s]=k.split("-").map(Number);if(s===i)continue;n[d+"-"+(s>i?s-1:s)]=o[k]}return n};
      S.creneaux.splice(i,1);S.off=shift(S.off);for(const c in S.sched)S.sched[c]=shift(S.sched[c]);S.profs.forEach(p=>p.indispo=shift(p.indispo));save();render()});break}
    case "pdfOne":{if(!guard())return;if(UI.edtMode==="salle"){toast("Le PDF est disponible par classe et par professeur.");return}const arr=UI.edtMode==="classe"?cls(UI.edtId):prof(UI.edtId);makePDF(UI.edtMode,[UI.edtId],"EDT_"+arr.nom+".pdf");break}
    case "pdfAll":{if(!guard())return;if(UI.edtMode==="salle"){toast("Le PDF est disponible par classe et par professeur.");return}const ids=(UI.edtMode==="classe"?S.classes:S.profs).map(x=>x.id);makePDF(UI.edtMode,ids,"EDT_"+(UI.edtMode==="classe"?"toutes_les_classes":"tous_les_professeurs")+".pdf");break}
    case "exportJson": saveFile("sauvegarde_"+APP+"_"+(S.etab.sigle||S.etab.nom||"etablissement")+".json",JSON.stringify(S),"application/json");break;
    case "goLic": UI.tab="set";render();scrollTo(0,0);break;
    case "activate":{const v2=document.getElementById("lic-code")?.value;if(!v2||!v2.trim()){toast("Collez d'abord le code reçu");return}activate(v2);break}
    case "pickLogo": pickLogoFile();break;
    case "install": if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case "delLogo": S.etab.logo="";save();render();break;
    case "wStart": UI.welcome=false;S=keepLic(defaultState());save();loadLicence();UI.tab="set";render();toast("Renseignez d'abord votre établissement");break;
    case "wSample": UI.welcome=false;S=keepLic(sampleState());autoAssign();generate();render();break;
    case "importJson": document.getElementById("fileIn").click();break;
  }
});
document.addEventListener("change",e=>{const t=e.target;const a=t.dataset?.act;
  if(a==="etab"){S.etab[t.dataset.k]=t.value.trim();save();if(["nom","annee","dren","sigle"].includes(t.dataset.k)){const y=scrollY;render();scrollTo(0,y)}}
  else if(a==="slot"){const c=S.creneaux[+t.dataset.i];c[t.dataset.k]=t.dataset.k==="g"?+t.value:t.value.toUpperCase().replace(":","H");save()}
  else if(a==="vol"){const g=S.grille[t.dataset.n]=S.grille[t.dataset.n]||{};const n=Math.max(0,Math.round((parseFloat(String(t.value).replace(",","."))||0)*2)/2);if(n)g[t.dataset.m]=n;else delete g[t.dataset.m];save();render()}
  else if(a==="setAff"){(S.aff[t.dataset.c]=S.aff[t.dataset.c]||{})[t.dataset.m]=t.value||undefined;if(!t.value)delete S.aff[t.dataset.c][t.dataset.m];save();render()}
  else if(a==="edtPick"){UI.edtId=t.value;UI.sel=null;render()}
  else if(a==="chProf"){sheetCtx={cp:t.value};sheetChange()}
  else if(a==="optBloc"){S.gen.bloc2=t.checked;save()}
});
document.getElementById("fileIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.classes||!x.creneaux)throw 0;x.licence=S.licence;x.install=S.install;S=migrate(x);save();render();loadLicence();toast("Sauvegarde restaurée")}catch(err){toast("Ce fichier n'est pas une sauvegarde valide.")}};
  r.readAsText(f);e.target.value=""});

function runGen(){
  if(!guard()) return;
  if(!S.classes.length){toast("Ajoutez d'abord des classes");return}
  openSheet(`<div class="spin"></div><h3 style="text-align:center">Génération en cours…</h3><p class="muted small" style="text-align:center;margin:0">L'appli essaie plusieurs combinaisons pour éviter tout conflit.</p>`);
  setTimeout(()=>{if(unassignedCount()) autoAssign(true);const r=generate();closeSheet();UI.tab="gen";render();scrollTo(0,0);
    toast(r.miss?r.miss+" h restent à placer à la main":"Emplois du temps générés, sans conflit")},60);
}

/* ===================== Mise en page mobile / ordinateur ===================== */
const LAYKEY="horairepro-affichage";
try{UI.layPref=localStorage.getItem(LAYKEY)||"auto"}catch(e){UI.layPref="auto"}
const mq=matchMedia("(min-width: 1000px)");
function applyLayout(){const lay=UI.layPref==="auto"?(mq.matches?"desk":"mob"):(UI.layPref==="desk"?"desk":"mob");
  const changed=UI.lay!==lay;UI.lay=lay;document.documentElement.dataset.layout=lay;return changed}
const THKEY="horairepro-theme";
try{UI.theme=localStorage.getItem(THKEY)||"light"}catch(e){UI.theme="light"}
function applyTheme(){if(UI.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=UI.theme}
applyTheme();
applyLayout();
mq.addEventListener?.("change",()=>{if(applyLayout()&&S) render()});

/* ===================== Démarrage ===================== */
(function init(){
  const loc=loadLocal();
  if(loc){S=migrate(loc)}else{S=defaultState();UI.welcome=true}
  render();loadLicence();
  if(STANDALONE&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();installEvt=ev;if(UI.tab==="set")render()});
  (async()=>{
    try{downloads=await window.claude?.use?.("downloads")}catch(e){}
    try{const db=await window.claude?.use?.("db");const user=await window.claude?.use?.("user");
      const id=user?await user.id():null;
      if(db&&id){dbDoc=db.doc("data/users/"+id+"/etab");const snap=await dbDoc.get();
        if(snap.exists){const d=snap.data();if(d&&d.json&&(+d.at||0)>(S.at||0)){S=migrate(JSON.parse(d.json));UI.welcome=false;render();loadLicence()}}
        else if(!UI.welcome) saveNow();}
    }catch(e){}
  })();
})();
