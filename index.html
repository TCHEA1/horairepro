<style>
/* Layout: coque d'application mobile (max 480px, centrée même sur grand écran) — en-tête léger, grande carte émeraude, cartes blanches arrondies, navigation à 5 onglets */
:root{
  --bg:#F3F4F6; --bg2:#ECEEF1; --surface:#FFFFFF; --sunk:#F3F4F6; --ink:#0F1F18; --muted:#7A8981; --line:#E6EDE9;
  --accent:#0F7A4E; --accent-2:#0A5C3A; --accent-ink:#FFFFFF; --accent-soft:#E2F3EA; --warm:#F08C1A; --warm-soft:#FEF0DE;
  --danger:#E5484D; --danger-soft:#FDE7E8; --ok:#16A065;
  --t-orange:#FFEBDD; --t-orange-i:#F2701D; --t-blue:#E3EBFF; --t-blue-i:#3D63E8; --t-violet:#EFE6FF; --t-violet-i:#8A4FE6; --t-pink:#FFE4EC; --t-pink-i:#E5487A; --t-green:#E2F3EA; --t-green-i:#0F7A4E; --t-teal:#DDF4F5; --t-teal-i:#0E9AA7;
  --cs:70%; --cl:91%; --cell-ink:#0F1F18; --off:#E8EAEE;
  --sh:0 6px 20px rgb(17 24 39 / .06); --sh2:0 14px 30px rgb(10 92 58 / .28);
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#18191D; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --bg2:#17181C; --surface:#1E2025; --sunk:#26282E; --ink:#ECEEF1; --muted:#9BA0A8; --line:#2E3138;
  --accent:#2FB87B; --accent-2:#0E6B45; --accent-ink:#FFFFFF; --accent-soft:#163A2A; --warm:#FFAA4D; --warm-soft:#3A2814;
  --danger:#FF7A7F; --danger-soft:#3D1B1D; --ok:#4FD39A;
  --t-orange:#3A2516; --t-orange-i:#FF9B5A; --t-blue:#1C2647; --t-blue-i:#8BA5FF; --t-violet:#2A1F45; --t-violet-i:#BC95FF; --t-pink:#3D1D2A; --t-pink-i:#FF8DB0; --t-green:#163A2A; --t-green-i:#4FD39A; --t-teal:#123236; --t-teal-i:#5ED4DE;
  --cs:34%; --cl:24%; --cell-ink:#F0F5F2; --off:#18191D; --sh:0 8px 24px rgb(0 0 0 / .35); --sh2:0 14px 30px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg2),var(--bg) 340px);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgb(16 64 42 / .10);background:linear-gradient(180deg,var(--bg2),var(--bg) 340px)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding-block:14px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top .grow{min-width:0;flex:1}
.top small{display:block;color:var(--accent);font-size:13px;font-weight:600}
.top h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;box-shadow:var(--sh);overflow:hidden;border:2px solid var(--surface)}
.top .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
main{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:20;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgb(16 64 42 / .08);
  display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs .pill{display:grid;place-items:center;width:44px;height:30px;border-radius:12px}
nav.tabs button[aria-current="true"] .pill{background:var(--accent-soft)}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.btn{border:0;text-decoration:none;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .28)}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:15.5px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 14px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer;color:var(--muted);box-shadow:var(--sh)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(15 122 78 / .25)}
.sec-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
.sec-head h3{font-size:16px}
.sec-head button{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
/* grande carte émeraude */
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:500}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;opacity:.8;font-weight:700}
.hero .sub{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.hero .dot{width:8px;height:8px;border-radius:50%;background:#7CF2B8;flex:none}
.hero .prog{height:7px;border-radius:9px;background:rgb(255 255 255 / .22);overflow:hidden;margin-top:8px}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:9px}
.hero .deco{position:absolute;right:-26px;top:16px;width:150px;height:96px;border-radius:16px;background:linear-gradient(135deg,rgb(255 255 255 / .22),rgb(255 255 255 / .04));transform:rotate(-8deg)}
.hero .deco::after{content:"";position:absolute;inset:14px 18px auto auto;width:44px;height:30px;border-radius:7px;background:rgb(255 255 255 / .22)}
.hero > *:not(.deco){position:relative}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;padding:0}
.quick .qi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh);color:var(--accent)}
.quick .qi svg{width:24px;height:24px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px}
.tile svg{width:21px;height:21px}
.tile.orange{background:var(--t-orange);color:var(--t-orange-i)} .tile.blue{background:var(--t-blue);color:var(--t-blue-i)}
.tile.violet{background:var(--t-violet);color:var(--t-violet-i)} .tile.pink{background:var(--t-pink);color:var(--t-pink-i)}
.tile.green{background:var(--t-green);color:var(--t-green-i)} .tile.teal{background:var(--t-teal);color:var(--t-teal-i)}
.tile.solid{background:var(--accent);color:var(--accent-ink)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.steps,.list{display:flex;flex-direction:column}
.step,.item{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.step + .step,.item + .item{border-top:1px solid var(--line)}
.step .t,.item .grow{flex:1;min-width:0}
.step .t b,.item .grow b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .t span,.item .grow span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .end{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.step .end.ok{color:var(--ok)} .step .end.todo{color:var(--warm)}
.chev{color:var(--muted);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warm-soft);color:var(--warm)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.mat{display:inline-grid;place-items:center;min-width:44px;padding:5px 9px;border-radius:10px;font-weight:700;font-size:12px;background:hsl(var(--h) var(--cs) var(--cl));color:var(--cell-ink)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;width:76px;flex:none}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar i.over{background:var(--danger)}
.banner{background:var(--warm-soft);color:var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner b{color:var(--warm)}
.tip{background:var(--accent-soft);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.tip b{color:var(--accent);display:block;margin-bottom:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.in{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:11px 13px;font-size:15px;color:var(--ink);font-weight:500;min-height:46px;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.edt{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;table-layout:fixed}
table.edt th{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:6px 2px;text-transform:uppercase}
table.edt th.h{width:66px}
table.edt td.h{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;line-height:1.25;padding:2px}
table.edt td.c{height:50px;border-radius:11px;background:var(--sunk);text-align:center;vertical-align:middle;padding:3px 2px;cursor:pointer;position:relative;border:2px solid transparent}
table.edt td.c.f{background:hsl(var(--h) var(--cs) var(--cl));color:var(--cell-ink)}
table.edt td.c.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px);cursor:default}
table.edt td.c.sel{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-soft)}
table.edt td.c.drop{border-style:dashed;border-color:var(--accent);background-color:color-mix(in srgb,var(--accent-soft) 60%,var(--sunk))}
table.edt td.c.f.drop{background:hsl(var(--h) var(--cs) var(--cl))}
table.edt td.c.no{opacity:.32}
table.edt td.c.clash{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger-soft)}
table.edt td.c .rm{display:inline-block;margin-left:2px;vertical-align:1px;white-space:nowrap;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgb(255 255 255 / .55);color:var(--cell-ink);opacity:1;max-width:100%}
table.edt td.c.split{background:linear-gradient(135deg,hsl(var(--h) var(--cs) var(--cl)) 50%,hsl(var(--h2) var(--cs) var(--cl)) 50%);padding:2px 3px}
table.edt td.c .hl{display:block;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1}
table.edt td.c .hl + .hl{margin-top:3px;padding-top:3px;border-top:1px dashed rgb(0 0 0 / .18)}
table.edt td.c .hl b{display:inline;font-size:11px}
table.edt td.c .hl span{display:inline;font-size:9.5px;opacity:.8}
table.edt td.c .wk{font-style:normal;font-size:8.5px;font-weight:800;background:var(--cell-ink);color:var(--surface);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.gauge{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:16px;padding:12px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstats span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.gstats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.gstats small{font-size:11px;color:var(--muted)}
.gstats .is-sup b{color:var(--warm)}
.gbar{position:relative;height:10px;border-radius:9px;background:var(--line);overflow:visible}
.gbar i{position:absolute;top:0;bottom:0;border-radius:9px}
.gbar .gn{left:0;background:var(--accent)}
.gbar .gs{background:var(--warm)}
.gbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.gbar em.mx{background:var(--danger)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gmsg{font-size:12.5px;font-weight:600;color:var(--accent)}
.gmsg.sup,.gmsg.full{color:var(--warm)}
.gmsg.over{color:var(--danger)}
.lvl{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.lvl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-h .lnk{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);min-height:40px}
.cchip svg{width:15px;height:15px}
.cchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cchip.taken{background:var(--sunk);color:var(--muted);border-style:dashed}
.cchip small{font-size:10.5px;font-weight:600;opacity:.85}
table.edt td.c span.b15{display:block;white-space:normal;overflow:visible;line-height:1.15;font-size:9.5px;font-weight:800;color:var(--cell-ink);opacity:.75;margin-top:1px}
table.edt td.c.blk1{border-bottom-left-radius:3px;border-bottom-right-radius:3px}
table.edt td.c.blk2{border-top-left-radius:3px;border-top-right-radius:3px}
.topo{color:var(--danger);font-weight:700;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
[data-layout="desk"] .stats{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.card.tool{border:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;align-items:flex-start;gap:8px}
.card.tool b{font-size:15.5px}
.card.tool:hover{box-shadow:0 10px 28px rgb(17 24 39 / .1)}
nav.tabs button{font-size:10.5px}
.ppband{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:16px;padding:10px 12px}
.ppband .grow span{display:block;font-size:11.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ppband .grow b{display:block;font-size:15px}
.ppband .avatar svg{width:20px;height:20px}
.wkk{font-size:10px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 5px}
table.edt td.c span.mr{opacity:1;font-weight:600}
table.edt td.c b{display:block;font-size:12.5px;font-weight:800;line-height:1.15}
table.edt td.c span{display:block;font-size:10px;opacity:.8;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

      const cands=S.profs.filter(p=>p.mats.includes(x.m));
      if(!cands.length){warn++;continue}
      const same=byNivMat[c.niveau+"|"+x.m]; let pick=null;
      if(same){const p=prof(same);if(p&&load[p.id]+x.h<=profMax(p)) pick=p}
      if(!pick){const ok=cands.filter(p=>load[p.id]+x.h<=profMax(p)).sort((p,q)=>load[p.id]/profMax(p)-load[q.id]/profMax(q));pick=ok[0]}
      if(!pick){warn++;continue}
      a[x.m]=pick.id;load[pick.id]+=x.h;byNivMat[c.niveau+"|"+x.m]=pick.id;
    }}
  return warn;
}

/* ===================== Générateur ===================== */
/* ---- Découpage des heures en séances (heures collées) ---- */
function autoSplit(m,h){const whole=Math.floor(h+1e-9),half=h-whole>=0.25;let ch=[];
  if(S.gen.bloc2&&m&&m.bloc&&whole>=2){let r=whole;while(r>=2){ch.push(2);r-=2}if(r)ch.push(1)}else for(let i=0;i<whole;i++)ch.push(1);
  if(half&&whole>=1){let i=ch.indexOf(1);if(i<0){const j=ch.indexOf(2);ch.splice(j,1,1,1);i=ch.indexOf(1)}ch.splice(i,1);ch.unshift(1.5)}
  else if(half) ch.push(0.5);
  return ch.sort((a,b)=>b-a)}
function splitOptions(h){const out=[];const half=Math.abs(h%1-0.5)<1e-9;
  const rec=(left,max,acc,used15)=>{if(out.length>12)return;if(Math.abs(left)<1e-9){if(!half||used15)out.push(acc.join("+"));return}
    for(const p of [3,2,1.5,1]){if(p>max+1e-9||p>left+1e-9)continue;if(p===1.5&&(used15||!half))continue;rec(left-p,p,[...acc,p],used15||p===1.5)}};
  if(h<1)return [String(h)];rec(h,3,[],false);return out}
const splitLbl=str=>String(str).split("+").map(x=>fmtH(+x)).join(" + ");
function splitFor(c,m,h){const want=(S.decoup||{})[c.niveau]?.[m.id];if(want){const parts=want.split("+").map(Number);if(Math.abs(parts.reduce((a,b)=>a+b,0)-h)<1e-9)return parts}return autoSplit(m,h)}
function buildLessons(){
  const L=[];
  for(const c of S.classes){const a=S.aff[c.id]||{};
    for(const x of needOf(c)){const m=mat(x.m);const p=a[x.m]&&prof(a[x.m])?a[x.m]:null;
      const parts=splitFor(c,m,x.h);const rooms=roomChoices(c.id,x.m);const home=roomChoices(c.id,"__none");const n=parts.length;
      // Salle spéciale (labo…) seulement pour « labH » heures par semaine ; les autres heures dans la salle de la classe
      const special=m.salle&&salle(m.salle);let labLeft=special?(m.labH===""||m.labH==null?Infinity:+m.labH):0;
      const pick=dur=>{if(labLeft>1e-9){labLeft-=dur;return rooms}return home};
      parts.forEach(pt=>{const rs=pick(pt);const base={c:c.id,m:x.m,p,n,r:rs[0]||"",rooms:rs};
        if(Math.abs(pt-1.5)<1e-9)L.push({...base,d:2,q15:true});else if(pt<1)L.push({...base,d:1,q:pt});else L.push({...base,d:pt})})}}
  return L;
}
function generate(){
  const t0=performance.now();const L=buildLessons();const N=nS();const last=N-1;
  const daysAvail=[0,1,2,3,4].filter(d=>[...Array(N).keys()].some(s=>!isOff(d,s))).length;
  const pAvail={},pHours={};
  for(const p of S.profs){let a=0;for(let d=0;d<5;d++)for(let s=0;s<N;s++) if(!isOff(d,s)&&!p.indispo[d+"-"+s]) a++;pAvail[p.id]=a||1;pHours[p.id]=0}
  L.forEach(l=>{if(l.p)pHours[l.p]+=l.d});
  let best=null,att=0;
  while(att<400){att++;
    const C={},P={},RM={},CD={},MD={},PD={};const res={};const un=[];let score=0;
    const tight=l=>l.p?pHours[l.p]/pAvail[l.p]:0;
    const lw=l=>l.q15?1.5:(l.q||l.d);
    const ord=L.map(l=>({l,k:(l.d===2?-50:0)-tight(l)*20-(l.n>=4?5:0)+Math.random()*6})).sort((a,b)=>a.k-b.k).map(o=>o.l);
    const tryPlace=(l,dur,forbidDay)=>{
      let bestPos=null,bs=1e9;const m=mat(l.m);
      for(let d=0;d<5;d++){ if(d===forbidDay) continue;
        const md=MD[l.c+"|"+l.m+"|"+d]||0;const hard=l.n<=daysAvail;
        if(md&&hard) continue;
        for(let s=0;s+dur<=N;s++){let ok=true;
          for(let k=0;k<dur;k++){const ss=s+k;const key=d+"-"+ss;
            if(isOff(d,ss)||grp(ss)!==grp(s)||C[l.c+"@"+key]){ok=false;break}
            if(l.p&&prof(l.p).indispo[key]){ok=false;break}}
          if(!ok) continue;
          // semaine(s) : un cours entier prend les deux semaines ; une demi-heure (1h30) prend la semaine A ou B
          let wk=0,room=null,pair=false;
          for(const bit of [3]){
            let pOK=true;for(let k=0;k<dur;k++){if(l.p&&((P[l.p+"@"+d+"-"+(s+k)]||0)&bit)){pOK=false;break}}
            if(!pOK) continue;
            const rm=l.rooms.find(rid=>{if(!rid||salle(rid)?.multi)return true;for(let k=0;k<dur;k++){if((RM[rid+"@"+d+"-"+(s+k)]||0)&bit)return false}return true});
            if(rm===undefined) continue;
            wk=bit;room=rm;break}
          if(!wk){continue}
          let sc=Math.random()*2;if(pair) sc-=4;if(room!==l.rooms[0]) sc+=1.5;
          sc+=(CD[l.c+"|"+d]||0)*1.4;
          if(l.p) sc+=(PD[l.p+"|"+d]||0)*0.5;
          if(md) sc+=8;
          if(m.matin&&grp(s)===3) sc+=3;
          if(l.m==="EPS"&&grp(s)!==3&&s!==0) sc+=1.5;
          if(s+dur-1===last) sc+=1.8;
          if(C[l.c+"@"+d+"-"+(s-1)]||C[l.c+"@"+d+"-"+(s+dur)]) sc-=1.2;
          if(sc<bs){bs=sc;bestPos={d,s,wk,room}}
        }}
      if(!bestPos) return null;
      const {d,s,wk,room}=bestPos;const bit=wk;const blkId=l.q15?uid():"";
      for(let k=0;k<dur;k++){const key=d+"-"+(s+k);C[l.c+"@"+key]=3;if(l.p)P[l.p+"@"+key]=(P[l.p+"@"+key]||0)|bit;if(room)RM[room+"@"+key]=(RM[room+"@"+key]||0)|bit;
        const cell={m:l.m,p:l.p,r:room||""};if(l.q15){cell.q=0.75;cell.blk=blkId;cell.part=k+1}else if(l.q)cell.q=l.q;(res[l.c]=res[l.c]||{})[key]=cell}
      const wt=l.q15?1.5:(l.q||dur);CD[l.c+"|"+d]=(CD[l.c+"|"+d]||0)+wt;if(l.p)PD[l.p+"|"+d]=(PD[l.p+"|"+d]||0)+wt;
      MD[l.c+"|"+l.m+"|"+d]=(MD[l.c+"|"+l.m+"|"+d]||0)+1;score+=bs;return d;
    };
    for(const l of ord){
      const d=tryPlace(l,l.d);
      if(d===null){
        if(l.d>=2&&!l.q15){const l1={...l,n:l.n+1};const d1=tryPlace(l1,l.d-1);
          if(d1===null) un.push(l); else if(tryPlace(l1,1,d1)===null) un.push({...l,d:1});}
        else un.push(l);
      }}
    const miss=un.reduce((a,l)=>a+lw(l),0);
    if(!best||miss<best.miss||(miss===best.miss&&score<best.score)) best={res,un,miss,score};
    const el=performance.now()-t0;
    if((best.miss===0&&att>=6)||el>2600) break;
  }
  snapshot("Nouvelle génération complète");
  S.sched=best.res;S.gen.needRegen=false;
  S.gen.report={at:Date.now(),miss:best.miss,un:best.un.map(l=>({c:l.c,m:l.m,p:l.p,d:l.q15?1.5:(l.q||l.d)})),att,total:L.reduce((a,l)=>a+(l.q15?1.5:(l.q||l.d)),0)};
  save();return S.gen.report;
}

/* ===================== Cohérence classes ↔ professeurs ===================== */
// Après un changement d'affectation, chaque cours déjà placé prend le nouveau professeur
function syncAff(){let n=0;for(const c of S.classes){const a=S.aff[c.id]||{};const sc=S.sched[c.id]||{};
  for(const v of Object.values(sc)){const want=a[v.m]&&prof(a[v.m])?a[v.m]:null;if((v.p||null)!==want){v.p=want;n++}}}return n}
// Liste des conflits : un professeur ou une salle à deux endroits à la même heure (même semaine)
function findConflicts(){const out=[];const N=nS();
  for(let d=0;d<5;d++)for(let s=0;s<N;s++){const k=d+"-"+s;const P={},R={};
    for(const c of S.classes)for(const v of itemsAt(c.id,k)){const m=MASK(v);
      if(v.p){(P[v.p]=P[v.p]||[]).push({c:c.id,m})}
      if(v.r&&!salle(v.r)?.multi){(R[v.r]=R[v.r]||[]).push({c:c.id,m})}}
    for(const [pid,l] of Object.entries(P)) for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++) if(l[i].m&l[j].m) out.push({k,type:"prof",id:pid,a:l[i].c,b:l[j].c});
    for(const [rid,l] of Object.entries(R)) for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++) if(l[i].m&l[j].m) out.push({k,type:"salle",id:rid,a:l[i].c,b:l[j].c});}
  return out}
// Répare les conflits en déplaçant seulement les cours concernés (le reste ne bouge pas)
function repairConflicts(){let fixed=0,guard=0;
  while(guard++<60){const cf=findConflicts();if(!cf.length)break;let done=false;
    for(const x of cf){for(const cid of [x.b,x.a]){const N=nS();let best=null;
      for(let d=0;d<5&&!best;d++)for(let s=0;s<N;s++){const t=d+"-"+s;if(t===x.k)continue;
        if(moveCheck(cid,x.k,t)!==true)continue;const sc=S.sched[cid];const keep=JSON.stringify(sc);
        const keys=applyMove(cid,x.k,t);for(const key of keys)for(const v of itemsAt(cid,key)){if(v.r&&canPut(cid,key,null,v.r,v.w)!==true){const r2=freeRoom(cid,key,v);if(r2)v.r=r2}}
        if(findConflicts().length<cf.length){best=t;break}S.sched[cid]=JSON.parse(keep)}
      if(best){fixed++;done=true;break}}if(done)break}
    if(!done)break}
  return {fixed,left:findConflicts().length}}
function clashKeys(kind,id){const set=new Set();for(const x of findConflicts()){
  if(kind==="classe"&&(x.a===id||x.b===id))set.add(x.k);if(kind==="prof"&&x.type==="prof"&&x.id===id)set.add(x.k);if(kind==="salle"&&x.type==="salle"&&x.id===id)set.add(x.k)}return set}
function placeBanner(){const need=totalNeeded(),pl=totalPlaced();if(!S.gen.report||need-pl<0.25)return "";
  return `<div class="banner"><span style="flex:1;min-width:200px"><b>${fmtH(need-pl)} de cours ne sont pas placées.</b> ${S.gen.needRegen?"Les séances de 1h30 sont maintenant des séances continues : ":""}Relancez la génération pour tout placer.</span><button class="btn primary" data-act="runGen">Générer</button></div>`}
function conflictBanner(){const cf=findConflicts();if(!cf.length)return "";const x=cf[0];
  const who=x.type==="prof"?shortName(prof(x.id)?.nom):salleNom(x.id);
  return `<div class="banner" style="background:var(--danger-soft)"><span style="flex:1;min-width:200px"><b style="color:var(--danger)">${cf.length} conflit${cf.length>1?"s":""} d'horaire.</b> Exemple : ${esc(who)} est en ${esc(cls(x.a)?.nom)} et en ${esc(cls(x.b)?.nom)} le ${keyLbl(x.k)}. Les cases concernées sont en rouge.</span><div class="row"><button class="btn primary" data-act="repair">Réparer</button><button class="btn danger" data-act="runGen">Tout régénérer</button></div></div>`}

function salleSelect(idName,cur,empty){return `<select id="${idName}"><option value="">${empty}</option>${S.salles.map(r=>`<option value="${r.id}" ${cur===r.id?"selected":""}>${esc(r.nom)}</option>`).join("")}</select>`}
function vDecoup(levels){if(!levels.length)return "";if(!levels.find(n=>n.id===UI.decNiv))UI.decNiv=(levels.find(n=>S.classes.some(c=>c.niveau===n.id))||levels[0]).id;

      <option value="">Auto (${auto.split("+").map(x=>+x===1.5?"1h30":x).join("+")})</option>${opts.map(o=>`<option value="${o}" ${cur===o?"selected":""}>${splitLbl(o)}</option>`).join("")}</select></div>`}).join("")}</div>
  <span class="small muted">Après un changement, relancez la génération.</span></section>`}

function vAff(){

const NIV_ORDER=id=>NIV.findIndex(n=>n.id===id);
// Jauge : heures normales (dues) en vert, heures supplémentaires en orange, maximum en rouge
function hoursGauge(P,load,PM){const du=+P.du||0;const sup=Math.max(0,load-du);const manual=!P.maxAuto;const top=Math.max(manual?PM:0,load,du,1)*(manual?1:1.15);
  const wN=Math.min(load,du)/top*100,wS=sup/top*100,mDu=du/top*100,mMax=PM/top*100;
  const state=manual&&load>PM?"over":sup>0?"sup":load>=du&&du>0?"full":"ok";
  const msg={ok:`Encore ${fmtH(du-load)} avant d'atteindre ses heures normales.`,full:`Heures normales atteintes. Les prochaines classes compteront en heures supplémentaires.`,
    sup:`Heures normales atteintes. ${fmtH(sup)} d'heures supplémentaires.`,over:`Attention : ${fmtH(load)} dépasse son maximum de ${PM} h.`}[state];
  return `<div class="gauge"><div class="gstats">
    <div><span>Heures normales</span><b>${fmtH(Math.min(load,du))} / ${fmtH(du)}</b></div>
    <div class="${sup?"is-sup":""}"><span>Heures sup.</span><b>${fmtH(sup)}</b></div>
    <div><span>Total</span><b>${fmtH(load)}</b>${manual?`<small>max ${PM} h</small>`:""}</div></div>
  <div class="gbar"><i class="gn" style="width:${wN}%"></i><i class="gs" style="left:${wN}%;width:${wS}%"></i><em style="left:${mDu}%" title="Heures dues"></em>${manual?`<em class="mx" style="left:${Math.min(mMax,100)}%" title="Maximum"></em>`:""}</div>
  <div class="small muted" style="display:flex;gap:12px;flex-wrap:wrap"><span><i class="lg" style="background:var(--accent)"></i>Heures normales</span><span><i class="lg" style="background:var(--warm)"></i>Heures supplémentaires</span><span><i class="lg" style="background:var(--ink);width:3px"></i>Limite des heures dues</span></div>
  <div class="gmsg ${state}">${msg}</div></div>`}
function vAffProf(){

        return `<button class="cchip ${mine?"on":""} ${other?"taken":""}" data-act="affToggle" data-c="${c.id}" data-m="${mid}" aria-pressed="${mine}">${mine?svg("check"):""}${esc(c.nom)}${other?`<small>${esc(shortName(other.nom))}</small>`:""}</button>`}).join("")}</div></div>`}).join("");

  ${hoursGauge(P,load,PM)}

function cellBody(items,kind,home){ // contenu d'une case : un cours, ou deux cours qui alternent (semaine A / B)

function gridHTML(kind,id){

    for(let d=0;d<5;d++){const k=d+"-"+s;
      if(isOff(d,s)){h+=`<td class="c off" title="Pas de cours"></td>`;continue}
      let items=[];

      else items=(pc[k]||[]).map(v=>({...v,k}));

      if(kind==="classe"){const sel=UI.sel&&UI.sel.k===k;let st="";if(UI.sel&&!sel){const r=moveCheck(id,UI.sel.k,k);st=r===true?"drop":"no"}

      else h+=`<td class="c" style="cursor:default"></td>`;
    }h+=`</tr>`}
  return h+`</tbody></table></div>`;
}

/* ===================== Édition manuelle ===================== */
function canPut(cid,k,pid,rid,w){const [d,sl]=BKEY(k).split("-").map(Number);if(isOff(d,sl))return "créneau fermé";const mk=w==="A"?1:w==="B"?2:3;
  if(pid){const p=prof(pid);if(p?.indispo[BKEY(k)])return shortName(p.nom)+" indisponible";
    if(profMask(pid,BKEY(k),cid)&mk){const c=S.classes.find(c=>c.id!==cid&&itemsAt(c.id,BKEY(k)).some(v=>v.p===pid&&(MASK(v)&mk)));return shortName(p?.nom)+" déjà en "+(c?.nom||"cours")}}
  if(rid&&(roomMask(rid,BKEY(k),cid)&mk)){const c=S.classes.find(c=>c.id!==cid&&itemsAt(c.id,BKEY(k)).some(v=>v.r===rid&&(MASK(v)&mk)));return salleNom(rid)+" occupée par "+(c?.nom||"une autre classe")}
  return true}
// Peut-on déplacer le contenu de la case a vers k (échange si k est occupée) ?
function freeRoom(cid,k,v){for(const rid of [...new Set([v.r,...roomChoices(cid,v.m)])]){if(canPut(cid,k,null,rid,v.w)===true)return rid}return null}
function blockTarget(cid,a,k){const ba=blockKeys(cid,a);if(!ba)return null;const [d,s]=k.split("-").map(Number);const t=[k,d+"-"+(s+1)];
  if(s+1>=nS()||isOff(d,s+1)||grp(s+1)!==grp(s))return {err:"une séance de 1h30 demande deux heures de suite"};
  for(const x of t) if(!ba.includes(x)&&itemsAt(cid,x).length) return {err:"il faut deux heures libres de suite pour la séance de 1h30"};
  return {ba,t}}
function moveCheck(cid,a,k){const A=itemsAt(cid,a),B=itemsAt(cid,k);if(!A.length||a===k)return "same";
  const bt=blockTarget(cid,a,k);
  if(bt){if(bt.err)return mat(A[0].m)?.code+" : "+bt.err;const v1=(S.sched[cid]||{})[bt.ba[0]];
    for(const x of bt.t){if(bt.ba.includes(x)&&x!==bt.t[0]&&x!==bt.t[1])continue;const r=canPut(cid,x,v1.p,null);if(r!==true)return mat(v1.m)?.code+" : "+r;if(v1.r&&freeRoom(cid,x,v1)===null)return mat(v1.m)?.code+" : aucune salle libre"}
    return true}
  if(blockKeys(cid,k))return "séance de 1h30 : touchez-la pour la déplacer en entier";
  for(const v of A){const r=canPut(cid,k,v.p,null,v.w);if(r!==true)return mat(v.m)?.code+" : "+r;if(v.r&&freeRoom(cid,k,v)===null)return mat(v.m)?.code+" : aucune salle libre"}
  for(const v of B){const r=canPut(cid,a,v.p,null,v.w);if(r!==true)return mat(v.m)?.code+" : "+r;if(v.r&&freeRoom(cid,a,v)===null)return mat(v.m)?.code+" : aucune salle libre"}
  return true}
function swapBundles(sc,a,k){const A=[sc[a],sc[a+"/B"]],B=[sc[k],sc[k+"/B"]];
  [[a,B],[k,A]].forEach(([key,vals])=>{if(vals[0])sc[key]=vals[0];else delete sc[key];if(vals[1])sc[key+"/B"]=vals[1];else delete sc[key+"/B"]})}
function applyMove(cid,a,k){const sc=S.sched[cid]=S.sched[cid]||{};const bt=blockTarget(cid,a,k);
  if(bt&&!bt.err){const v1=sc[bt.ba[0]],v2=sc[bt.ba[1]];delete sc[bt.ba[0]];delete sc[bt.ba[1]];sc[bt.t[0]]=v1;sc[bt.t[1]]=v2;return [...new Set([...bt.ba,...bt.t])]}
  swapBundles(sc,a,k);return [a,k]}
function cellTap(k){const cid=UI.edtId;const sc=S.sched[cid]=S.sched[cid]||{};
  if(!UI.sel){if(itemsAt(cid,k).length){UI.sel={k};render()}else sheetAddLesson(k);return}
  const a=UI.sel.k;if(a===k){UI.sel=null;render();return}
  const r=moveCheck(cid,a,k);if(r!==true){toast("Impossible : "+r);return}
  const hadB=itemsAt(cid,k).length&&!blockKeys(cid,a);const keys=applyMove(cid,a,k);let moved=[];
  for(const key of keys)for(const v of itemsAt(cid,key)){if(v.r&&canPut(cid,key,null,v.r,v.w)!==true){const r2=freeRoom(cid,key,v);if(r2){moved.push(mat(v.m)?.code+" → "+salleNom(r2));v.r=r2}}}
  UI.sel=null;save();render();toast((hadB?"Cours échangés":"Cours déplacé")+(moved.length?" · "+moved.join(", "):""))}

function snapshot(label){if(!Object.keys(S.sched||{}).length)return;
  S.history=S.history||[];const ind={};S.profs.forEach(p=>ind[p.id]=p.indispo);
  S.history.unshift({id:uid(),at:Date.now(),label,sched:JSON.stringify(S.sched),ind:JSON.stringify(ind)});S.history=S.history.slice(0,5)}
const keyLbl=k=>{const [d,s]=k.split("-").map(Number);return JOURS[d].charAt(0)+JOURS[d].slice(1).toLowerCase()+" "+S.creneaux[s]?.debut};
// Cherche une nouvelle place pour chaque cours touché par les nouvelles indisponibilités
function planChange(pid,newInd){
  const work=JSON.parse(JSON.stringify(S.sched));const N=nS();
  const its=(cid,k)=>{const sc=work[cid]||{};return [sc[k],sc[k+"/B"]].filter(Boolean)};
  const pm=(q,k,ex)=>{let m=0;for(const c of S.classes){if(c.id===ex)continue;for(const v of its(c.id,k)) if(v.p===q) m|=MASK(v)}return m};
  const rm=(rid,k,ex)=>{const r=salle(rid);if(!r||r.multi)return 0;let m=0;for(const c of S.classes){if(c.id===ex)continue;for(const v of its(c.id,k)) if(v.r===rid) m|=MASK(v)}return m};
  const indOf=q=>q===pid?newInd:(prof(q)?.indispo||{});
  const okAt=(cid,v,k)=>{const [d,s]=k.split("-").map(Number);if(isOff(d,s))return false;if(v.p&&(indOf(v.p)[k]||(pm(v.p,k,cid)&MASK(v))))return false;if(v.r&&(rm(v.r,k,cid)&MASK(v)))return false;return true};
  const sameDay=(cid,m,d,ex)=>Object.entries(work[cid]||{}).some(([k,v])=>v.m===m&&BKEY(k).split("-")[0]==d&&!ex.includes(BKEY(k)));
  const conflicts=[];for(const c of S.classes){const seen=new Set();for(const [k,v] of Object.entries(work[c.id]||{})){const bk=BKEY(k);if(v.p===pid&&newInd[bk]&&!seen.has(bk)){seen.add(bk);conflicts.push({c:c.id,k:bk})}}}
  const moves=[],fails=[];const doneBlk=new Set();
  for(const cf of conflicts){const sc=work[cf.c];const A=its(cf.c,cf.k);if(!A.length)continue;let best=null;
    if(A[0].blk){if(doneBlk.has(A[0].blk))continue;doneBlk.add(A[0].blk);
      const [d0,s0]=cf.k.split("-").map(Number);const k1=A[0].part===1?cf.k:d0+"-"+(s0-1),k2=d0+"-"+(+k1.split("-")[1]+1);const v1=sc[k1],v2=sc[k2];
      for(let d=0;d<5&&!best;d++)for(let s=0;s+1<N;s++){const t1=d+"-"+s,t2=d+"-"+(s+1);if(grp(s)!==grp(s+1))continue;
        const free=x=>x===k1||x===k2||!its(cf.c,x).length;if(!free(t1)||!free(t2))continue;
        if(!okAt(cf.c,v1,t1)||!okAt(cf.c,v2,t2))continue;best={t1,t2};break}
      if(!best){fails.push({c:cf.c,k:k1,m:v1.m});continue}
      delete sc[k1];delete sc[k2];sc[best.t1]=v1;sc[best.t2]=v2;moves.push({c:cf.c,from:k1,to:best.t1,m:v1.m,p:v1.p,swap:null});continue}
    for(let d=0;d<5;d++)for(let s=0;s<N;s++){const k=d+"-"+s;if(k===cf.k)continue;const B=its(cf.c,k);if(B.some(v=>v.blk))continue;
      if(!A.every(v=>okAt(cf.c,v,k)))continue;
      if(!B.every(v=>okAt(cf.c,v,cf.k)))continue;
      let score=B.length?4:0;if(sameDay(cf.c,A[0].m,d,[cf.k,k]))score+=6;if(B.length&&sameDay(cf.c,B[0].m,+cf.k.split("-")[0],[cf.k,k]))score+=6;
      if(s===N-1)score+=1.5;if(mat(A[0].m)?.matin&&grp(s)===3)score+=2;
      if(!B.length&&!its(cf.c,d+"-"+(s-1)).length&&!its(cf.c,d+"-"+(s+1)).length)score+=1;
      if(!best||score<best.score)best={k,score,B}}
    if(!best){fails.push({c:cf.c,k:cf.k,m:A[0].m});continue}
    swapBundles(sc,cf.k,best.k);
    moves.push({c:cf.c,from:cf.k,to:best.k,m:A.map(v=>v.m).join("/"),p:A[0].p,swap:best.B.length?{m:best.B[0].m,p:best.B[0].p}:null})}
  return {work,moves,fails,conflicts:conflicts.length};
}

  else if(a==="vol"){const g=S.grille[t.dataset.n]=S.grille[t.dataset.n]||{};const n=Math.max(0,Math.round((parseFloat(String(t.value).replace(",","."))||0)*2)/2);if(n)g[t.dataset.m]=n;else delete g[t.dataset.m];save();render()}

  else if(a==="decoup"){const n=t.dataset.n,m=t.dataset.m;S.decoup[n]=S.decoup[n]||{};if(t.value)S.decoup[n][m]=t.value;else delete S.decoup[n][m];save();toast("Découpage enregistré : "+(t.value?splitLbl(t.value):"automatique")+". Relancez la génération.")}
  else if(a==="affProf"){UI.affProf=t.value;render()}

function b64uEnc(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function packData(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return "z"+b64uEnc(buf)}catch(e){}}
  return "j"+b64uEnc(raw)}

  for(const x of list){const m=mat(x.m);const sp=x.blk?blkSpan(x.k,x):null;cells.push([x.k,x.label,m?.code||"",salleNom(x.r)||"",m?.h||0,x.blk?(x.part===1?"1h30 · "+sp.deb+"–"+sp.fin:"suite · fin "+sp.fin):""])}
  const who=kind==="prof"?prof(id):cls(id);
  return {v:1,t:kind,e:{n:e.nom,a:e.annee,d:e.dren,s:e.etudesTitre,sn:e.etudesNom},w:kind==="prof"?civ(who):"Classe de "+who.nom,
    i:kind==="prof"?[who.mats.map(m=>mat(m)?.code).join(", "),who.statut].join(" · "):["PP : "+(civ(prof(who.pp))||"—"),"Salle : "+(salleNom(who.salle)||"—")].join(" · "),
    cr:S.creneaux.map(c=>[c.debut,c.fin,c.g]),off:Object.keys(S.off),c:cells,g:new Date().toISOString().slice(0,10)}}

    <button class="btn" data-act="shOne" data-k="${mode}" data-v="${x.id}">Envoyer</button></div>`).join("")||`<div class="empty">Rien à partager pour l'instant.</div>`}</div></section>`}

/* ---------- 2. Absences et remplacements ---------- */
function freeProfsAt(k,exceptPid,date){const busy=new Set();for(const c of S.classes)for(const v of itemsAt(c.id,k)) if(v.p) busy.add(v.p);
  const absent=new Set((S.absences||[]).filter(a=>a.date===date).map(a=>a.pid));
  for(const a of (S.absences||[]).filter(a=>a.date===date))for(const r of Object.values(a.rempl||{}))if(r.k===k&&r.pid)busy.add(r.pid);
  return S.profs.filter(p=>p.id!==exceptPid&&!busy.has(p.id)&&!absent.has(p.id)&&!p.indispo[k])}
function absLessons(pid,date){const d=isoDay(date);if(d<0)return [];return profCells(pid).filter(x=>+x.k.split("-")[0]===d).sort((a,b)=>+a.k.split("-")[1]-+b.k.split("-")[1])}
function vAbsences(){const A=S.absences||[];const draft=UI.absDraft;
  return `<section class="card"><h2>${OUT_T.absences}</h2><p class="muted small" style="margin:0">Indiquez le professeur absent et la date : HorairePro liste ses cours et propose, pour chaque heure, les professeurs libres (même matière d'abord).</p>
  <div class="grid2"><label class="f">Professeur absent<select id="ab-prof">${S.profs.map(p=>`<option value="${p.id}" ${draft?.pid===p.id?"selected":""}>${esc(p.nom)}</option>`).join("")}</select></label>
  <label class="f">Date<input id="ab-date" type="date" value="${draft?.date||todayIso()}"></label></div>
  <label class="f">Motif (facultatif)<input id="ab-motif" value="${esc(draft?.motif||"")}" placeholder="ex : maladie, formation, convocation"></label>
  <button class="btn primary block" data-act="abFind">Voir ses cours et les remplaçants</button></section>
  ${draft?absDraftCard(draft):""}
  <div class="sec-head"><h3>Journal des absences</h3><span class="small muted">${A.length}</span></div>
  <section class="card" style="padding-block:6px">${A.length?`<div class="list">${[...A].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>{const p=prof(a.pid);const n=Object.keys(a.rempl||{}).length;const ok=Object.values(a.rempl||{}).filter(r=>r.pid).length;
    return `<div class="item" style="cursor:default"><span class="tile orange">${svg("users")}</span><span class="grow"><b>${esc(p?.nom||"?")} · ${esc(frDay(a.date))}</b><span>${n} cours · ${ok} remplacé${ok>1?"s":""}${a.motif?" · "+esc(a.motif):""}</span></span><button class="btn" data-act="abShare" data-v="${a.id}">Partager</button><button class="btn ghost" data-act="abDel" data-v="${a.id}" aria-label="Supprimer">✕</button></div>`}).join("")}</div>`:`<div class="empty">Aucune absence enregistrée.</div>`}</section>`}
function absDraftCard(dr){const p=prof(dr.pid);const L=absLessons(dr.pid,dr.date);
  if(isoDay(dr.date)<0) return `<section class="card"><div class="empty">Le ${esc(frDay(dr.date))} n'est pas un jour de cours.</div></section>`;
  if(!L.length) return `<section class="card"><div class="empty">${esc(p.nom)} n'a pas cours le ${esc(frDay(dr.date))}.</div></section>`;
  return `<section class="card"><h3>${esc(civ(p))} · ${esc(frDay(dr.date))}</h3><div class="list">${L.map(x=>{const m=mat(x.m),c=cls(x.c);const fr=freeProfsAt(x.k,dr.pid,dr.date).sort((a,b)=>(b.mats.includes(x.m)-a.mats.includes(x.m))||(profCells(a.id).length-profCells(b.id).length));
    const cur=dr.rempl[x.k]||{};const [,s]=x.k.split("-").map(Number);
    return `<div class="item" style="cursor:default;flex-wrap:wrap"><span class="mat" style="${hcode(m.h)}">${esc(m.code)}</span><span class="grow"><b>${S.creneaux[s].debut}–${S.creneaux[s].fin} · ${esc(c.nom)}</b><span>${esc(salleNom(x.r)||"")}</span></span>
    <select class="in" style="flex:1 1 100%" id="ab-r-${x.k}" data-act="abPick" data-k="${x.k}">
      <option value="" ${!cur.pid&&!cur.t?"selected":""}>— À décider —</option><option value="perm" ${cur.t==="perm"?"selected":""}>Permanence / étude surveillée</option><option value="ratt" ${cur.t==="ratt"?"selected":""}>Cours rattrapé plus tard</option>
      ${fr.length?`<optgroup label="Professeurs libres à cette heure">${fr.map(q=>`<option value="${q.id}" ${cur.pid===q.id?"selected":""}>${esc(q.nom)}${q.mats.includes(x.m)?" ★ même matière":" ("+q.mats.map(z=>mat(z)?.code).join(", ")+")"}</option>`).join("")}</optgroup>`:""}</select></div>`}).join("")}</div>
  <span class="small muted">★ = professeur de la même matière, libre à cette heure. Les heures faites en remplacement comptent dans l'état des heures supplémentaires.</span>
  <div class="row"><button class="btn grow" data-act="abCancel">Annuler</button><button class="btn primary grow" data-act="abSave">Enregistrer l'absence</button></div></section>`}
function absText(a){const p=prof(a.pid);const L=absLessons(a.pid,a.date);
  return "*Absence de "+civ(p)+"* — "+frDay(a.date)+(a.motif?" ("+a.motif+")":"")+"\n"+L.map(x=>{const [,s]=x.k.split("-").map(Number);const r=a.rempl[x.k]||{};
    return "• "+S.creneaux[s].debut+"–"+S.creneaux[s].fin+" "+cls(x.c)?.nom+" "+(mat(x.m)?.code||"")+" ("+(salleNom(x.r)||"")+") → "+(r.pid?"remplacé par "+civ(prof(r.pid)):r.t==="perm"?"permanence":r.t==="ratt"?"cours rattrapé plus tard":"à décider")}).join("\n")+"\n\n"+(S.etab.etudesTitre||"Le Directeur des études")}

/* ---------- 3. Devoirs et compositions ---------- */
const EXAM_DUR={MATH:3,FR:3,PHILO:4,PC:2,SVT:2,HG:2,ANG:2,LV2:2,EDHC:0,TICE:0,AP:0,EPS:0};
function vDevoirs(){const X=S.exam=S.exam||{nom:"Devoirs de niveau — 1er trimestre",levels:[],dates:[],matin:"07H30",soir:"14H30",plan:null};
  const levels=NIV.filter(n=>S.classes.some(c=>c.niveau===n.id));
  return `<section class="card"><h2>${OUT_T.devoirs}</h2><p class="muted small" style="margin:0">Choisissez les niveaux et les jours : HorairePro fait le calendrier (une épreuve à la fois par niveau), met chaque classe dans sa salle et désigne les surveillants (jamais le professeur de la matière, chacun à son tour).</p>
  <label class="f">Nom de la session<input id="ex-nom" value="${esc(X.nom)}"></label>
  <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">Niveaux concernés<div class="chips">${levels.map(n=>`<button class="cchip ${X.levels.includes(n.id)?"on":""}" data-act="exLvl" data-v="${n.id}">${esc(n.l)}</button>`).join("")||"Ajoutez d'abord des classes."}</div></div>
  <div class="grid2"><label class="f">Ajouter un jour<input id="ex-day" type="date"></label><label class="f">&nbsp;<button class="btn" data-act="exAddDay">+ Ajouter ce jour</button></label></div>
  <div class="chips">${X.dates.map(d=>`<button class="cchip on" data-act="exDelDay" data-v="${d}">${esc(frDay(d))} ✕</button>`).join("")||`<span class="small muted">Aucun jour choisi.</span>`}</div>
  <div class="grid2"><label class="f">Début le matin<input id="ex-m" value="${esc(X.matin)}"></label><label class="f">Début l'après-midi<input id="ex-s" value="${esc(X.soir)}"></label></div>
  <span class="small muted">Épreuves : Maths et Français 3 h, Philosophie 4 h, les autres matières 2 h. Pas d'épreuve d'EPS, d'EDHC, de TICE ni de Dessin.</span>
  <button class="btn primary big block" data-act="exGen">Créer le calendrier</button></section>
  ${X.plan?examPlanCard(X):""}`}
function makeExamPlan(X){const sit=[];X.dates.sort().forEach(d=>{sit.push({d,h:X.matin});sit.push({d,h:X.soir})});
  const out=[];const warn=[];const load={};S.profs.forEach(p=>load[p.id]=0);
  for(const nid of X.levels){const subs=Object.entries(S.grille[nid]||{}).filter(([m,h])=>+h>0&&(EXAM_DUR[m]??2)>0).map(([m])=>m).sort((a,b)=>(EXAM_DUR[b]??2)-(EXAM_DUR[a]??2));
    if(subs.length>sit.length) warn.push(nnL(nid)+" : "+subs.length+" épreuves pour "+sit.length+" demi-journées. Ajoutez des jours.");
    subs.forEach((m,i)=>{if(i<sit.length) out.push({si:i,niv:nid,m,dur:EXAM_DUR[m]??2})})}
  // surveillants : par classe et par demi-journée, un prof libre (pas de la matière), répartition équitable
  for(const ex of out){ex.cl=S.classes.filter(c=>c.niveau===ex.niv).map(c=>{const used=new Set(out.filter(o=>o.si===ex.si&&o.cl).flatMap(o=>o.cl.map(x=>x.sv)));
    const cands=S.profs.filter(p=>!p.mats.includes(ex.m)&&!used.has(p.id)).sort((a,b)=>load[a.id]-load[b.id]);const sv=cands[0]?.id||null;if(sv)load[sv]+=ex.dur;
    return {c:c.id,salle:c.salle,sv}})}
  return {sit,out,warn,load}}
const nnL=id=>(NIV.find(n=>n.id===id)||{l:id}).l;
function examPlanCard(X){const P=X.plan;
  return `<section class="card"><div class="sec-title"><h3>${esc(X.nom)}</h3><button class="btn" data-act="exPdf">PDF</button></div>
  ${P.warn.map(w=>`<div class="banner"><span>${esc(w)}</span></div>`).join("")}
  ${P.sit.map((st,i)=>{const ex=P.out.filter(o=>o.si===i);if(!ex.length)return "";return `<div class="lvl"><div class="lvl-h"><b>${esc(frDay(st.d))} · ${esc(st.h)}</b></div>
    ${ex.map(e=>`<div class="small"><span class="mat" style="${hcode(mat(e.m)?.h||0)}">${esc(mat(e.m)?.code)}</span> <b>${esc(nnL(e.niv))}</b> · ${fmtH(e.dur)} (${esc(st.h)}–${esc(addMin(st.h,e.dur*60))})<br><span class="muted">${e.cl.map(x=>esc(cls(x.c)?.nom)+" en "+esc(salleNom(x.salle)||"?")+" — surveillant : "+esc(shortName(prof(x.sv)?.nom)||"à désigner")).join(" · ")}</span></div>`).join("")}</div>`}).join("")}
  <span class="small muted">Surveillances : ${Object.entries(P.load).filter(([,h])=>h).sort((a,b)=>b[1]-a[1]).map(([pid,h])=>esc(shortName(prof(pid)?.nom))+" "+fmtH(h)).join(" · ")||"—"}</span></section>`}
function examPdf(X){const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});const e=S.etab;const P=X.plan;
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(pdfTxt((e.nom||"").toUpperCase()),14,14);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(pdfTxt("Année scolaire "+e.annee),14,18);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(15,122,78);doc.text(pdfTxt(X.nom.toUpperCase()),105,28,{align:"center"});doc.setTextColor(20);
  const body=[];P.sit.forEach((st,i)=>P.out.filter(o=>o.si===i).forEach(ex=>ex.cl.forEach((x,j)=>body.push([j?"":pdfTxt(frDay(st.d)),j?"":st.h+"-"+addMin(st.h,ex.dur*60),pdfTxt(nnL(ex.niv)),pdfTxt(mat(ex.m)?.nom||ex.m),pdfTxt(cls(x.c)?.nom||""),pdfTxt(salleNom(x.salle)||""),pdfTxt(civ(prof(x.sv))||"à désigner")]))));
  doc.autoTable({startY:34,head:[["Jour","Heure","Niveau","Épreuve","Classe","Salle","Surveillant"]],body,theme:"grid",styles:{fontSize:7.5,cellPadding:1.4,textColor:20},headStyles:{fillColor:[15,122,78],textColor:255}});
  let y=doc.lastAutoTable.finalY+10;doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(pdfTxt(e.etudesTitre||"LE DIRECTEUR DES ÉTUDES"),196,y,{align:"right"});
  return doc}

/* ---------- 4. Heures supplémentaires du mois ---------- */
function hsupRows(year,month,weeks){const inMonth=a=>{const d=new Date(a.date+"T00:00:00");return d.getFullYear()===year&&d.getMonth()===month};
  const abs=(S.absences||[]).filter(inMonth);
  return S.profs.map(p=>{const hw=profCells(p.id).reduce((a,x)=>a+wOf(x),0);const du=+p.du||0;
    let absH=0,remH=0;for(const a of abs){if(a.pid===p.id)absH+=absLessons(p.id,a.date).reduce((s,x)=>s+wOf(x),0);for(const [k,r] of Object.entries(a.rempl||{}))if(r.pid===p.id){const x=absLessons(a.pid,a.date).find(z=>z.k===k);remH+=x?wOf(x):1}}
    const done=hw*weeks-absH+remH;const sup=Math.max(0,done-du*weeks);return {p,hw,du,absH,remH,done,sup,supW:Math.max(0,hw-du)}})}
function vHsup(){const d=new Date();const Y=UI.hsY??d.getFullYear(),Mo=UI.hsM??d.getMonth(),Wk=UI.hsW??4;const rows=hsupRows(Y,Mo,Wk);const tot=rows.reduce((a,r)=>a+r.sup,0);
  return `<section class="card"><h2>${OUT_T.hsup}</h2><p class="muted small" style="margin:0">Heures faites = heures de l'emploi du temps × semaines de cours − absences + remplacements. Au-delà des heures dues, ce sont des heures supplémentaires.</p>
  <div class="grid2"><label class="f">Mois<select id="hs-m" data-act="hsSet">${MOIS.map((m,i)=>`<option value="${i}" ${i===Mo?"selected":""}>${m}</option>`).join("")}</select></label>
  <label class="f">Année<input id="hs-y" type="number" data-act="hsSet" value="${Y}"></label><label class="f">Semaines de cours<input id="hs-w" type="number" min="1" max="5" data-act="hsSet" value="${Wk}"></label></div>
  <div class="row"><button class="btn primary" data-act="hsPdf">PDF</button><button class="btn" data-act="hsCsv">Excel (CSV)</button><span class="small muted grow" style="text-align:right">Total du mois : <b>${fmtH(tot)}</b></span></div></section>
  <section class="card"><div class="scroll"><table class="rec"><thead><tr><th>Professeur</th><th>Statut</th><th>H/sem.</th><th>Dues/sem.</th><th>Absences</th><th>Rempl.</th><th>Faites</th><th>H. sup.</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td>${esc(r.p.nom)}</td><td>${r.p.statut==="VACATAIRE"?"Vac.":"Perm."}</td><td class="n">${fmtH(r.hw)}</td><td class="n">${fmtH(r.du)}</td><td class="n">${r.absH?"−"+fmtH(r.absH):"—"}</td><td class="n">${r.remH?"+"+fmtH(r.remH):"—"}</td><td class="n">${fmtH(r.done)}</td><td class="n"><b>${r.sup?fmtH(r.sup):"—"}</b></td></tr>`).join("")}</tbody></table></div></section>`}
function hsupPdf(Y,Mo,Wk){const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});const e=S.etab;const rows=hsupRows(Y,Mo,Wk);
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(pdfTxt((e.nom||"").toUpperCase()),14,14);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(pdfTxt("Année scolaire "+e.annee+(e.dren?"  ·  DREN "+e.dren:"")),14,18);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(15,122,78);doc.text(pdfTxt("ÉTAT DES HEURES SUPPLÉMENTAIRES — "+MOIS[Mo].toUpperCase()+" "+Y),105,28,{align:"center"});doc.setTextColor(20);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(pdfTxt(Wk+" semaines de cours"),105,33,{align:"center"});
  doc.autoTable({startY:38,head:[["Professeur","Statut","Discipline","H/sem.","Dues/sem.","Absences","Rempl.","Faites","H. sup."]],
    body:rows.map(r=>[pdfTxt(r.p.nom),r.p.statut,r.p.mats.map(m=>mat(m)?.code).join(", "),fmtH(r.hw),fmtH(r.du),r.absH?"-"+fmtH(r.absH):"-",r.remH?"+"+fmtH(r.remH):"-",fmtH(r.done),r.sup?fmtH(r.sup):"-"]),
    foot:[["TOTAL","","","","","","","",fmtH(rows.reduce((a,r)=>a+r.sup,0))]],theme:"grid",styles:{fontSize:7.5,cellPadding:1.4,textColor:20},headStyles:{fillColor:[15,122,78],textColor:255},footStyles:{fillColor:[226,243,234],textColor:20,fontStyle:"bold"}});
  const y=doc.lastAutoTable.finalY+12;doc.setFont("helvetica","bold");doc.text(pdfTxt(e.etudesTitre||"LE DIRECTEUR DES ÉTUDES"),196,y,{align:"right"});if(e.etudesNom){doc.setFont("helvetica","normal");doc.text(pdfTxt(e.etudesNom),196,y+18,{align:"right"})}
  return doc}

/* ---------- 5. Statistiques ---------- */
function vStats(){const N=nS();let open=0;for(let d=0;d<5;d++)for(let s=0;s<N;s++) if(!isOff(d,s)) open++;
  const profs=S.profs.map(p=>({p,h:profCells(p.id).reduce((a,x)=>a+wOf(x),0)})).sort((a,b)=>b.h-a.h);const maxH=Math.max(1,...profs.map(x=>x.h));
  const use={};for(const c of S.classes)for(const v of Object.values(S.sched[c.id]||{})) if(v.r) use[v.r]=(use[v.r]||0)+W(v);
  const rooms=S.salles.map(r=>({r,h:use[r.id]||0,pct:Math.round((use[r.id]||0)/open*100)})).sort((a,b)=>b.pct-a.pct);
  const unass={};for(const c of S.classes)for(const v of Object.values(S.sched[c.id]||{})) if(!v.p) unass[v.m]=(unass[v.m]||0)+W(v);
  const totH=profs.reduce((a,x)=>a+x.h,0),totSup=S.profs.reduce((a,p)=>a+Math.max(0,profCells(p.id).reduce((s,x)=>s+wOf(x),0)-(+p.du||0)),0);
  const bar=(pct,cls2)=>`<span class="bar" style="width:100%;flex:1"><i class="${cls2||""}" style="width:${Math.min(100,pct)}%"></i></span>`;
  return `<section class="card"><h2>${OUT_T.stats}</h2></section>
  <div class="stats"><div class="stat"><b>${S.classes.reduce((a,c)=>a+(+c.effectif||0),0)}</b><span>élèves</span></div><div class="stat"><b>${fmtH(totH)}</b><span>heures de cours / semaine</span></div><div class="stat"><b>${fmtH(totSup)}</b><span>heures sup. / semaine</span></div><div class="stat"><b>${fmtH(Object.values(unass).reduce((a,b)=>a+b,0))}</b><span>heures à pourvoir</span></div></div>
  ${Object.keys(unass).length?`<section class="card"><h3>Cours sans professeur</h3><div class="list">${Object.entries(unass).map(([m,h])=>`<div class="item" style="cursor:default"><span class="mat" style="${hcode(mat(m)?.h||0)}">${esc(mat(m)?.code||m)}</span><span class="grow"><b>${esc(mat(m)?.nom||m)}</b><span>${fmtH(h)} par semaine à confier</span></span></div>`).join("")}</div></section>`:""}
  <div class="cards"><section class="card"><h3>Charge des professeurs</h3><div class="list">${profs.map(x=>`<div class="item" style="cursor:default"><span class="grow" style="flex:0 0 42%"><b>${esc(shortName(x.p.nom))}</b><span>${esc(x.p.mats.map(m=>mat(m)?.code).join(", "))}</span></span>${bar(x.h/maxH*100,x.h>(+x.p.du||0)?"":"")}<span class="small" style="width:52px;text-align:right">${fmtH(x.h)}</span></div>`).join("")}</div></section>
  <section class="card"><h3>Occupation des salles et terrains</h3><div class="list">${rooms.map(x=>`<div class="item" style="cursor:default"><span class="grow" style="flex:0 0 42%"><b>${esc(x.r.nom)}</b><span>${esc(x.r.type)}</span></span>${bar(x.pct)}<span class="small" style="width:52px;text-align:right">${x.pct} %</span></div>`).join("")}</div><span class="small muted">Pourcentage des ${open} heures de cours de la semaine.</span></section></div>`}

/* ---------- 7. Import rapide ---------- */
function guessNiv(nom){const n=strip(String(nom)).toLowerCase().replace(/\s+/g,"");
  if(/^6/.test(n))return "6e";if(/^5/.test(n))return "5e";if(/^4/.test(n))return "4e";if(/^3/.test(n))return "3e";
  const ser=n.match(/(a|c|d)\d*$/);const s=ser?ser[1].toUpperCase():"";
  if(/^(2|2nde|seconde)/.test(n))return s==="C"?"2ndeC":"2ndeA";if(/^(1|1ere|1re|premiere)/.test(n))return "1re"+(s||"D");if(/^(t|tle|term)/.test(n))return "Tle"+(s||"D");return ""}
function guessMat(t){const x=strip(String(t)).toUpperCase().replace(/[^A-Z]/g,"");const map={FRANCAIS:"FR",FR:"FR",ANGLAIS:"ANG",ANG:"ANG",MATHS:"MATH",MATH:"MATH",MATHEMATIQUES:"MATH",PC:"PC",PHYSIQUECHIMIE:"PC",PHYSIQUE:"PC",SVT:"SVT",HG:"HG",HISTOIREGEOGRAPHIE:"HG",HISTOGEO:"HG",EDHC:"EDHC",EPS:"EPS",ESPAGNOL:"LV2",ALLEMAND:"LV2",LV:"LV2",PHILO:"PHILO",PHILOSOPHIE:"PHILO",TICE:"TICE",INFORMATIQUE:"TICE",DESSIN:"AP",MUSIQUE:"AP",AP:"AP",ARTSPLASTIQUES:"AP"};
  return map[x]||S.matieres.find(m=>strip(m.code).toUpperCase()===x||strip(m.nom).toUpperCase().replace(/[^A-Z]/g,"")===x)?.id||""}
function parseImport(kind,text){const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const out=[],bad=[];
  for(const l of lines){const f=l.split(/\t|;|,(?=\s*[^\s])/).map(x=>x.trim());if(/^(nom|classe|name)\b/i.test(f[0]))continue;
    if(kind==="classes"){const niv=guessNiv(f[0]);if(!f[0]||!niv){bad.push(l);continue}out.push({nom:f[0],niveau:niv,effectif:+String(f[1]||"").replace(/\D/g,"")||0})}
    else{const mats=String(f[1]||"").split(/[\/+&]| et /i).map(guessMat).filter(Boolean);if(!f[0]||!mats.length){bad.push(l);continue}
      const sx=/^f/i.test(f[2]||"")?"F":"M";const st=/vac/i.test(f.join(" "))?"VACATAIRE":"PERMANENT";const tel=(f.find((x,i)=>i>=2&&/\d{8,}/.test(x.replace(/\s/g,"")))||"");
      out.push({nom:f[0],mats:[...new Set(mats)],sexe:sx,statut:st,tel})}}
  return {out,bad}}
function vImport(){const kind=UI.impKind||"classes";const ex=kind==="classes"?"6è1 ; 62\n6è2 ; 60\n2nde C ; 48\nTle D2 ; 45":"KOUAMÉ Ange ; PC ; M ; 07 00 00 00 00\nTRAORÉ Awa ; SVT ; F ; 05 00 00 00 00 ; vacataire\nKONÉ Ali ; Maths";
  const prev=UI.impPrev;
  return `<section class="card"><h2>${OUT_T.import}</h2><div class="seg"><button data-act="impKind" data-v="classes" aria-pressed="${kind==="classes"}">Classes</button><button data-act="impKind" data-v="profs" aria-pressed="${kind==="profs"}">Professeurs</button></div>
  <p class="muted small" style="margin:0">${kind==="classes"?"Une classe par ligne : <b>nom ; effectif</b>. Le niveau est reconnu tout seul (6è, 5è, 4è, 3è, 2nde A/C, 1ère A/C/D, Tle A/C/D).":"Un professeur par ligne : <b>nom et prénoms ; matière(s) ; sexe ; téléphone</b>. Ajoutez « vacataire » si besoin. Plusieurs matières : PC/SVT."} Vous pouvez aussi copier les colonnes depuis Excel et les coller ici.</p>
  <label class="f">Liste<textarea id="imp-txt" rows="7" placeholder="${esc(ex)}">${esc(UI.impTxt||"")}</textarea></label>
  <div class="row"><button class="btn" data-act="impFile">Choisir un fichier CSV</button><button class="btn primary grow" data-act="impCheck">Vérifier</button></div>
  <span class="small muted">Depuis Excel : Fichier → Enregistrer sous → CSV, puis choisissez le fichier ici.</span></section>
  ${prev?`<section class="card"><h3>${prev.out.length} ${kind==="classes"?"classe(s)":"professeur(s)"} prêt(s)</h3><div class="list">${prev.out.map(o=>`<div class="item" style="cursor:default"><span class="grow"><b>${esc(o.nom)}</b><span>${kind==="classes"?esc(nnL(o.niveau))+(o.effectif?" · "+o.effectif+" élèves":""):esc(o.mats.map(m=>mat(m)?.code).join(", "))+" · "+o.sexe+" · "+(o.statut==="VACATAIRE"?"vacataire":"permanent")+(o.tel?" · "+esc(o.tel):"")}</span></span></div>`).join("")}</div>
   ${prev.bad.length?`<div class="banner"><span><b>${prev.bad.length} ligne(s) non reconnue(s) :</b> ${prev.bad.map(esc).join(" | ")}</span></div>`:""}
   <button class="btn primary block" data-act="impDo" ${prev.out.length?"":"disabled"}>Ajouter à l'établissement</button></section>`:""}`}

/* ---------- événements des outils ---------- */
async function outilsClick(a,t,v){
  switch(a){
    case "outil": UI.outil=v||null;render();scrollTo(0,0);return true;
    case "shMode": UI.shMode=v;render();return true;
    case "shOne": shareEdt(t.dataset.k,v);return true;
    case "shDl": makePDF(t.dataset.k,[v],"EDT_"+(t.dataset.k==="prof"?prof(v).nom:cls(v).nom)+".pdf");return true;
    case "copyTxt": try{await navigator.clipboard.writeText(v);toast("Lien copié")}catch(e){toast("Sélectionnez le lien puis copiez-le.")}return true;
    case "abFind":{const pid=document.getElementById("ab-prof").value,date=document.getElementById("ab-date").value;if(!date){toast("Choisissez la date");return true}
      const ex=(S.absences||[]).find(x=>x.pid===pid&&x.date===date);UI.absDraft=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),pid,date,motif:document.getElementById("ab-motif").value.trim(),rempl:{}};render();return true}
    case "abCancel": UI.absDraft=null;render();return true;
    case "abSave":{const d=UI.absDraft;d.motif=document.getElementById("ab-motif")?.value.trim()||d.motif;S.absences=(S.absences||[]).filter(x=>x.id!==d.id);
      for(const x of absLessons(d.pid,d.date)) if(!d.rempl[x.k]) d.rempl[x.k]={};S.absences.push(d);UI.absDraft=null;save();render();toast("Absence enregistrée");return true}
    case "abDel": S.absences=(S.absences||[]).filter(x=>x.id!==v);save();render();toast("Absence supprimée");return true;
    case "abShare":{const ab=S.absences.find(x=>x.id===v);const txt=absText(ab);
      if(navigator.share){try{await navigator.share({text:txt});return true}catch(e){if(e.name==="AbortError")return true}}
      openSheet(`<h3>Partager l'absence</h3><textarea class="in" rows="10" readonly>${esc(txt)}</textarea><a class="btn block" style="background:#1FA855;color:#fff" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a><button class="btn" data-act="copyTxt" data-v="${esc(txt)}">Copier le texte</button><button class="btn ghost" data-act="close">Fermer</button>`);return true}
    case "exLvl":{const X=S.exam;X.levels=X.levels.includes(v)?X.levels.filter(x=>x!==v):[...X.levels,v];X.plan=null;save();render();return true}
    case "exAddDay":{const d=document.getElementById("ex-day").value;if(!d){toast("Choisissez un jour");return true}if(isoDay(d)<0){toast("Choisissez un jour du lundi au vendredi");return true}
      if(!S.exam.dates.includes(d))S.exam.dates.push(d);S.exam.plan=null;save();render();return true}
    case "exDelDay": S.exam.dates=S.exam.dates.filter(x=>x!==v);S.exam.plan=null;save();render();return true;
    case "exGen":{const X=S.exam;X.nom=document.getElementById("ex-nom").value.trim()||X.nom;X.matin=document.getElementById("ex-m").value.trim().toUpperCase().replace(":","H")||"07H30";X.soir=document.getElementById("ex-s").value.trim().toUpperCase().replace(":","H")||"14H30";
      if(!X.levels.length){toast("Choisissez au moins un niveau");return true}if(!X.dates.length){toast("Ajoutez au moins un jour");return true}X.plan=makeExamPlan(X);save();render();toast("Calendrier créé");return true}
    case "exPdf": if(!guard())return true;await saveFile("Calendrier_"+S.exam.nom+".pdf",examPdf(S.exam).output("arraybuffer"),"application/pdf");return true;
    case "hsPdf":{if(!guard())return true;const d=new Date();const Y=UI.hsY??d.getFullYear(),Mo=UI.hsM??d.getMonth(),Wk=UI.hsW??4;await saveFile("Heures_sup_"+MOIS[Mo]+"_"+Y+".pdf",hsupPdf(Y,Mo,Wk).output("arraybuffer"),"application/pdf");return true}
    case "hsCsv":{const d=new Date();const Y=UI.hsY??d.getFullYear(),Mo=UI.hsM??d.getMonth(),Wk=UI.hsW??4;const rows=hsupRows(Y,Mo,Wk);
      const csv="﻿Professeur;Statut;Discipline;Heures/semaine;Dues/semaine;Absences;Remplacements;Heures faites;Heures sup\n"+rows.map(r=>[r.p.nom,r.p.statut,r.p.mats.map(m=>mat(m)?.code).join("/"),r.hw,r.du,r.absH,r.remH,r.done,r.sup].map(x=>String(x).replace(".",",")).join(";")).join("\n");
      await saveFile("Heures_sup_"+MOIS[Mo]+"_"+Y+".csv",csv,"text/csv");return true}
    case "porteOne": if(!guard())return true;makePDF("salle",[v],"Porte_"+salleNom(v)+".pdf");return true;
    case "portesAll": if(!guard())return true;makePDF("salle",S.salles.map(r=>r.id),"Fiches_de_porte.pdf");return true;
    case "impKind": UI.impKind=v;UI.impPrev=null;render();return true;
    case "impCheck":{UI.impTxt=document.getElementById("imp-txt").value;UI.impPrev=parseImport(UI.impKind||"classes",UI.impTxt);render();return true}
    case "impFile":{const i=document.createElement("input");i.type="file";i.accept=".csv,.txt,text/csv,text/plain";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{UI.impTxt=String(r.result);UI.impPrev=parseImport(UI.impKind||"classes",UI.impTxt);render()};r.readAsText(f)};i.click();return true}
    case "impDo":{const P=UI.impPrev;if((UI.impKind||"classes")==="classes"){P.out.forEach(o=>{if(!S.classes.find(c=>c.nom.toLowerCase()===o.nom.toLowerCase()))S.classes.push({id:uid(),...o,pp:null,salle:""})})}
      else P.out.forEach(o=>{if(!S.profs.find(p=>p.nom.toLowerCase()===o.nom.toLowerCase()))S.profs.push({id:uid(),...o,diplome:"Licence",max:24,maxAuto:true,du:o.statut==="VACATAIRE"?0:18,indispo:{},matricule:"",origine:""})});
      S.exemple=false;const n=P.out.length;UI.impPrev=null;UI.impTxt="";save();render();toast(n+" ajouté(s). Pensez aux salles et aux affectations.");return true}
  }
  return false}
function outilsChange(a,t){
  if(a==="abPick"){const k=t.dataset.k,v=t.value;UI.absDraft.rempl[k]=v==="perm"||v==="ratt"?{t:v,k}:v?{pid:v,k}:{k};return true}
  if(a==="hsSet"){UI.hsM=+document.getElementById("hs-m").value;UI.hsY=+document.getElementById("hs-y").value;UI.hsW=Math.max(1,+document.getElementById("hs-w").value||4);render();return true}
  return false}

/* ===================== Mise en page mobile / ordinateur ===================== */
const LAYKEY="horairepro-affichage";
try{UI.layPref=localStorage.getItem(LAYKEY)||"auto"}catch(e){UI.layPref="auto"}
const mq=matchMedia("(min-width: 1000px)");
function applyLayout(){const lay=UI.layPref==="auto"?(mq.matches?"desk":"mob"):(UI.layPref==="desk"?"desk":"mob");
  const changed=UI.lay!==lay;UI.lay=lay;document.documentElement.dataset.layout=lay;return changed}
const THKEY="horairepro-theme";
try{UI.theme=localStorage.getItem(THKEY)||"light"}catch(e){UI.theme="light"}
function applyTheme(){if(UI.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=UI.theme}
applyTheme();
applyLayout();
mq.addEventListener?.("change",()=>{if(applyLayout()&&S) render()});

/* ===================== Démarrage ===================== */
(function init(){
  const loc=loadLocal();
  if(loc){S=migrate(loc)}else{S=defaultState();UI.welcome=true}
  render();loadLicence();
  {const q=new URLSearchParams(location.search).get("paiement");if(q){try{history.replaceState(null,"",location.pathname)}catch(e){}UI.welcome=false;setTimeout(()=>payCheck(q),300)}else setTimeout(()=>payCheck(null,true),1500)}
  if(STANDALONE&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();installEvt=ev;if(UI.tab==="set")render()});
  (async()=>{
    try{downloads=await window.claude?.use?.("downloads")}catch(e){}
    try{const db=await window.claude?.use?.("db");const user=await window.claude?.use?.("user");
      const id=user?await user.id():null;
      if(db&&id){dbDoc=db.doc("data/users/"+id+"/etab");const snap=await dbDoc.get();
        if(snap.exists){const d=snap.data();if(d&&d.json&&(+d.at||0)>(S.at||0)){S=migrate(JSON.parse(d.json));UI.welcome=false;render();loadLicence()}}
        else if(!UI.welcome) saveNow();}
    }catch(e){}
  })();
})();
